            70: "The 16th-century Church of Our Lady of the Conception of Muxima, on the bank of the Kwanza River, about 130 km from Luanda. It is the largest Marian shrine in sub-Saharan Africa and a national monument since 1924. The yearly pilgrimage is usually in the first two weeks of September; in 2024 it drew over 700,000 people.",
            71: "A 1583 fortress on the bank of the Cuanza River, one of Angola's oldest, linked to the Portuguese push inland and to the slave trade. Remains of the old church can still be seen. In August 2025 the government announced its restoration.",
            72: "Angola's smallest national park, 630 km², created to protect the giant sable antelope, the country's symbol. In August 2026 more than 200 giant sable antelopes were seen together. In 2024 the government announced the park would open to visitors, but we found no confirmation that it has: check before you go.",
            73: "Angola's first museum, founded in 1936 by the Diamang company. It holds ethnographic collections from the peoples of the east, above all the Chokwe (sculptures, masks, mats and chairs), as well as archaeology and natural history.",
            74: "Capital of the Kingdom of Kongo from before the Portuguese arrived in 1483 until 1915. The historic centre has been a UNESCO World Heritage Site since 2017.",
            75: "A museum created in 1976 in a 17th- and 18th-century seaside building that held enslaved people before they were shipped out and later became the customs house. It has about 9,150 pieces, with permanent, temporary and travelling exhibitions. It reopened in May 2023 after restoration work.",
            76: "A small fort on a hilltop above the Catumbela River, between Lobito and Benguela. Its first stone was laid on 5 October 1846, as the inscription over the gate says. It was listed as a monument of public interest in 1954. In 2024 it was badly decayed and awaiting restoration: check access before you go.",
            77: "A 1915 lighthouse on top of the cliffs on the east side of the entrance to Lobito harbour, facing the tip of the Restinga. It is a white cylindrical tower with a wide red band, restored between 2004 and 2007. The tower is not open to the public and the access, about 14 km from central Lobito, is best by 4x4: check before you go.",
            78: "A beach at the mouth of the Cubal River, a few kilometres from Lobito, used mostly by fishermen and people who live nearby. Good for walks along the sand.",

            80: "Three lagoons on the north bank of the Curoca River, about 20 km from the coast, in the desert south of Moçâmedes; also known as Arco do Carvalhão. The middle lagoon has natural sandstone arches. Access is over sand, by 4x4 only. The water depends on the rain: the lagoons were dry for six years, until 2018.",
            81: "A bay with a sandy beach about 15 km from Sumbe, next to a fishing village. The Fortim do Quicombo is right beside it.",

            83: "Dozens of lagoons among farmland north of Luanda, mostly on the way to Dande. Take the Caxito road to the Barra do Dande turn-off, then dirt tracks. The Lagoa do Panguila is one of the best known.",
            84: "Caves deep in the forest in the municipality of Ambuíla, about 300 km from Luanda. In 2014 they were voted one of the 7 Natural Wonders of Angola. You can only visit with permission from the traditional authorities: tell the municipal administration first, and it asks for permission in the village of Bombo. Access is hard because of the vegetation; go with a local guide.",
            85: "A lagoon crossed by the Luxico River, also known as Nakarumbo. In 2014 it was voted one of the 7 Natural Wonders of Angola. 338 plant species and 195 bird species have been recorded here. Legend says it was born from a village cursed by an old woman who was refused shelter. We found no information on roads or lodging: ask in Dundo before you go.",
            86: "Waterfalls on the Chiumbe River near the town of Dala, by the bridge on the road from Lunda Sul to Moxico. In 2014 they were voted one of the 7 Natural Wonders of Angola. The Chiumbe-Dala hydroelectric dam is nearby. Parts of the road are in poor condition; the nearest airport is Saurimo.",
            87: "Waterfalls about 15 metres high on the Cuemba River, surrounded by green. A concrete bridge gives access to the site.",
            88: "Luena is known as the city of peace: on 4 April 2002 the Memorandum of Understanding that ended the civil war was signed here. The Peace Monument was unveiled on 4 April 2012, ten years after peace. In 2024 the provincial government said the structure needed maintenance.",

            91: "A memorial in Oihole, Namacunde municipality, about 45 km from Ondjiva, where remains of Mandume ya Ndemufayo are buried. He was the last king of the Kwanyama and fought the colonial troops in the early 20th century. It was unveiled in 2002. Each \"trunk\" of the monument recalls a moment in the Kwanyama struggle. The Cunene government has announced the restoration of the complex.",

            69: "Una lengua de arena de unos 10 km que cierra la bahía de Lobito, con playas de agua limpia y varios restaurantes y bares.",
            70: "La iglesia de Nuestra Señora de la Concepción de Muxima, del siglo XVI, a orillas del río Kwanza, a unos 130 km de Luanda. Es el mayor santuario mariano del África subsahariana y monumento nacional desde 1924. La peregrinación anual suele ser en las dos primeras semanas de septiembre; en 2024 reunió a más de 700 000 personas.",
            71: "Fortaleza de 1583 a orillas del río Cuanza, una de las más antiguas de Angola, ligada al avance portugués hacia el interior y a la trata de esclavos. Aún se ven restos de la antigua iglesia. En agosto de 2025 el Gobierno anunció su rehabilitación.",
            72: "El parque nacional más pequeño de Angola, 630 km², creado para proteger el antílope sable gigante, símbolo del país. En agosto de 2026 se vieron juntos más de 200 antílopes sable gigantes. En 2024 el Gobierno anunció que el parque abriría a los visitantes, pero no encontramos confirmación: infórmese antes de ir.",
            73: "El primer museo de Angola, fundado en 1936 por la empresa Diamang. Tiene colecciones etnográficas de los pueblos del este, sobre todo de los chokwe (esculturas, máscaras, esteras y sillas), además de arqueología e historia natural.",
            74: "Capital del Reino del Congo desde antes de la llegada de los portugueses en 1483 hasta 1915. El centro histórico es Patrimonio Mundial de la UNESCO desde 2017.",
            75: "Museo creado en 1976 en un edificio de los siglos XVII y XVIII junto al mar, que fue almacén de esclavos antes del embarque y después aduana. Tiene unas 9150 piezas, con exposiciones permanentes, temporales e itinerantes. Reabrió en mayo de 2023 tras unas obras de rehabilitación.",
            76: "Pequeño fuerte en lo alto de un cerro sobre el río Catumbela, entre Lobito y Benguela. La primera piedra se colocó el 5 de octubre de 1846, como dice la inscripción sobre la puerta. Fue declarado monumento de interés público en 1954. En 2024 estaba muy deteriorado y a la espera de restauración: confirme el acceso antes de ir.",
            77: "Faro de 1915 en lo alto de los acantilados, en el lado este de la entrada del puerto de Lobito, frente a la punta de la Restinga. Es una torre cilíndrica blanca con una ancha franja roja, restaurada entre 2004 y 2007. La torre no está abierta al público y el acceso, a unos 14 km del centro de Lobito, es mejor en 4x4: infórmese antes de ir.",
            78: "Playa en la desembocadura del río Cubal, a pocos kilómetros de Lobito, frecuentada sobre todo por pescadores y gente de la zona. Buena para pasear por la arena.",
            79: "Playa junto al centro de Moçâmedes, con una arcada de arcos a lo largo de la arena que da sombra.",
            80: "Tres lagunas en la orilla norte del río Curoca, a unos 20 km de la costa, en el desierto al sur de Moçâmedes; también se conocen como Arco do Carvalhão. La laguna del medio tiene arcos naturales de arenisca. El acceso es por arena, solo en 4x4. El agua depende de la lluvia: las lagunas estuvieron secas seis años, hasta 2018.",
            81: "Bahía con una playa de arena a unos 15 km de Sumbe, junto a un pueblo de pescadores. Al lado está el Fortim do Quicombo.",
            82: "Pequeño fuerte de 1645-1646, donde el río Quicombo llega al mar, ligado a la ocupación holandesa y a la reconquista portuguesa: de aquí salió en 1648 la flota de Salvador Correia de Sá para recuperar Luanda. También sirvió para retener y embarcar a personas esclavizadas. Es monumento nacional desde 1924 y está en la lista indicativa de la UNESCO desde 1996.",
            83: "Decenas de lagunas entre plantaciones al norte de Luanda, sobre todo camino del Dande. Se va por la carretera de Caxito hasta el desvío de Barra do Dande y después por pistas de tierra. La Lagoa do Panguila es una de las más conocidas.",
            84: "Grutas en plena selva, en el municipio de Ambuíla, a unos 300 km de Luanda. En 2014 fueron elegidas una de las 7 Maravillas Naturales de Angola. Solo se visitan con autorización de las autoridades tradicionales: avise primero a la administración municipal, que pide permiso en la aldea de Bombo. El acceso es difícil por la vegetación; vaya con un guía local.",
            85: "Laguna atravesada por el río Luxico, también conocida como Nakarumbo. En 2014 fue elegida una de las 7 Maravillas Naturales de Angola. Se han registrado 338 especies de plantas y 195 de aves. Según la leyenda, nació de una aldea maldecida por una anciana a la que negaron cobijo. No encontramos información sobre carreteras ni alojamiento: infórmese en Dundo antes de ir.",
            86: "Cataratas en el río Chiumbe, cerca de la localidad de Dala, junto al puente de la carretera que une Lunda Sul y Moxico. En 2014 fueron elegidas una de las 7 Maravillas Naturales de Angola. Cerca está la presa hidroeléctrica de Chiumbe-Dala. La carretera tiene tramos en mal estado; el aeropuerto más cercano es el de Saurimo.",
            87: "Cascadas de unos 15 metros en el río Cuemba, rodeadas de verde. Un puente de hormigón da acceso al lugar.",
            88: "Luena es conocida como la ciudad de la paz: aquí se firmó, el 4 de abril de 2002, el Memorando de Entendimiento que puso fin a la guerra civil. El Monumento a la Paz se inauguró el 4 de abril de 2012, a los diez años de la paz. En 2024, el gobierno provincial decía que la estructura necesitaba mantenimiento.",
            89: "El mayor lago de Angola, de unos 200 km² y poco profundo (1,5 metros de media), en la cuenca del Zambeze. Tiene muchos peces y aves acuáticas y está cerca del Parque Nacional de Cameia. Aún hay poco alojamiento y las carreteras son difíciles, sobre todo en la época de lluvias.",
            90: "Parque nacional de 14 450 km², creado como reserva de caza en 1935 y parque nacional en 1957. Gran parte son llanuras que se inundan en la época de lluvias, en la cuenca del Zambeze, y bosques de miombo. Está a unos 125 km de Luena. Confirme el acceso antes de ir.",
            91: "Memorial en Oihole, en el municipio de Namacunde, a unos 45 km de Ondjiva, donde están enterrados restos de Mandume ya Ndemufayo, el último rey de los kwanyama, que luchó contra las tropas coloniales a principios del siglo XX. Se inauguró en 2002. Cada «tronco» del monumento recuerda un momento de la lucha de los kwanyama. El Gobierno de Cunene anunció la rehabilitación del complejo.",
            92: "Parque nacional de 22 610 km² creado en 2011 en el sureste de Angola. En julio de 2026 abrió el Luiana Plains Safari, el primer campamento turístico del parque, en los humedales del río Cuando, con safaris, caminatas y paseos en barco.",
            93: "Isla en el río Cuebe, a unos 32 km de Menongue, buena para hacer pícnic. La carretera es casi toda buena, pero los últimos 6 km son una pista que en algunos puntos cruza agua.",

            {

        const placeLine = (v) => (areaOf(v) && areaOf(v) !== cityOf(v) ? `${areaOf(v)}, ${cityOf(v)}` : cityOf(v));
        const catLabel = (type, plural) => CATEGORY[type][lang][plural ? 0 : 1];
        const DESC = { en: DESC_EN, fr: DESC_FR, es: DESC_ES };
        const descOf = (v) => (lang === 'pt' ? v.description : DESC[lang][v.id] || DESC_EN[v.id] || v.description);
        const highlightOf = (v) => v.highlight?.[lang] || '';
        const placesCount = (n) => (n === 1 ? t('placesCountOne') : t('placesCount', { n }));

        function formatDate(iso) {
            return new Date(`${iso}T12:00:00Z`).toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' });
        }

        /* ---------- Prices ---------- */

        function kz(value) {
            return (value / 1000).toLocaleString(locale(), { maximumFractionDigits: 1 });
        }

        // Small fares read better in full (300 Kz) than in thousands (0,3 mil Kz).
        function kzAmount(from, to) {
            if (from < 1000 && (!to || to < 1000)) return `${from.toLocaleString(locale())}${to ? `–${to.toLocaleString(locale())}` : ''} Kz`;
            return to ? t('kzThousandRange', { a: kz(from), b: kz(to) }) : t('kzThousand', { a: kz(from) });
        }

        function priceText(v) {
            const p = v.price;
            if (!p) return t('priceTBC');
            if (p.free) return t('free');
            if (p.text) return p.text[lang] || p.text.pt;
            const unit = { person: t('perPerson'), night: t('perNight'), entry: t('perEntry'), trip: t('perTrip'), month: t('perMonth') }[p.per];
            return [kzAmount(p.from, p.to), unit].filter(Boolean).join(' ');
        }

        /* ---------- Dollars and euros (official BNA reference rate) ---------- */

        // Rate checked on 10 October 2026; the app refreshes it from the BNA at most once a day.
        let fx = store.get('angoliveFx', null) || { date: '2026-10-09', usd: 913, eur: 1048.8286 };

        async function loadFx() {
            if (fx.checked === new Date().toISOString().slice(0, 10)) return;
            try {
                const rate = async (code) => {
                    const res = await fetch(`https://www.bna.ao/service/rest/taxas/get/taxa/referencia?moeda=${code}&tipocambio=m`);
                    const row = (await res.json())?.genericResponse?.[0];
                    if (!res.ok || !(row?.taxa > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(row.data)) throw new Error('fx');
                    return row;
                };
                const [usd, eur] = await Promise.all([rate('usd'), rate('eur')]);
                fx = { date: usd.data, usd: usd.taxa, eur: eur.taxa, checked: new Date().toISOString().slice(0, 10) };
                store.set('angoliveFx', fx);
            } catch {}
        }

        function foreign(value, rate) {
            const amount = value / rate;
            const digits = amount < 1 ? 2 : amount < 10 ? 1 : 0;
            return amount.toLocaleString(locale(), { minimumFractionDigits: amount < 1 ? 2 : 0, maximumFractionDigits: digits });
        }

        // "≈ 12 USD · 11 EUR" next to a price in Kwanza; nothing when the price is free, text-only or unknown.
        function fxText(v) {
            const p = v.price;
            if (!p || p.free || p.text || !p.from) return '';
            const range = (rate) => (p.to ? `${foreign(p.from, rate)}–${foreign(p.to, rate)}` : foreign(p.from, rate));
            return `≈ ${range(fx.usd)} USD · ${range(fx.eur)} EUR`;
        }

        const fxNote = () => t('fxNote', { date: formatDate(fx.date) });

        function priceValue(v) {
            if (!v.price) return Infinity;
            return v.price.free ? 0 : v.price.from;
        }

        function phoneDigits(v) {
            const digits = v.phone.replace(/\D/g, '');
            return digits.length >= 9 ? digits : '';
        }

        function initials(name) {
            return name.split(/\s+/).filter((w) => /^[A-Za-zÀ-ÿ]/.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
        }

        function stars(n) {
            const full = Math.round(n);
            return '★'.repeat(full) + '☆'.repeat(5 - full);
        }

        /* ---------- Search: accent-insensitive, plural-aware, tolerant of small typos ---------- */

        // Words people use that the place texts may phrase differently.
        const SYNONYMS = {
            cascata: ['queda'], cachoeira: ['queda'], waterfall: ['queda'],
            pousada: ['hotel', 'alojamento'], hospedagem: ['hotel', 'alojamento'], hostel: ['hotel', 'alojamento'],
            boate: ['discoteca'], balada: ['discoteca'], disco: ['discoteca'],
            dinheiro: ['cambio'], money: ['cambio'], exchange: ['cambio'],
            museum: ['museu'], church: ['igreja'], igreja: ['catedral'],
            taxi: ['candongueiro', 'yango'], uber: ['yango'], onibus: ['autocarro'], bus: ['autocarro'], train: ['comboio'],
            voo: ['aeroporto'], flight: ['aeroporto'], airport: ['aeroporto'], ferry: ['travessia'], boat: ['barco', 'travessia'],
            gym: ['ginasio'], academia: ['ginasio'], pool: ['piscina'], swimming: ['piscina'], natacao: ['piscina'],
            mall: ['shopping'], compras: ['shopping'], square: ['largo'], praca: ['largo'], pub: ['bar'], cocktail: ['bar'],
            plage: ['praia'], playa: ['praia'], musee: ['museu'], museo: ['museu'], eglise: ['igreja'], iglesia: ['igreja'],
            cascade: ['queda'], chute: ['queda'], cascada: ['queda'], catarata: ['queda'], gare: ['comboio'], tren: ['comboio'],
            hotel: ['alojamento'], salle: ['ginasio'], gimnasio: ['ginasio'], change: ['cambio'], cambio: ['cambio'], aeroport: ['aeroporto'], aeropuerto: ['aeroporto']
        };

        const STOPWORDS = new Set(['a', 'o', 'as', 'os', 'e', 'em', 'no', 'na', 'nos', 'nas', 'de', 'da', 'do', 'das', 'dos', 'para', 'com', 'um', 'uma', 'the', 'of', 'in', 'and', 'to', 'at', 'le', 'la', 'les', 'des', 'du', 'et', 'un', 'une', 'el', 'los', 'las', 'del', 'al', 'y', 'por']);

        function normalize(text) {
            return String(text).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        }

        // Portuguese plurals: hotéis→hotel, locais→local, mares→mar, praias→praia.
        function stem(word) {
            if (word.length <= 3) return word;
            if (/(oe|ae)s$/.test(word)) return `${word.slice(0, -3)}ao`;
            if (word.endsWith('ais')) return `${word.slice(0, -3)}al`;
            if (word.endsWith('eis')) return `${word.slice(0, -3)}el`;
            if (word.endsWith('ois')) return `${word.slice(0, -3)}ol`;
            if (word.endsWith('ns')) return `${word.slice(0, -2)}m`;
            if (/[rzs]es$/.test(word)) return word.slice(0, -2);
            if (word.endsWith('s')) return word.slice(0, -1);
            return word;
        }

        function tokens(text) {
            return normalize(text).split(/[^a-z0-9]+/).filter((w) => w && !STOPWORDS.has(w)).map(stem);
        }

        function withinOneEdit(a, b) {
            if (Math.abs(a.length - b.length) > 1) return false;
            let i = 0;
            let j = 0;
            let edits = 0;
            while (i < a.length && j < b.length) {
                if (a[i] === b[j]) { i++; j++; continue; }
                if (++edits > 1) return false;
                if (a.length > b.length) i++;
                else if (a.length < b.length) j++;
                else { i++; j++; }
            }
            return edits + (a.length - i) + (b.length - j) <= 1;
        }

        const tokenMatches = (word, list) => list.some((tk) => tk.startsWith(word) || (word.length >= 5 && withinOneEdit(word, tk)));

        let searchIndex = null;
        function index() {
            if (searchIndex) return searchIndex;
            const fullText = (v) => [
                v.name, v.location, v.address || '', v.description, DESC_EN[v.id] || '', DESC_FR[v.id] || '', DESC_ES[v.id] || '',
                ...LANGS.map((l) => v.highlight?.[l] || ''),
                CATEGORY[v.type].keywords, ...LANGS.map((l) => CATEGORY[v.type][l].join(' ')),
                v.family ? 'família famílias crianças family families kids' : '',
                v.price?.free ? 'grátis gratuito gratuita entrada free' : ''
            ].join(' ');
            searchIndex = {
                all: new Map(venues.map((v) => [v.id, tokens(fullText(v))])),
                name: new Map(venues.map((v) => [v.id, tokens(v.name)])),
                category: Object.fromEntries(Object.entries(CATEGORY).map(([key, c]) => [key, tokens(`${c.keywords} ${LANGS.map((l) => c[l].join(' ')).join(' ')}`)]))
            };
            return searchIndex;
        }

        const alternatives = (word) => [word, ...(SYNONYMS[word] || [])];

        function matchesQuery(v, q) {
            const words = tokens(q);
            return words.every((w) => alternatives(w).some((alt) => tokenMatches(alt, index().all.get(v.id))));
        }

        // Name matches rank first, then places whose category fits the words, then any other text match.
        function queryScore(v, q) {
            const words = tokens(q);
            if (!words.length) return 0;
            const hits = (list) => (w) => alternatives(w).some((alt) => tokenMatches(alt, list));
            if (words.every(hits(index().name.get(v.id)))) return 3;
            if (words.some(hits(index().category[v.type]))) return 2;
            return 1;
        }

        /* ---------- Opening hours (Angola time, UTC+1, no daylight saving) ---------- */

        const toMinutes = (hhmm) => {
            const [h, m] = hhmm.split(':').map(Number);
            return h * 60 + m;
        };

        function luandaNow() {
            const d = new Date(Date.now() + 60 * 60 * 1000);
            return { day: d.getUTCDay(), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
        }

        function weekdayName(day) {
            return new Intl.DateTimeFormat(locale(), { weekday: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(2024, 0, 7 + day)));
        }

        function openStatus(v) {
            if (!v.hours) return null;
            const { day, minutes } = luandaNow();
            for (const [o, c] of v.hours[day] || []) {
                const open = toMinutes(o);
                const close = toMinutes(c) <= open ? toMinutes(c) + 1440 : toMinutes(c);
                if (minutes >= open && minutes < close) return { open: true, until: c };
            }
            for (const [o, c] of v.hours[(day + 6) % 7] || []) {
                if (toMinutes(c) <= toMinutes(o) && minutes < toMinutes(c)) return { open: true, until: c };
            }
            for (let i = 0; i < 7; i++) {
                const d = (day + i) % 7;
                const next = (v.hours[d] || []).find(([o]) => i > 0 || toMinutes(o) > minutes);
                if (next) return { open: false, at: next[0], day: i === 0 ? null : d };
            }
            return { open: false };
        }

        function statusText(status) {
            if (!status) return '';
            if (status.open) return t('openUntil', { time: status.until });
            if (!status.at) return t('closed');
            return status.day === null ? t('closedOpensAt', { time: status.at }) : t('closedOpensDay', { day: weekdayName(status.day), time: status.at });
        }

        function statusHTML(v) {
            const status = openStatus(v);
            return status ? `<span class="${status.open ? 'status-open' : 'status-closed'}">${statusText(status)}</span>` : '';
        }

        /* ---------- Location ---------- */

        function kmBetween(a, b) {
            const rad = (d) => (d * Math.PI) / 180;
            const dLat = rad(b.lat - a.lat);
            const dLng = rad(b.lng - a.lng);
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
        }

        const distanceKm = (v) => (state.userPos ? kmBetween(state.userPos, v) : null);
        const formatKm = (km) => km.toLocaleString(locale(), { maximumFractionDigits: km < 100 ? 1 : 0 });

        function distanceText(v) {
            const km = distanceKm(v);
            return km === null ? '' : t('distance', { d: formatKm(km) });
        }

        function setNotice(text) {
            $('notice').textContent = text;
        }

        function locate() {
            if (state.userPos) return;
            if (!navigator.geolocation) { setNotice(t('locError')); return; }
            setNotice(t('locating'));
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    setNotice('');
                    render();
                    if (state.openId) openVenue(state.openId, true);
                },
                () => setNotice(t('locError')),
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
            );
        }

        /* ---------- Images ---------- */

        // Photos are stored with the site (photos/), so they load wherever the site loads, also offline.
        // The iPhone app only bundles the page, so it fetches them from the public site.
        const asset = (src) => (src && inNativeApp && !/^(https?:|blob:|data:)/.test(src) ? new URL(src, PUBLIC_URL).href : src);

        function thumbSrc(v) {
            if (v.photos) return asset(v.photos[0].thumb);
            return v.image ? asset(v.image.replace('-800.jpg', '-600.jpg')) : '';
        }

        const fullSrc = (photo) => asset(photo.url.replace('/1280px-', '/960px-'));

        // A photo can name the part to keep when it is cropped (CSS object-position), e.g. a statue at the top of the frame.
        const photoFocus = (photo) => (/^\d{1,3}% \d{1,3}%$/.test(photo?.focus || '') ? photo.focus : '');
        const focusAttr = (photo) => (photoFocus(photo) ? ` style="object-position: ${photoFocus(photo)}"` : '');

        function creditHTML(photo) {
            return `${t('photoBy')}: <a href="${escapeHTML(photo.page)}" target="_blank" rel="noopener">${escapeHTML(photo.author)}</a> · ${escapeHTML(photo.license)} · Wikimedia Commons`;
        }

        // A venue photo carries a caption when it shows something next to the place, such as the building it is in.
        const placePhotoMeta = (photo) => `${photo.caption ? `${escapeHTML(photo.caption[lang])} · ` : ''}${creditHTML(photo)}`;

        // Show the small image the card already loaded straight away, then swap in the sharper one.
        function upgradeHero(src) {
            const img = $('heroImg');
            if (!img) return;
            const sharp = new Image();
            sharp.crossOrigin = 'anonymous';
            sharp.onload = () => { if ($('heroImg') === img) img.src = src; };
            sharp.src = src;
        }

        function heroHTML(v) {
            const photos = v.photos || [];
            const hero = `
                <div class="modal-hero">
                    <span>${escapeHTML(initials(v.name))}</span>
                    ${thumbSrc(v) ? `<img id="heroImg" src="${escapeHTML(thumbSrc(v))}" alt="${escapeHTML(v.name)}"${focusAttr(photos[0])} crossorigin="anonymous" onerror="this.remove()">` : ''}
                    ${!photos.length && v.image ? `<span class="photo-badge">${t('illustrative')}</span>` : ''}
                </div>`;
            if (!photos.length) return hero;
            return `${hero}
                <div class="photo-meta">
                    <p class="photo-credit" id="heroCredit">${placePhotoMeta(photos[0])}</p>
                    ${photos.length > 1 ? `<div class="photo-strip">${photos.map((p, i) => `
                        <button type="button" class="photo-thumb${i === 0 ? ' active' : ''}" data-photo="${i}" aria-label="${t('photoN', { n: i + 1 })}">
                            <img src="${escapeHTML(asset(p.thumb))}" alt="" crossorigin="anonymous" loading="lazy">
                        </button>`).join('')}</div>` : ''}
                </div>`;
        }

        function showPhoto(index) {
            const v = venues.find((x) => x.id === state.openId);
            const photo = v?.photos?.[index];
            if (!photo) return;
            const img = $('heroImg');
            if (img) {
                img.src = asset(photo.thumb);
                img.style.objectPosition = photoFocus(photo);
            }
            upgradeHero(fullSrc(photo));
            $('heroCredit').innerHTML = placePhotoMeta(photo);
            document.querySelectorAll('.photo-thumb').forEach((b) => b.classList.toggle('active', Number(b.dataset.photo) === index));
        }

        // Without verified coordinates, let Google Maps find the place by name.
        function mapsURL(v, mode) {
            const target = v.exact ? `${v.lat},${v.lng}` : encodeURIComponent(`${v.name}, ${v.location}, Angola`);
            return mode === 'directions'
                ? `https://www.google.com/maps/dir/?api=1&destination=${target}`
                : `https://www.google.com/maps/search/?api=1&query=${target}`;
        }

        function mapEmbedURL(v) {
            const dLat = 0.006;
            const dLng = 0.01;
            return `https://www.openstreetmap.org/export/embed.html?bbox=${v.lng - dLng},${v.lat - dLat},${v.lng + dLng},${v.lat + dLat}&layer=mapnik&marker=${v.lat},${v.lng}`;
        }

        /* ---------- Ratings (only real reviews from visitors) ---------- */

        const statsOf = (v) => ratingStats[v.id];
        const reviewCountText = (n) => (n === 1 ? t('reviewOne') : t('reviewMany', { n }));

        function ratingLinkHTML(stats) {
            return stats ? `<span class="rating">★ ${stats.avg.toFixed(1)}</span>${reviewCountText(stats.count)}` : t('opinionsLink');
        }

        function avgHTML(stats) {
            if (!stats) {
                return `
                    <span class="avg-icon" aria-hidden="true">${icon('star')}</span>
                    <span class="avg-text"><span class="avg-title">${t('noStarsTitle')}</span><span class="avg-count">${t('noStarsSub')}</span></span>`;
            }
            return `
                <span class="avg-number">${stats.avg.toFixed(1)}</span>
                <span class="avg-text"><span class="stars" aria-hidden="true">${stars(stats.avg)}</span><span class="avg-count">${reviewCountText(stats.count)}</span></span>`;
        }

        // Stats arrive after the first render; update an already open place in place.
        function refreshOpenRating() {
            const v = venues.find((x) => x.id === state.openId);
            if (!v) return;
            const link = document.querySelector('#venuePanel .rating-link');
            const avg = document.querySelector('#reviewsSection .avg');
            const note = $('ratingNote');
            if (link) link.innerHTML = ratingLinkHTML(statsOf(v));
            if (avg) avg.innerHTML = avgHTML(statsOf(v));
            if (note) note.hidden = !statsOf(v);
        }

        async function loadRatingStats() {
            if (!reviewsEnabled()) return;
            try {
                const res = await sbRequest('/rest/v1/review_stats?select=venue_id,avg_rating,review_count', { headers: sbHeaders() });
                ratingStats = Object.fromEntries((await res.json()).map((r) => [r.venue_id, { avg: Number(r.avg_rating), count: r.review_count }]));
                render();
                refreshOpenRating();
            } catch {
                ratingStats = {};
            }
        }

        /* ---------- Filters and URL ---------- */

        const slug = (text) => normalize(text).replace(/[^a-z0-9]+/g, '-');
        const hasFilters = (f) => Boolean(f.q || f.where || f.quick || f.category || f.collection || f.saved);

        function filtersToQuery(f) {
            const params = new URLSearchParams();
            if (f.q) params.set('q', f.q);
            if (f.where) params.set('where', f.where === 'near' ? 'near' : slug(f.where));
            if (f.quick) params.set('filter', f.quick);
            if (f.category) params.set('category', f.category);
            if (f.collection) params.set('collection', f.collection);
            if (f.saved) params.set('saved', '1');
            return params.toString();
        }

        function filtersFromQuery(search) {
            const params = new URLSearchParams(search);
            const where = params.get('where');
            const has = (obj, key) => Boolean(key && Object.prototype.hasOwnProperty.call(obj, key));
            return {
                q: (params.get('q') || '').slice(0, 80),
                where: where === 'near' ? 'near' : CITIES.find((c) => slug(c) === (OLD_WHERE[where] || where)) || '',
                quick: has(QUICK, params.get('filter')) ? params.get('filter') : null,
                category: has(CATEGORY, params.get('category')) ? params.get('category') : null,
                collection: has(COLLECTIONS, params.get('collection')) ? params.get('collection') : null,
                saved: params.get('saved') === '1'
            };
        }

        function collectionMatch(key, v) {
            const c = COLLECTIONS[key];
            return c.ids ? c.ids.includes(v.id) : c.match(v);
        }

        function filteredVenues() {
            const f = state.filters;
            const list = venues.filter((v) =>
                (!f.saved || favorites.includes(v.id)) &&
                (!f.category || v.type === f.category) &&
                (!f.collection || collectionMatch(f.collection, v)) &&
                (!f.quick || QUICK[f.quick].match(v)) &&
                (!f.where || f.where === 'near' || cityOf(v) === f.where) &&
                matchesQuery(v, f.q)
            );
            const useDistance = state.userPos && (state.sort === 'distance' || (state.sort === 'relevance' && (f.where === 'near' || f.quick === 'near')));
            const byRating = (a, b) => (statsOf(b)?.avg || 0) - (statsOf(a)?.avg || 0) || (statsOf(b)?.count || 0) - (statsOf(a)?.count || 0);
            const recRank = (v) => {
                if (f.collection && COLLECTIONS[f.collection].ids) return COLLECTIONS[f.collection].ids.indexOf(v.id);
                const i = RECOMMENDED.indexOf(v.id);
                return i === -1 ? 99 : i;
            };
            const sorters = {
                relevance: (a, b) => queryScore(b, f.q) - queryScore(a, f.q) || recRank(a) - recRank(b) || byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                rating: (a, b) => byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                price: (a, b) => priceValue(a) - priceValue(b) || a.name.localeCompare(b.name, 'pt'),
                name: (a, b) => a.name.localeCompare(b.name, 'pt'),
                distance: (a, b) => distanceKm(a) - distanceKm(b)
            };
            const key = state.sort === 'distance' || (state.sort === 'rating' && !reviewsEnabled()) ? 'relevance' : state.sort;
            return list.sort(useDistance ? sorters.distance : sorters[key]);
        }

        function syncSearchForm() {
            $('qInput').value = state.filters.q;
            $('whereSelect').value = state.filters.where;
        }

        function showResults(filters, { push = true, scroll = true } = {}) {
            state.filters = { ...DEFAULT_FILTERS, ...filters };
            state.view = 'results';
            state.sort = 'relevance';
            renderSortOptions();
            syncSearchForm();
            if (push) history.pushState(null, '', `${location.pathname}?${filtersToQuery(state.filters)}`);
            if (state.filters.where === 'near' || state.filters.quick === 'near') locate();
            render();
            if (scroll) $('resultsView').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showRecommend({ push = true } = {}) {
            state.view = 'recommend';
            prepareRecommendForm();
            if (push) history.pushState(null, '', `${location.pathname}?page=recommend`);
            render();
            window.scrollTo({ top: 0 });
            $('recTitle').focus?.();
        }

        function showGuide({ push = true, section = '' } = {}) {
            state.view = 'guide';
            if (push) history.pushState(null, '', `${location.pathname}?page=guide${section ? `#guia-${section}` : ''}`);
            render();
            const target = section && $(`guia-${section}`);
            if (target) target.scrollIntoView({ block: 'start' });
            else window.scrollTo({ top: 0 });
        }

        function showMap({ push = true } = {}) {
            state.view = 'map';
            if (push) history.pushState(null, '', `${location.pathname}?page=map`);
            render();
            window.scrollTo({ top: 0 });
        }

        function showRoutes({ push = true, route = '' } = {}) {
            state.view = 'routes';
            if (push) history.pushState(null, '', `${location.pathname}?page=routes${route ? `#roteiro-${route}` : ''}`);
            render();
            const target = route && $(`roteiro-${route}`);
            if (target) target.scrollIntoView({ block: 'start' });
            else window.scrollTo({ top: 0 });
        }

        function showWonders({ push = true, section = '' } = {}) {
            state.view = 'wonders';
            if (push) history.pushState(null, '', `${location.pathname}?page=maravilhas${section ? `#maravilha-${section}` : ''}`);
            render();
            const target = section && $(`maravilha-${section}`);
            if (target) target.scrollIntoView({ block: 'start' });
            else window.scrollTo({ top: 0 });
        }

        function goHome({ push = true } = {}) {
            state.view = 'home';
            state.filters = { ...DEFAULT_FILTERS };
            syncSearchForm();
            if (push) history.pushState(null, '', location.pathname);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function applyURL() {
            const filters = filtersFromQuery(location.search);
            const params = new URLSearchParams(location.search);
            if (params.get('page') === 'recommend') {
                if (state.view !== 'recommend') showRecommend({ push: false });
            } else if (params.get('page') === 'events') showEvents({ push: false, filters: eventFiltersFromQuery(params) });
            else if (params.get('page') === 'map') { if (state.view !== 'map') showMap({ push: false }); }
            else if (params.get('page') === 'routes') {
                const route = location.hash.match(/^#roteiro-([a-z-]+)$/)?.[1] || '';
                if (state.view !== 'routes' || route) showRoutes({ push: false, route: ITINERARIES.some((r) => r.id === route) ? route : '' });
            } else if (params.get('page') === 'maravilhas') {
                const section = location.hash.match(/^#maravilha-([a-z0-9-]+)$/)?.[1] || '';
                if (state.view !== 'wonders' || section) showWonders({ push: false, section });
            } else if (params.get('page') === 'guide') {
                const section = location.hash.match(/^#guia-([a-z]+)$/)?.[1] || '';
                if (state.view !== 'guide' || section) showGuide({ push: false, section: GUIDE.some((g) => g.id === section) ? section : '' });
            }
            else if (hasFilters(filters)) showResults(filters, { push: false, scroll: false });
            else if (state.view !== 'home') goHome({ push: false });
            const deepLink = location.hash.match(/^#local-(\d+)$/);
            if (deepLink) openVenue(Number(deepLink[1]));
            else if (state.openId) closeModal('venueModal', { updateURL: false });
            const eventLink = location.hash.match(/^#evento-([\w-]+)$/);
            if (eventLink && state.view === 'events') focusEvent(eventLink[1]);
        }

        /* ---------- Cards and rows ---------- */

        function cardHTML(v, options = {}) {
            const stats = statsOf(v);
            const dist = distanceText(v);
            const saved = favorites.includes(v.id);
            const highlight = options.reason
                ? `<p class="card-reason"><b>${t('why')}</b> ${escapeHTML(highlightOf(v))}</p>`
                : `<p class="card-highlight">${escapeHTML(highlightOf(v))}</p>`;
            return `
                <article class="card">
                    <button class="card-media" type="button" data-open="${v.id}" aria-label="${t('viewPlace')}: ${escapeHTML(v.name)}">
                        <span aria-hidden="true">${escapeHTML(initials(v.name))}</span>
                        ${thumbSrc(v) ? `<img src="${escapeHTML(thumbSrc(v))}" alt=""${focusAttr(v.photos?.[0])} crossorigin="anonymous" loading="lazy" onerror="this.remove()">` : ''}
                        ${saved ? `<span class="saved-tag">${icon('heart')}${t('saved')}</span>` : ''}
                    </button>
                    <div class="card-body">
                        <span class="card-type">${icon(CATEGORY[v.type].icon)}${catLabel(v.type, false)} · ${escapeHTML(placeLine(v))}</span>
                        <h3 class="card-name"><button type="button" data-open="${v.id}">${escapeHTML(v.name)}</button></h3>
                        <div class="card-facts">
                            ${stats ? `<span><span class="rating">★ ${stats.avg.toFixed(1)}</span> ${reviewCountText(stats.count)}</span>` : ''}
                            <span class="price-pill${!v.price ? ' tbc' : v.price.free ? ' free' : ''}">${escapeHTML(priceText(v))}</span>
                            ${options.fromLuanda ? `<span>${t('fromLuanda', { d: formatKm(kmBetween(LUANDA_CENTRE, v)) })}</span>` : dist ? `<span>${dist}</span>` : ''}
                            ${statusHTML(v)}

            return `

        /* ---------- Maravilhas de Angola (photography and drones) ---------- */

        // Sunrise and sunset (NOAA approximation, within a minute or two), in Angola time (UTC+1, no summer time).
        function sunTimes(lat, lng, iso) {
            const rad = Math.PI / 180;
            const day = Math.round((Date.parse(`${iso}T12:00:00Z`) - Date.UTC(Number(iso.slice(0, 4)), 0, 1, 12)) / 86400000);
            const g = 2 * Math.PI / 365 * day;
            const eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
            const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
                - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
            const cosH = Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl);
            if (Math.abs(cosH) > 1) return null;
            const ha = Math.acos(cosH) / rad;
            const clock = (utcMinutes) => {
                const m = Math.round(utcMinutes + 60 + 1440) % 1440;
                return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
            };
            return { rise: clock(720 - 4 * (lng + ha) - eqTime), set: clock(720 - 4 * (lng - ha) - eqTime) };
        }

        function nearestAirport(v) {
            const [name, lat, lng] = AIRPORTS.reduce((best, a) => (kmBetween(v, { lat: a[1], lng: a[2] }) < kmBetween(v, { lat: best[1], lng: best[2] }) ? a : best));
            const km = kmBetween(v, { lat, lng });
            // A place with an approximate position (a whole desert, a long seafront) is only flagged when clearly inside the 10 km.
            return km < (v.exact ? 10 : 6) ? { name, km: Math.max(1, Math.round(km)) } : null;
        }

        function spotHTML(spot, today) {
            const v = venues.find((x) => x.id === spot.id);
            if (!v) return '';
            const sun = sunTimes(v.lat, v.lng, today);
            const airport = nearestAirport(v);
            const near = airport && t(v.exact ? 'droneAirport' : 'droneAirportNear', { km: airport.km, name: escapeHTML(airport.name) });
            const drone = [spot.zone ? t(`droneZone_${spot.zone}`) : '', near].filter(Boolean);
            return `
                <li class="route-stop" id="maravilha-local-${v.id}">
                    <button class="route-thumb" type="button" data-open="${v.id}" aria-label="${t('viewPlace')}: ${escapeHTML(v.name)}">
                        <span aria-hidden="true">${escapeHTML(initials(v.name))}</span>
                        ${thumbSrc(v) ? `<img src="${escapeHTML(thumbSrc(v))}" alt=""${focusAttr(v.photos?.[0])} crossorigin="anonymous" loading="lazy" onerror="this.remove()">` : ''}
                    </button>
                    <div>
                        <button class="route-name" type="button" data-open="${v.id}">${escapeHTML(v.name)}</button>
                        <p class="route-where">${escapeHTML(placeLine(v))}</p>
                        <p class="route-why">${escapeHTML(spot.tip[lang])}</p>
                        ${sun ? `<p class="spot-line">${icon('sun')}<span>${t('wondersSun', { rise: sun.rise, set: sun.set })}${v.exact ? '' : ` ${t('wondersSunApprox')}`}</span></p>` : ''}
                        ${drone.map((d) => `<p class="spot-line drone">${icon('drone')}<span>${d}</span></p>`).join('')}
                    </div>
                </li>`;
        }

        function wonderCard(id, iconName, title, body, sources) {
            return `
                <section class="guide-card" id="maravilha-${id}" aria-labelledby="maravilha-${id}-title">

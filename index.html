                    ${body}
                    <p class="guide-sources">${typeof sources === 'string' ? sources
                        : `${t('sourcesLabel')}: ${sources.map((src) => `<a href="${escapeHTML(src.url)}" target="_blank" rel="noopener">${escapeHTML(src.label)}</a>`).join(', ')}`}</p>
                </section>`;
        }

        function renderWonders() {
            $('wondersChecked').textContent = t('guideChecked', { date: formatDate(WONDERS_CHECKED) });
            const today = luandaToday();
            const spots = (ids) => `<ol class="route-stops">${ids.map((id) => spotHTML(PHOTO_SPOTS.find((p) => p.id === id), today)).join('')}</ol>`;
            const list = (items) => `<ul class="guide-list">${items.map((item) => `<li><b>${escapeHTML(item.lead[lang])}</b><span>${escapeHTML(item[lang])}</span></li>`).join('')}</ul>`;
            const others = PHOTO_SPOTS.map((p) => p.id).filter((id) => !SEVEN_WONDERS.includes(id));
            const sections = [
                ['sete', 'star', t('wondersSevenTitle')],
                ['fotografar', 'camera', t('wondersSpotsTitle')],
                ['drones', 'drone', t('wondersDronesTitle')],
                ['dicas', 'info', t('wondersTipsTitle')]
            ];
            const jump = `<nav class="chips guide-jump" aria-label="${t('guideJump')}">${sections.map(([id, ic, title]) =>
                `<button class="chip" type="button" data-wonder-jump="${id}">${icon(ic)}${escapeHTML(title)}</button>`).join('')}</nav>`;
            $('wondersBody').innerHTML = jump
                + wonderCard('sete', 'star', t('wondersSevenTitle'), `<p class="route-intro">${t('wondersSevenIntro')}</p>${spots(SEVEN_WONDERS)}`, WONDERS_SOURCES.seven)
                + wonderCard('fotografar', 'camera', t('wondersSpotsTitle'), `<p class="route-intro">${t('wondersSpotsIntro')}</p>${spots(others)}`, t('wondersSpotsSources'))
                + wonderCard('drones', 'drone', t('wondersDronesTitle'), `${list(DRONE_RULES)}<p class="route-note">${t('wondersDronesNote')}</p>`, WONDERS_SOURCES.drones)
                + wonderCard('dicas', 'info', t('wondersTipsTitle'), list(PHOTO_TIPS), WONDERS_SOURCES.tips)
                + `<p class="hint events-note">${t('wondersSunNote')}</p>`;
        }

        /* ---------- Map (Leaflet + OpenStreetMap, loaded only when the map opens) ---------- */

        const LEAFLET = {
            css: { href: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', integrity: 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=' },
            js: { src: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', integrity: 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=' }
        };
        let leafletReady = null;
        let placesMap = null;
        let mapLayer = null;
        let mapCategory = '';

        function loadLeaflet() {
            leafletReady ??= new Promise((resolve, reject) => {
                const css = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: LEAFLET.css.href, integrity: LEAFLET.css.integrity, crossOrigin: '' });
                const js = Object.assign(document.createElement('script'), { src: LEAFLET.js.src, integrity: LEAFLET.js.integrity, crossOrigin: '' });
                js.onload = () => resolve(window.L);
                js.onerror = () => { leafletReady = null; reject(new Error('leaflet')); };
                document.head.append(css, js);
            });
            return leafletReady;
        }

        // Only places with confirmed coordinates go on the map; the others would land in the wrong spot.
        const mappable = () => venues.filter((v) => v.exact && (!mapCategory || v.type === mapCategory));

        function mapPopupHTML(v) {
            return `<div class="map-pop"><strong>${escapeHTML(v.name)}</strong><span>${escapeHTML(catLabel(v.type))} · ${escapeHTML(placeLine(v))}</span><button type="button" class="link-btn" data-open="${v.id}">${t('viewPlace')}</button></div>`;
        }

        async function renderMap() {
            const all = venues.filter((v) => v.exact);
            $('mapIntro').textContent = t('mapIntro', { n: all.length, total: venues.length });
            const types = Object.keys(CATEGORY).filter((k) => all.some((v) => v.type === k));
            $('mapFilter').innerHTML = [`<button class="chip${mapCategory ? '' : ' active'}" type="button" data-map-cat="" aria-pressed="${!mapCategory}">${t('mapAll')}</button>`,
                ...types.map((k) => `<button class="chip${mapCategory === k ? ' active' : ''}" type="button" data-map-cat="${k}" aria-pressed="${mapCategory === k}">${icon(CATEGORY[k].icon)}${escapeHTML(catLabel(k, true))}</button>`)].join('');
            let L;
            try {
                L = await loadLeaflet();
            } catch {
                $('mapStatus').textContent = t('mapError');
                return;
            }
            if (state.view !== 'map') return;
            if (!placesMap) {
                $('mapBox').innerHTML = '';
                placesMap = L.map('mapBox', { scrollWheelZoom: false });
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 18,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
                }).addTo(placesMap);
            }
            mapLayer?.remove();
            const fill = getComputedStyle(document.documentElement).getPropertyValue('--primary-fill').trim() || '#CE1126';
            const markers = mappable().map((v) => L.circleMarker([v.lat, v.lng], { radius: 8, color: '#FFFFFF', weight: 2, fillColor: fill, fillOpacity: 1 })
                .bindPopup(mapPopupHTML(v)).bindTooltip(v.name));
            mapLayer = L.featureGroup(markers).addTo(placesMap);
            placesMap.invalidateSize();
            if (markers.length) placesMap.fitBounds(mapLayer.getBounds(), { padding: [24, 24], maxZoom: 13 });
        }

        /* ---------- Itineraries ---------- */

        const routeStops = (r) => r.days.flatMap((d) => d.stops);
        const routeDays = (r) => (r.days.length === 1 ? t('routeOneDay') : t('routeDays', { n: r.days.length }));

        function routeStopHTML(id, prev) {
            const v = venues.find((x) => x.id === id);
            if (!v) return '';
            const before = prev && venues.find((x) => x.id === prev);
            const km = before?.exact && v.exact ? Math.round(kmBetween(before, v)) : null;
            return `
                <li class="route-stop">
                    <button class="route-thumb" type="button" data-open="${v.id}" aria-label="${t('viewPlace')}: ${escapeHTML(v.name)}">
                        <span aria-hidden="true">${escapeHTML(initials(v.name))}</span>
                        ${thumbSrc(v) ? `<img src="${escapeHTML(thumbSrc(v))}" alt=""${focusAttr(v.photos?.[0])} crossorigin="anonymous" loading="lazy" onerror="this.remove()">` : ''}
                    </button>
                    <div>
                        <button class="route-name" type="button" data-open="${v.id}">${escapeHTML(v.name)}</button>
                        <p class="route-where">${escapeHTML(placeLine(v))}${km ? ` · ${t('routeKm', { km })}` : ''}</p>
                        <p class="route-why">${escapeHTML(highlightOf(v))}</p>
                    </div>
                </li>`;
        }

        function renderRoutes() {
            const jump = `<nav class="chips guide-jump" aria-label="${t('routesTitle')}">${ITINERARIES.map((r) =>
                `<button class="chip" type="button" data-route-jump="${r.id}">${escapeHTML(r.title[lang])}</button>`).join('')}</nav>`;
            const cards = ITINERARIES.map((r) => `
                <section class="guide-card route-card" id="roteiro-${r.id}" aria-labelledby="roteiro-${r.id}-title">
                    <p class="route-meta">${escapeHTML(r.area)} · ${routeDays(r)}</p>
                    <h2 id="roteiro-${r.id}-title">${escapeHTML(r.title[lang])}</h2>
                    <p class="route-intro">${escapeHTML(r.intro[lang])}</p>
                    ${r.days.map((d, i) => `
                        <h3 class="route-day">${r.days.length > 1 ? `${t('routeDay', { n: i + 1 })}: ` : ''}${escapeHTML(d.title[lang])}</h3>
                        <ol class="route-stops">${d.stops.map((id, k) => routeStopHTML(id, d.stops[k - 1])).join('')}</ol>
                        ${d.note ? `<p class="route-note">${escapeHTML(d.note[lang])}</p>` : ''}`).join('')}
                    ${r.source ? `<p class="guide-sources">${t('sourcesLabel')}: <a href="${escapeHTML(r.source.url)}" target="_blank" rel="noopener">${escapeHTML(r.source.label)}</a></p>` : ''}
                </section>`).join('');
            $('routesBody').innerHTML = `${jump}${cards}<p class="hint events-note">${t('routesNote')}</p>`;
        }

        function routesHomeHTML() {
            return `<div class="collection-grid">${ITINERARIES.map((r) => {
                const cover = venues.find((v) => v.id === routeStops(r)[0]);
                return `
                    <button class="collection" type="button" data-route-open="${r.id}">
                        ${cover?.photos ? `<img src="${escapeHTML(asset(cover.photos[0].thumb))}" alt=""${focusAttr(cover.photos[0])} crossorigin="anonymous" loading="lazy">` : ''}
                        <span class="collection-title">${escapeHTML(r.title[lang])}</span>
                        <span class="collection-desc">${escapeHTML(r.area)} · ${routeDays(r)} · ${placesCount(routeStops(r).length)}</span>
                    </button>`;
            }).join('')}</div>`;
        }

        /* ---------- Place details ---------- */

        function socialLinks(v) {
            const q = `${v.name} ${cityOf(v)} Angola`;
            const enc = encodeURIComponent(q);
            return [
                ['YouTube', `https://www.youtube.com/results?search_query=${enc}`],
                ['Instagram', `https://www.google.com/search?q=${encodeURIComponent(q + ' site:instagram.com')}`],
                ['TikTok', `https://www.tiktok.com/search?q=${enc}`]
            ].map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`).join('');
        }

        function hoursHTML(v) {
            if (!v.hours) return v.hoursText ? escapeHTML(v.hoursText[lang] || v.hoursText.pt) : t('toConfirm');
            const today = luandaNow().day;
            const order = [1, 2, 3, 4, 5, 6, 0];
            return `${statusHTML(v)}<ul class="week">${order.map((d) => {
                const slots = v.hours[d];
                const text = slots ? slots.map(([o, c]) => `${o}–${c}`).join(', ') : t('closed');
                return `<li class="${d === today ? 'today' : ''}"><span>${weekdayName(d)}</span><span>${text}</span></li>`;
            }).join('')}</ul>${v.hoursNote ? `<p class="hint hours-note">${escapeHTML(v.hoursNote[lang] || v.hoursNote.pt)}</p>` : ''}`;
        }

        function verifiedRowHTML(v) {
            if (!v.verified) return `<div class="fact"><dt>${t('notVerifiedLabel')}</dt><dd>${t('notVerified')}</dd></div>`;
            const date = formatDate(v.verified.date);
            const sources = v.verified.sources.length
                ? `<br>${t('sourcesLabel')}: ${v.verified.sources.map((s) => `<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener">${escapeHTML(s.label)}</a>`).join(', ')}`
                : '';
            const label = v.exact ? t('verifiedLabelExact') : t('verifiedLabelApprox');
            const text = v.exact ? t('verifiedExact', { date }) : t('verifiedApprox', { date });
            return `<div class="fact"><dt>${label}</dt><dd>${text}${v.verified.stale ? `<br>${t('verifiedStale')}` : ''}${sources}</dd></div>`;
        }

        function practicalHTML(v) {
            const digits = phoneDigits(v);
            const address = v.address || placeLine(v);
            const map = v.citywide
                ? `<p class="hint">${t('citywideMap')}</p>`
                : v.exact
                ? `<iframe class="map-frame" src="${mapEmbedURL(v)}" title="${escapeHTML(v.name)}" loading="lazy"></iframe>
                   <p class="coords">Lat ${v.lat.toFixed(4)} · Long ${v.lng.toFixed(4)}</p>`
                : `<p class="hint">${t('approxMap')}</p>`;
            return `
                <section>
                    <h3 class="section-title">${t('practicalInfo')}</h3>
                    <dl class="facts">
                        <div class="fact"><dt>${t('hoursLabel')}</dt><dd>${hoursHTML(v)}</dd></div>
                        <div class="fact"><dt>${t('addressLabel')}</dt><dd>${escapeHTML(address)}</dd></div>
                        <div class="fact"><dt>${t('mapLabel')}</dt><dd>${map}${v.citywide ? '' : `<a class="text-link" href="${mapsURL(v, 'search')}" target="_blank" rel="noopener">${icon('pin')}${t('viewMap')}</a>`}</dd></div>
                        <div class="fact"><dt>${t('priceLabel')}</dt><dd>${escapeHTML(priceText(v))}${fxText(v) ? `<br><span class="fx">${escapeHTML(fxText(v))}</span> <span class="price-note">(${escapeHTML(fxNote())})</span>` : ''}${v.price?.estimate ? `<br>${t('priceEstimate')}` : ''}${v.price?.note ? `<br><span class="price-note">${escapeHTML(v.price.note[lang] || v.price.note.pt)}</span>` : ''}</dd></div>
                        <div class="fact"><dt>${t('contactLabel')}</dt><dd>${digits ? escapeHTML(v.phone) : t('toConfirm')}</dd></div>
                        <div class="fact"><dt>${t('stillToConfirm')}</dt><dd>${t('unknownFacts')}</dd></div>
                        ${verifiedRowHTML(v)}
                    </dl>
                    ${canSuggestFix() ? `<button class="fix-link" type="button" data-fix="${v.id}">${icon('edit')}${t('suggestFix')}</button>` : ''}
                </section>
            `;
        }

        function menuHTML(v) {
            const menu = menuData[v.id];
            if (!menu) return '';
            const groups = MENU_SECTIONS.filter(([key]) => menu[key]).map(([key, ...names]) => `
                <div class="menu-group">
                    <div class="menu-group-title">${names[LANGS.indexOf(lang)]}</div>
                    ${menu[key].map((item) => `
                        <div class="menu-item">
                            <div>
                                <div class="menu-item-name">${escapeHTML(item.name)}</div>
                                <div class="menu-item-desc">${escapeHTML(lang === 'pt' ? item.desc : MENU_DESC[lang][item.desc] || MENU_DESC_EN[item.desc] || item.desc)}</div>
                            </div>
                            <div class="menu-item-price">${escapeHTML(item.price)}</div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
            return `<section><h3 class="section-title">${t('menu')}</h3><p class="hint" style="margin-top:6px;">${t('menuNote')}</p><div class="panel">${groups}</div></section>`;
        }

        function googleReviewsURL(v) {
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${v.name}, ${v.location}, Angola`)}`;
        }

        function tripadvisorURL(v) {
            return `https://www.tripadvisor.com/Search?q=${encodeURIComponent(`${v.name} ${cityOf(v)} Angola`)}`;
        }

        function externalReviewsHTML(v) {
            return `
                <div class="rv-more">
                    <span>${t('externalReviews')}</span>
                    <a class="rv-link" href="${googleReviewsURL(v)}" target="_blank" rel="noopener">Google Maps${icon('external')}</a>
                    <a class="rv-link" href="${tripadvisorURL(v)}" target="_blank" rel="noopener">TripAdvisor${icon('external')}</a>
                </div>`;
        }

        function reviewItemHTML(r) {
            return `
                <div class="review">
                    ${avatarHTML(r.author_avatar, r.author)}
                    <div class="review-main">
                        <div class="review-head">
                            <span class="review-name">${escapeHTML(r.author)}</span>
                            <span class="review-date">${escapeHTML(new Date(r.created_at).toLocaleDateString(locale()))}</span>
                        </div>
                        ${r.rating ? `<div class="stars" aria-label="${t('stars', { n: r.rating })}">${stars(r.rating)}</div>` : ''}
                        ${r.comment ? `<div class="review-text">${escapeHTML(r.comment)}</div>` : ''}
                        <div class="post-actions">
                            <button type="button" class="report-btn" data-report-review="${escapeHTML(r.id)}">${t('report')}</button>
                            <button type="button" class="report-btn" data-block-review="${escapeHTML(r.id)}">${t('block')}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Without the shared backend there are no real visitor reviews, so only link to public ones.
        function reviewsHTML(v) {
            if (!reviewsEnabled()) {
                return `
                    <section id="reviewsSection">
                        <h3 class="section-title">${t('opinions')}</h3>
                        ${externalReviewsHTML(v)}
                    </section>`;
            }
            const form = signedIn() ? `
                        <form class="review-form" id="reviewForm" novalidate>
                            <div class="review-form-title">${t('yourReview')}</div>
                            <p class="hint">${t('reviewOptionalStars')}</p>
                            <div class="star-input" id="starInput" role="group" aria-label="${t('yourReview')}">
                                ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star-btn" data-star="${n}" aria-label="${t('stars', { n })}" aria-pressed="false">☆</button>`).join('')}
                            </div>
                            <textarea class="field" id="reviewText" maxlength="600" placeholder="${t('commentPlaceholder')}" aria-label="${t('commentPlaceholder')}"></textarea>
                            <div class="form-msg" id="reviewMsg" role="status" aria-live="polite"></div>
                            <button class="submit-btn" type="submit" id="reviewSubmit">${t('send')}</button>
                            <p class="hint">${t('postingAs', { name: escapeHTML(accountName()) })} ${t('moderationNote')}</p>
                        </form>` : signInPromptHTML('authNeedReview');
            return `
                <section id="reviewsSection">
                    <h3 class="section-title">${t('reviews')}</h3>
                    <div class="avg">${avgHTML(statsOf(v))}</div>
                    <div class="review-list" id="reviewList"><p class="hint">${t('loading')}</p></div>
                    ${form}
                    ${externalReviewsHTML(v)}
                </section>
            `;
        }

        async function loadReviews(venueId) {
            if (!reviewsEnabled()) return;
            try {
                const res = await sbRequest(`/rest/v1/reviews?select=id,author,author_avatar,rating,comment,created_at&venue_id=eq.${venueId}&status=eq.approved&order=created_at.desc&limit=50`, { headers: sbHeaders() });
                const items = await res.json();
                const list = $('reviewList');
                if (state.openId !== venueId || !list) return;
                // With no comments the summary card already invites people to be the first.
                list.innerHTML = items.map(reviewItemHTML).join('');
            } catch {
                const list = $('reviewList');
                if (list && state.openId === venueId) list.innerHTML = `<p class="hint">${t('reviewsError')}</p>`;
            }
        }

        function favButtonHTML(id) {
            return `${icon('heart')}<span>${favorites.includes(id) ? t('saved') : t('save')}</span>`;
        }

        function openVenue(id, keepScroll = false) {
            const v = venues.find((x) => x.id === id);
            if (!v) return;
            const panel = $('venuePanel');
            const scroll = panel.scrollTop;
            state.openId = id;
            state.rating = 0;

            const digits = phoneDigits(v);
            const isFav = favorites.includes(v.id);
            const dist = distanceText(v);
            const stats = statsOf(v);

            panel.innerHTML = `
                <button class="close-btn" type="button" data-close="venueModal" aria-label="${t('close')}">×</button>
                ${heroHTML(v)}
                <div class="modal-body">
                    <div>
                        <div class="card-type">${icon(CATEGORY[v.type].icon)}${catLabel(v.type, false)} · ${escapeHTML(placeLine(v))}</div>
                        <h2 class="modal-name" id="venueTitle">${escapeHTML(v.name)}</h2>
                        <div class="modal-sub">
                            <button type="button" class="rating-link" data-action="reviews" aria-label="${stats ? t('seeReviews') : t('opinionsLink')}">${ratingLinkHTML(stats)}</button>
                            <span>${escapeHTML(priceText(v))}</span>
                            ${dist ? `<span>${dist}</span>` : ''}
                            ${statusHTML(v)}
                        </div>
                        <p class="hint" id="ratingNote" ${stats ? '' : 'hidden'}>${t('aboutRatings')}</p>
                        ${PHOTO_SPOTS.some((p) => p.id === v.id) ? `<button class="link-btn wonder-link" type="button" data-wonder-open="${v.id}">${icon('camera')}${SEVEN_WONDERS.includes(v.id) ? t('wonderBadge') : t('wonderSpotBadge')}</button>` : ''}
                    </div>

                    <div class="actions">
                        ${v.citywide ? '' : `<a class="action-btn solid wide" href="${mapsURL(v, 'directions')}" target="_blank" rel="noopener">${icon('directions')}${t('directions')}</a>`}
                        ${digits ? `
                            <a class="action-btn" href="tel:+${digits}">${icon('phone')}${t('call')}</a>
                            <a class="action-btn" href="https://wa.me/${digits}" target="_blank" rel="noopener">${icon('chat')}${t('whatsapp')}</a>
                        ` : ''}
                        <button class="action-btn${isFav ? ' saved' : ''}" type="button" id="favBtn" aria-pressed="${isFav}">${favButtonHTML(v.id)}</button>
                        <button class="action-btn" type="button" id="shareBtn">${icon('share')}${t('share')}</button>
                    </div>

                    ${practicalHTML(v)}

                    <section>
                        <h3 class="section-title">${t('about')}</h3>
                        <p class="section-content">${escapeHTML(descOf(v))}</p>
                    </section>

                    <section>
                        <h3 class="section-title">${t('media')}</h3>
                        <div class="social">${socialLinks(v)}</div>
                        <p class="hint" style="margin-top:8px;">${t('mediaHint')}</p>
                    </section>

                    ${visitorHTML(v)}
                    ${menuHTML(v)}
                    ${reviewsHTML(v)}
                </div>
            `;

            $('venueModal').setAttribute('aria-labelledby', 'venueTitle');
            openModal('venueModal');
            if (keepScroll) panel.scrollTop = scroll;
            history.replaceState(null, '', `${location.pathname}${location.search}#local-${id}`);
            if (v.photos || v.image) upgradeHero(v.photos ? fullSrc(v.photos[0]) : asset(v.image));
            loadSubmissions(id);
            loadReviews(id);
        }

        function updateStars() {
            document.querySelectorAll('#starInput .star-btn').forEach((btn) => {
                const on = Number(btn.dataset.star) <= state.rating;
                btn.textContent = on ? '★' : '☆';
                btn.classList.toggle('on', on);
                btn.setAttribute('aria-pressed', String(Number(btn.dataset.star) === state.rating));
            });
        }

        // The author name and account are filled in by the database from the signed-in account.
        async function submitReview(event) {
            event.preventDefault();
            const comment = $('reviewText').value.trim();
            const msg = $('reviewMsg');
            const button = $('reviewSubmit');
            msg.classList.remove('ok');
            if (!state.rating && !comment) { msg.textContent = t('errReviewEmpty'); $('reviewText').focus(); return; }

            button.disabled = true;
            button.textContent = t('sending');
            try {
                if (await hasBlockedWords(comment)) { msg.textContent = t('errBlockedText'); $('reviewText').focus(); return; }
                await sbRequest('/rest/v1/reviews', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify({ venue_id: state.openId, rating: state.rating || null, comment: comment || null })
                });
                const rated = Boolean(state.rating);
                $('reviewText').value = '';
                state.rating = 0;
                updateStars();
                msg.textContent = t('reviewPending');
                msg.classList.add('ok');
                // Posts go live straight away, so show the new comment and the updated stars.
                loadReviews(state.openId);
                if (rated) loadRatingStats();
            } catch (err) {
                if (needsSignIn(err, msg)) return;
                msg.textContent = blockedWordsText(err) || (err.status === 409 ? t('errAlreadyRated') : t('errSend'));
            } finally {
                button.disabled = false;
                button.textContent = t('send');
            }
        }

        function toggleFavorite() {
            const id = state.openId;
            favorites = favorites.includes(id) ? favorites.filter((f) => f !== id) : [...favorites, id];
            store.set('favorites', favorites);
            pushFavorite(id, favorites.includes(id));
            const btn = $('favBtn');
            const isFav = favorites.includes(id);
            btn.innerHTML = favButtonHTML(id);
            btn.classList.toggle('saved', isFav);
            btn.setAttribute('aria-pressed', String(isFav));
            render();
        }

        // The iPhone app adds the native share sheet and Calendar (see AngoliveApp.swift); the website uses the browser's.
        const nativeBridge = (name) => (inNativeApp ? window.webkit?.messageHandlers?.[name] : null);

        function shareLink(title, text, url) {
            const native = nativeBridge('share');
            if (native) native.postMessage({ title, text, url });
            else if (navigator.share) navigator.share({ title, text, url }).catch(() => {});
            else window.open(`https://wa.me/?text=${encodeURIComponent(`${text}: ${url}`)}`, '_blank', 'noopener');
        }

        // Same as slug() in tools/gerar_paginas.py, which builds one page per place (lugares/<slug>.html).
        const placeSlug = (name) => name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

        // Shares the place's own page, so WhatsApp and social networks show its photo and name.
        function shareVenue() {
            const v = venues.find((x) => x.id === state.openId);
            const base = inNativeApp ? PUBLIC_URL : new URL('./', location.href).href;
            const url = `${base}lugares/${placeSlug(v.name)}.html`;
            shareLink(v.name, t('shareText', { name: v.name, location: v.location }), url);
        }

        /* ---------- Visitor photos and videos (Supabase) ---------- */

        const VIDEO_URL = /^https:\/\/(www\.|m\.|vm\.)?(youtube\.com|youtu\.be|tiktok\.com|instagram\.com)\//i;
        const photoBase = () => `${SUPABASE_URL}/storage/v1/object/public/submissions/`;

        function sbHeaders(extra = {}) {
            const headers = { apikey: SUPABASE_KEY, ...extra };
            if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = `Bearer ${SUPABASE_KEY}`;
            return headers;
        }

        async function sbRequest(path, options = {}) {
            const res = await fetch(`${SUPABASE_URL}${path}`, options);
            if (!res.ok) {
                let detail = '';
                try { detail = String((await res.json())?.message || ''); } catch {}
                throw Object.assign(new Error(`Supabase ${res.status}`), { status: res.status, detail });
            }
            return res;
        }

        // Asks the database whether a text has a word from its blocked list (it never says which).
        // The database also refuses such posts itself; this only lets the app explain before sending.
        async function hasBlockedWords(text) {
            if (!text || !supabaseReady()) return false;
            try {
                const res = await sbRequest('/rest/v1/rpc/has_blocked_words', {
                    method: 'POST',
                    headers: sbHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ content: text })
                });
                return (await res.json()) === true;
            } catch {
                return false;
            }
        }

        const blockedWordsText = (err) => ({ blocked_words_text: t('errBlockedText'), blocked_words_name: t('errBlockedAccountName') }[err?.detail] || '');

        async function compressPhoto(file) {
            const bitmap = await createImageBitmap(file);
            const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(bitmap.width * scale);
            canvas.height = Math.round(bitmap.height * scale);
            canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            bitmap.close?.();
            return new Promise((resolve, reject) => canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('encode'))), 'image/jpeg', 0.82));
        }

        function visitorHTML(v) {
            if (!supabaseReady()) return '';
            // Signed out: only the gallery; the single sign-in invitation is in the reviews section below.
            if (!signedIn()) {
                return `
                    <section>
                        <h3 class="section-title">${t('visitorMedia')}</h3>
                        <div class="visitor-gallery" id="visitorGallery"><p class="hint">${t('loading')}</p></div>
                    </section>`;
            }
            return `
                <section>
                    <h3 class="section-title">${t('visitorMedia')}</h3>
                    <div class="visitor-gallery" id="visitorGallery"><p class="hint">${t('loading')}</p></div>
                    <details class="visitor-form-wrap">
                        <summary class="action-btn">${icon('plus')}${t('addMedia')}</summary>
                        <form class="review-form" id="mediaForm" novalidate>
                            <div class="media-kind" role="radiogroup">
                                <label><input type="radio" name="mediaKind" value="photo" checked>${t('kindPhoto')}</label>
                                <label><input type="radio" name="mediaKind" value="video">${t('kindVideo')}</label>
                            </div>
                            <div id="photoField"><input class="field" type="file" id="mediaFile" accept="image/*" aria-label="${t('kindPhoto')}"></div>
                            <div id="videoField" hidden><input class="field" type="url" id="mediaUrl" inputmode="url" placeholder="https://www.youtube.com/..." aria-label="${t('videoLink')}"></div>
                            <input class="field" id="mediaCaption" type="text" maxlength="200" placeholder="${t('captionPlaceholder')}" aria-label="${t('captionPlaceholder')}">
                            <label class="consent"><input type="checkbox" id="mediaConsent"><span>${t('consent')}</span></label>
                            <div class="form-msg" id="mediaMsg" role="status" aria-live="polite"></div>
                            <button class="submit-btn" type="submit" id="mediaSubmit">${t('sendMedia')}</button>
                            <p class="hint">${t('postingAs', { name: escapeHTML(accountName()) })} ${t('moderationNote')}</p>
                        </form>
                    </details>
                </section>
            `;
        }

        function submissionHTML(s, v) {
            const caption = `<div class="visitor-caption">${avatarHTML(s.author_avatar, s.author, 'sm')}<span>${escapeHTML(s.author)}${s.caption ? ` · ${escapeHTML(s.caption)}` : ''}</span></div>`;
            const report = `<div class="post-actions"><button type="button" class="report-btn" data-report="${escapeHTML(s.id)}">${t('report')}</button><button type="button" class="report-btn" data-block="${escapeHTML(s.id)}">${t('block')}</button></div>`;
            if (s.kind === 'photo' && s.url.startsWith(photoBase())) {
                return `<figure class="visitor-item"><a href="${escapeHTML(s.url)}" target="_blank" rel="noopener"><img src="${escapeHTML(s.url)}" alt="${escapeHTML(s.caption || v.name)}" loading="lazy"></a>${caption}${report}</figure>`;
            }
            if (s.kind === 'video' && VIDEO_URL.test(s.url)) {
                const host = new URL(s.url).hostname;
                const site = host.includes('tiktok') ? 'TikTok' : host.includes('instagram') ? 'Instagram' : 'YouTube';
                return `<div class="visitor-item"><a class="video-link" href="${escapeHTML(s.url)}" target="_blank" rel="noopener">${icon('play')}${t('watchVideo', { site })}</a>${caption}${report}</div>`;
            }
            return '';
        }

        async function loadSubmissions(venueId) {
            if (!supabaseReady()) return;
            try {
                const res = await sbRequest(`/rest/v1/submissions?select=id,kind,url,author,author_avatar,caption&venue_id=eq.${venueId}&status=eq.approved&order=created_at.desc&limit=30`, { headers: sbHeaders() });
                const items = await res.json();
                const gallery = $('visitorGallery');
                if (state.openId !== venueId || !gallery) return;
                const v = venues.find((x) => x.id === venueId);
                const html = items.map((s) => submissionHTML(s, v)).join('');
                gallery.innerHTML = html || `<p class="hint">${t('visitorEmpty')}</p>`;
            } catch {
                const gallery = $('visitorGallery');
                if (gallery && state.openId === venueId) gallery.innerHTML = `<p class="hint">${t('visitorError')}</p>`;
            }
        }

        async function submitMedia(event) {
            event.preventDefault();
            const venueId = state.openId;
            const kind = document.querySelector('input[name="mediaKind"]:checked').value;
            const caption = $('mediaCaption').value.trim();
            const msg = $('mediaMsg');
            const button = $('mediaSubmit');
            msg.classList.remove('ok');

            const file = $('mediaFile').files[0];
            const videoUrl = $('mediaUrl').value.trim();
            if (kind === 'photo' && !file) { msg.textContent = t('errFile'); return; }
            if (kind === 'photo' && !file.type.startsWith('image/')) { msg.textContent = t('errFileType'); return; }
            if (kind === 'video' && !VIDEO_URL.test(videoUrl)) { msg.textContent = t('errVideo'); $('mediaUrl').focus(); return; }
            if (!$('mediaConsent').checked) { msg.textContent = t('errConsent'); return; }

            button.disabled = true;
            button.textContent = t('sending');
            msg.textContent = '';
            try {
                if (await hasBlockedWords(caption)) { msg.textContent = t('errBlockedText'); $('mediaCaption').focus(); return; }
                if (await hasBlockedWords(accountName())) { msg.textContent = t('errBlockedAccountName'); return; }
                let url = videoUrl;
                if (kind === 'photo') {
                    const blob = await compressPhoto(file);
                    // Each account uploads into its own folder, so the files can be removed with the account.
                    const path = `${session.user.id}/${venueId}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}.jpg`;
                    await sbRequest(`/storage/v1/object/submissions/${path}`, {
                        method: 'POST',
                        headers: await userHeaders({ 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }),
                        body: blob
                    });
                    url = photoBase() + path;
                }
                await sbRequest('/rest/v1/submissions', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify({ venue_id: venueId, kind, url, caption: caption || null })
                });
                if (state.openId !== venueId) return;
                $('mediaForm').reset();
                $('photoField').hidden = false;
                $('videoField').hidden = true;
                msg.textContent = t('mediaThanks');
                msg.classList.add('ok');
                loadSubmissions(venueId);
            } catch (err) {
                if (needsSignIn(err, msg)) return;
                msg.textContent = blockedWordsText(err) || t('errSend');
            } finally {
                button.disabled = false;
                button.textContent = t('sendMedia');
            }
        }

        async function reportSubmission(button) {
            if (!signedIn()) { openAuth('signin', { reason: t('authNeedReport') }); return; }
            if (!confirm(t('reportConfirm'))) return;
            button.disabled = true;
            try {
                await sbRequest('/rest/v1/reports', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify(button.dataset.report ? { submission_id: button.dataset.report } : { review_id: button.dataset.reportReview })
                });
                button.textContent = t('reported');
            } catch (err) {
                if (err.status === 409) { button.textContent = t('alreadyReported'); return; }
                button.disabled = false;
                button.textContent = needsSignIn(err) ? t('signIn') : t('errSend');
            }
        }

        // Blocking hides everything that person posts, for this account only; the database does the hiding.
        async function blockAuthor(button) {
            if (!signedIn()) { openAuth('signin', { reason: t('authNeedBlock') }); return; }
            if (!confirm(t('blockConfirm'))) return;
            button.disabled = true;
            try {
                const res = await sbRequest('/rest/v1/rpc/block_author', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(button.dataset.block ? { submission: button.dataset.block } : { review: button.dataset.blockReview })
                });
                if ((await res.json()) === 'self') { button.textContent = t('blockSelf'); return; }
                loadReviews(state.openId);
                loadSubmissions(state.openId);
                loadRatingStats();
            } catch (err) {
                button.disabled = false;
                button.textContent = needsSignIn(err) ? t('signIn') : t('errSend');
            }
        }

        async function loadBlocks() {
            const box = $('blockedInfo');
            if (!box) return;
            try {
                const res = await sbRequest('/rest/v1/blocks?select=blocked_id', { headers: await userHeaders() });
                const n = (await res.json()).length;
                if ($('blockedInfo') !== box) return;
                box.innerHTML = n ? `${n} <button type="button" class="link-btn" data-action="unblock-all">${t('unblockAll')}</button>` : '0';
            } catch {
                box.textContent = t('errSend');
            }
        }

        async function unblockAll(button) {
            button.disabled = true;
            try {
                await sbRequest(`/rest/v1/blocks?blocker_id=eq.${session.user.id}`, { method: 'DELETE', headers: await userHeaders() });
                loadBlocks();
                if (state.openId) { loadReviews(state.openId); loadSubmissions(state.openId); }
                loadRatingStats();
            } catch {
                button.disabled = false;
                button.textContent = t('errSend');
            }
        }

        /* ---------- Accounts (Supabase Auth: email and password) ---------- */

        let session = store.get('angoliveSession', null);
        let authView = 'signin';
        let afterAuth = null;
        let refreshing = null;
        const accountsEnabled = supabaseReady;
        const signedIn = () => accountsEnabled() && Boolean(session?.access_token);
        const accountName = () => session?.user?.user_metadata?.display_name || session?.user?.email?.split('@')[0] || '';
        const myAvatar = () => session?.user?.user_metadata?.avatar || null;

        // Profile pictures: cartoon drawings of traditional masks from Angola, in the flag's colours (avatars/).
        const AVATARS = {
            'mask-mwana-pwo': { pt: 'Máscara Mwana Pwo (Cokwe)', en: 'Mwana Pwo mask (Chokwe)', fr: 'Masque Mwana Pwo (Tchokwé)', es: 'Máscara Mwana Pwo (chokwe)' },
            'mask-pwo': { pt: 'Máscara Pwo (Cokwe)', en: 'Pwo mask (Chokwe)', fr: 'Masque Pwo (Tchokwé)', es: 'Máscara Pwo (chokwe)' },
            'mask-chihongo': { pt: 'Máscara Chihongo (Cokwe)', en: 'Chihongo mask (Chokwe)', fr: 'Masque Chihongo (Tchokwé)', es: 'Máscara Chihongo (chokwe)' },
            'mask-chikunza': { pt: 'Máscara Chikunza (Cokwe)', en: 'Chikunza mask (Chokwe)', fr: 'Masque Chikunza (Tchokwé)', es: 'Máscara Chikunza (chokwe)' },
            'mask-danca': { pt: 'Máscara de dança (Cokwe)', en: 'Dance mask (Chokwe)', fr: 'Masque de danse (Tchokwé)', es: 'Máscara de danza (chokwe)' },
            'mask-lwena': { pt: 'Máscara Lwena', en: 'Lwena mask', fr: 'Masque lwena', es: 'Máscara lwena' }
        };

        // Only the app's own masks or a photo in a person's own folder are shown, never any other link.
        const isAvatarPhoto = (value) => typeof value === 'string' && value.startsWith(photoBase()) && /^[0-9a-f-]{36}\/avatar-\d+\.jpg$/.test(value.slice(photoBase().length));
        function avatarSrc(value) {
            if (AVATARS[value]) return asset(`avatars/${value}.svg`);
            return isAvatarPhoto(value) ? value : '';
        }

        function avatarHTML(value, name, size = '') {
            const src = avatarSrc(value);
            return src
                ? `<img class="avatar ${size}" src="${escapeHTML(src)}" alt="" loading="lazy">`
                : `<span class="avatar avatar-initial ${size}" aria-hidden="true">${escapeHTML((name || '?').trim().charAt(0).toUpperCase() || '?')}</span>`;
        }

        function avatarOptionsHTML(current, inputName) {
            const own = isAvatarPhoto(current)
                ? `<label class="avatar-opt" title="${t('avatarYourPhoto')}"><input type="radio" name="${inputName}" value="${escapeHTML(current)}" checked><img src="${escapeHTML(current)}" alt="${t('avatarYourPhoto')}" width="56" height="56"></label>`
                : '';
            return `<div class="avatar-options">${own}${Object.entries(AVATARS).map(([key, a]) => `
                <label class="avatar-opt" title="${escapeHTML(a[lang])}">
                    <input type="radio" name="${inputName}" value="${key}" ${current === key ? 'checked' : ''}>
                    <img src="${escapeHTML(asset(`avatars/${key}.svg`))}" alt="${escapeHTML(a[lang])}" width="56" height="56">
                </label>`).join('')}</div>`;
        }
        const authRedirect = () => (inNativeApp ? PUBLIC_URL : `${location.origin}${location.pathname}`);
        const validEmail = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        const STATUS_LABELS = { pending: 'statusPending', approved: 'statusApproved', rejected: 'statusRejected', hidden: 'statusHidden', new: 'statusNew', done: 'statusDone' };

        function saveSession(data) {
            if (!data) {
                session = null;
                store.remove('angoliveSession');
            } else {
                session = {
                    access_token: data.access_token,
                    refresh_token: data.refresh_token || session?.refresh_token,
                    expires_at: Number(data.expires_at) || Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600),
                    user: data.user ? { id: data.user.id, email: data.user.email, user_metadata: data.user.user_metadata || {} } : session?.user || null
                };
                store.set('angoliveSession', session);
            }
            renderAccountButton();
        }

        async function authRequest(path, body, { method = 'POST', token } = {}) {
            const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            const res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw Object.assign(new Error('auth'), { status: res.status, code: data.error_code || data.code || data.error || '', text: data.msg || data.error_description || data.message || '' });
            }
            return data;
        }

        // Access tokens last about an hour; renew them a minute before they run out.
        async function accessToken() {
            if (!signedIn()) return null;
            if (session.expires_at - 60 > Date.now() / 1000) return session.access_token;
            refreshing ||= authRequest('/token?grant_type=refresh_token', { refresh_token: session.refresh_token })
                .then((data) => {
                    saveSession(data);
                    return session.access_token;
                })
                .catch((err) => {
                    if (err.status && err.status < 500) signOutLocally();
                    return null;
                })
                .finally(() => { refreshing = null; });
            return refreshing;
        }

        // Requests made as the signed-in person; the database's row-level security checks who they are.
        async function userHeaders(extra = {}) {
            const token = await accessToken();
            if (!token) throw Object.assign(new Error('signin'), { status: 401 });
            return { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, ...extra };
        }

        function needsSignIn(err, msg) {
            if (err?.status !== 401) return false;
            if (msg) msg.textContent = t('authExpired');
            openAuth('signin', { reason: t('authExpired') });
            return true;
        }

        function authErrorText(err) {
            const code = String(err.code || '');
            const text = String(err.text || '').toLowerCase();
            if (err.status === 429 || code.includes('rate_limit')) return t('authErrRate');
            if (code === 'invalid_credentials' || text.includes('invalid login')) return t('authErrCredentials');
            if (code === 'email_not_confirmed' || text.includes('not confirmed')) return t('authErrNotConfirmed');
            if (code === 'user_already_exists' || code === 'email_exists' || text.includes('already registered')) return t('authErrExists');
            if (code === 'weak_password' || text.includes('password should')) return t('authErrWeak');
            if (code === 'otp_expired' || code === 'flow_state_expired') return t('authErrLink');
            return t('errSend');
        }

        function renderAccountButton() {

            btn.hidden = !accountsEnabled();
            $('accountLabel').textContent = signedIn() ? t('account') : t('signIn');
            btn.setAttribute('aria-label', signedIn() ? t('accountAria', { name: accountName() }) : t('signIn'));
            $('tabAccount').hidden = !accountsEnabled();
            $('tabAccountLabel').textContent = signedIn() ? t('tabAccount') : t('signIn');
            const face = signedIn() ? avatarHTML(myAvatar(), accountName(), 'xs') : icon('user');
            $('accountIcon').innerHTML = face;
            $('tabAccountIcon').innerHTML = face;
        }

        function passwordFieldHTML(labelKey, autocomplete) {

                <div class="form-group">

                    <div class="password-wrap">
                        <input class="field" id="authPassword" type="password" autocomplete="${autocomplete}" minlength="8" maxlength="72">

        const emailFieldHTML = (value) => `
            <div class="form-group"><label for="authEmail">${t('authEmail')}</label><input class="field" id="authEmail" type="email" autocomplete="email" maxlength="254" value="${escapeHTML(value)}"></div>`;
        const authSubmitHTML = (key) => `
            <div class="form-msg" id="authMsg" role="status" aria-live="polite"></div>
            <button class="submit-btn" type="submit" id="authSubmit" style="width:100%">${t(key)}</button>`;

                    <form id="authForm" novalidate>
                        <div class="form-group"><label for="authName">${t('authName')}</label><input class="field" id="authName" type="text" maxlength="60" autocomplete="name"></div>

                account: () => `

                        ${avatarHTML(myAvatar(), accountName(), 'lg')}
                        <div>
                            <h2 class="info-title" id="authTitle">${t('authHello', { name: escapeHTML(accountName()) })}</h2>
                            <p class="hint">${escapeHTML(session?.user?.email || '')}</p>
                        </div>
                    </div>
                    ${top}
                    <section class="avatar-picker" aria-labelledby="avatarTitle">
                        <h3 class="section-title" id="avatarTitle">${t('avatarTitle')}</h3>
                        <p class="hint">${t('avatarAccountHint')}</p>
                        ${avatarOptionsHTML(myAvatar(), 'accountAvatar')}

        function openAuth(view, { reason = '', notice = '', after = null } = {}) {
            if (!accountsEnabled()) return;
            afterAuth = after;
            renderAuth(view || (signedIn() ? 'account' : 'signin'), { reason, notice });
            openModal('authModal');
            $('authContent').querySelector('input:not([type="checkbox"]):not([type="radio"]):not([type="file"])')?.focus();
        }

        async function afterSignIn() {
            const next = afterAuth;
            afterAuth = null;
            closeModal('authModal');
            await syncFavorites();
            render();
            if (state.openId) openVenue(state.openId, true);
            if (next) next();
        }

        async function submitAuth(event) {
            event.preventDefault();
            const msg = $('authMsg');
            const button = $('authSubmit');
            msg.classList.remove('ok');
            msg.textContent = '';
            const email = $('authEmail')?.value.trim() || '';
            const password = $('authPassword')?.value || '';
            const name = $('authName')?.value.trim().slice(0, 60) || '';
            const fail = (key, field) => {
                msg.textContent = t(key);
                field?.focus();
            };
            if (['signup', 'account'].includes(authView) && !name) return fail('authErrName', $('authName'));
            if (['signin', 'signup', 'forgot'].includes(authView) && !validEmail(email)) return fail('authErrEmail', $('authEmail'));
            if (['signin', 'signup', 'reset'].includes(authView) && password.length < 8) return fail('authErrPassword', $('authPassword'));
            if (authView === 'signup' && !$('authConsent').checked) return fail('authErrConsent', $('authConsent'));
            if (['signup', 'account'].includes(authView) && await hasBlockedWords(name)) return fail('errBlockedName', $('authName'));

            const label = button.textContent;
            button.disabled = true;
            button.textContent = t('authWait');
            try {
                if (authView === 'signin') {
                    saveSession(await authRequest('/token?grant_type=password', { email, password }));
                    await afterSignIn();
                } else if (authView === 'signup') {
                    const avatar = document.querySelector('input[name="signupAvatar"]:checked')?.value;
                    const data = await authRequest(`/signup?redirect_to=${encodeURIComponent(authRedirect())}`, { email, password, data: { display_name: name, ...(AVATARS[avatar] ? { avatar } : {}) } });
                    if (data.access_token) {
                        saveSession(data);
                        await afterSignIn();
                    } else {
                        renderAuth('signin', { notice: t('authCheckEmail', { email }), email });
                    }
                } else if (authView === 'forgot') {
                    await authRequest(`/recover?redirect_to=${encodeURIComponent(authRedirect())}`, { email });
                    renderAuth('signin', { notice: t('authLinkSent', { email }), email });
                } else if (authView === 'reset') {
                    const user = await authRequest('/user', { password }, { method: 'PUT', token: await accessToken() });
                    saveSession({ ...session, user });
                    renderAuth('account', { notice: t('authPasswordSaved') });
                } else if (authView === 'account') {
                    const user = await authRequest('/user', { data: { display_name: name } }, { method: 'PUT', token: await accessToken() });
                    saveSession({ ...session, user });
                    await syncProfile();
                    renderAuth('account', { notice: t('authNameSaved') });
                }
            } catch (err) {
                if ($('authMsg')) $('authMsg').textContent = authErrorText(err);
            } finally {
                if (document.contains(button)) {
                    button.disabled = false;
                    button.textContent = label;
                }
            }
        }

        // Show the new name and picture on everything the person has already posted.
        async function syncProfile() {
            try {

        async function saveAvatar(value) {
            const msg = $('avatarMsg');
            const previous = myAvatar();
            if (msg) { msg.classList.remove('ok'); msg.textContent = t('sending'); }
            try {
                const user = await authRequest('/user', { data: { avatar: value } }, { method: 'PUT', token: await accessToken() });
                saveSession({ ...session, user });
                await syncProfile();
                // A replaced photo is no longer used anywhere, so remove it from the account's folder.
                if (isAvatarPhoto(previous) && previous !== value) {
                    sbRequest('/storage/v1/object/submissions', { method: 'DELETE', headers: await userHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ prefixes: [previous.slice(photoBase().length)] }) }).catch(() => {});
                }
                renderAuth('account', { notice: t('avatarSaved') });
            } catch (err) {
                if (!needsSignIn(err, msg) && msg) msg.textContent = t('errSend');
            }
        }

        // Square crop from the middle of the photo, 256 px, so it looks the same everywhere.
        async function squareAvatar(file) {
            const bitmap = await createImageBitmap(file);
            const side = Math.min(bitmap.width, bitmap.height);
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 256;
            canvas.getContext('2d').drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, 256, 256);
            bitmap.close?.();
            return new Promise((resolve, reject) => canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('encode'))), 'image/jpeg', 0.85));
        }

        async function uploadAvatar(file) {
            const msg = $('avatarMsg');
            msg.classList.remove('ok');
            if (!file.type.startsWith('image/')) { msg.textContent = t('errFileType'); return; }
            msg.textContent = t('sending');
            try {
                const path = `${session.user.id}/avatar-${Date.now()}.jpg`;
                await sbRequest(`/storage/v1/object/submissions/${path}`, {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }),
                    body: await squareAvatar(file)
                });
                await saveAvatar(photoBase() + path);
            } catch (err) {
                if (!needsSignIn(err, msg)) msg.textContent = t('errSend');
            }
        }

        async function loadContributions() {

                const [reviews, media, fixes] = await Promise.all([

                    get(`/rest/v1/submissions?select=venue_id,kind,status,created_at&user_id=eq.${uid}&order=created_at.desc&limit=30`),
                    get(`/rest/v1/corrections?select=venue_id,status,created_at&user_id=eq.${uid}&order=created_at.desc&limit=30`)
                ]);
                const items = [
                    ...reviews.map((r) => ({ ...r, label: t(r.rating ? 'contribReview' : 'contribComment') })),
                    ...media.map((m) => ({ ...m, label: t(m.kind === 'photo' ? 'contribPhoto' : 'contribVideo') })),
                    ...fixes.map((f) => ({ ...f, label: t('contribFix') }))
                ].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));

                    }).join('')}</ul>`

        // Photos are removed through the storage API first; the database then deletes the account and, in cascade, everything linked to it.
        async function deleteAccount(button) {
            if (!confirm(t('authDeleteConfirm'))) return;
            const msg = $('deleteMsg');
            button.disabled = true;
            try {
                const headers = await userHeaders({ 'Content-Type': 'application/json' });
                const folder = `${session.user.id}/`;
                const files = await sbRequest('/storage/v1/object/list/submissions', { method: 'POST', headers, body: JSON.stringify({ prefix: folder, limit: 1000 }) }).then((res) => res.json());
                const paths = files.filter((f) => f.name).map((f) => folder + f.name);
                if (paths.length) await sbRequest('/storage/v1/object/submissions', { method: 'DELETE', headers, body: JSON.stringify({ prefixes: paths }) });
                await sbRequest('/rest/v1/rpc/delete_my_account', { method: 'POST', headers, body: '{}' });
                favorites = [];
                store.set('favorites', favorites);
                saveSession(null);
                render();
                if (state.openId) openVenue(state.openId, true);
                renderAuth('signin', { notice: t('authDeleted') });

                button.disabled = false;

        // Saved places stay on the device; with an account they are also kept in the database and merged on sign-in.
        async function syncFavorites() {
            if (!signedIn()) return;
            try {
                const headers = await userHeaders();
                const remote = (await sbRequest('/rest/v1/favorites?select=venue_id', { headers }).then((res) => res.json())).map((r) => r.venue_id);
                const missing = favorites.filter((id) => !remote.includes(id));
                if (missing.length) {
                    await sbRequest('/rest/v1/favorites', {
                        method: 'POST',
                        headers: { ...headers, 'Content-Type': 'application/json', Prefer: 'return=minimal,resolution=ignore-duplicates' },
                        body: JSON.stringify(missing.map((venue_id) => ({ venue_id })))
                    });
                }
                favorites = [...new Set([...remote, ...favorites])].filter((id) => venues.some((v) => v.id === id));
                store.set('favorites', favorites);
                render();
            } catch {}
        }

        // The confirmation and password emails link back here with the session in the address (#access_token=...).
        async function consumeAuthRedirect() {
            if (!accountsEnabled()) return;
            const params = new URLSearchParams(location.hash.slice(1));
            const error = params.get('error_description') || params.get('error');
            if (!params.get('access_token') && !error) return;
            history.replaceState(null, '', location.pathname + location.search);
            if (error) {
                openAuth('signin', { reason: t('authErrLink') });
                return;
            }
            saveSession({ access_token: params.get('access_token'), refresh_token: params.get('refresh_token'), expires_in: params.get('expires_in'), expires_at: params.get('expires_at') });
            try {
                saveSession({ ...session, user: await authRequest('/user', null, { method: 'GET', token: session.access_token }) });
            } catch {}
            await syncFavorites();
            render();
            if (params.get('type') === 'recovery') openAuth('reset');
            else openAuth('account', { notice: t('authWelcome') });
        }

        /* ---------- Agenda ---------- */

        const isoDay = (iso) => new Date(`${iso}T00:00:00Z`);
        const toISO = (date) => date.toISOString().slice(0, 10);
        const addDays = (iso, n) => toISO(new Date(isoDay(iso).getTime() + n * 86400000));
        const luandaToday = () => toISO(new Date(Date.now() + 60 * 60 * 1000));
        const eventEnd = (e) => e.end || e.start;
        const eventTitle = (e) => e.title[lang] || e.title.pt;
        const eventTypeLabel = (type) => EVENT_TYPES[type][lang];
        const eventsCount = (n) => (n === 1 ? t('eventsCountOne') : t('eventsCount', { n }));

        function fmtDay(iso, options) {
            return new Intl.DateTimeFormat(locale(), { timeZone: 'UTC', ...options }).format(isoDay(iso));
        }

        // Weeks run Monday to Sunday.
        function whenRange(when) {
            const today = luandaToday();
            const weekday = isoDay(today).getUTCDay();
            const sunday = addDays(today, (7 - weekday) % 7);
            const d = isoDay(today);
            const monthEnd = (offset) => toISO(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + offset, 0)));
            switch (when) {
                case 'today': return [today, today];
                case 'weekend': return weekday === 0 ? [today, today] : [addDays(today, 6 - weekday), sunday];
                case 'week': return [today, sunday];
                case 'nextweek': return [addDays(sunday, 1), addDays(sunday, 7)];
                case 'month': return [today, monthEnd(1)];
                case 'nextmonth': return [addDays(monthEnd(1), 1), monthEnd(2)];
                default: return [today, eventEnd({ start: '9999-12-31' })];
            }
        }

        // The days in [from, to] when the event actually happens. With a programme, only its dates count.
        function eventDaysBetween(e, from, to) {
            if (e.programme) {
                const days = e.programme.flatMap((item) => eventDaysBetween({ start: item.date, end: item.end }, from, to));
                return [...new Set(days)].sort();
            }
            const first = e.start > from ? e.start : from;
            const last = eventEnd(e) < to ? eventEnd(e) : to;
            const days = [];
            for (let day = first; day <= last && days.length < 400; day = addDays(day, 1)) {
                if (!e.days || e.days.includes(isoDay(day).getUTCDay())) days.push(day);
            }
            return days;
        }

        function upcomingEvents({ when = 'all', type = '', where = '' } = {}) {
            const [from, to] = whenRange(when);
            return EVENTS
                .filter((e) => (!type || e.type === type) && (!where || e.city === where))
                .map((e) => ({ e, days: eventDaysBetween(e, from, to) }))
                .filter(({ days }) => days.length)
                .sort((a, b) => a.days[0].localeCompare(b.days[0]) || a.e.start.localeCompare(b.e.start))
                .map(({ e, days }) => ({ ...e, next: days[0] }));
        }

        function eventDateText(e) {
            const end = eventEnd(e);
            if (end === e.start) return fmtDay(e.start, { weekday: 'long', day: 'numeric', month: 'long' });
            const sameMonth = e.start.slice(0, 7) === end.slice(0, 7);
            const from = fmtDay(e.start, sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'long' });
            return t('dateRange', { from, to: fmtDay(end, { day: 'numeric', month: 'long' }) });
        }

        function eventPriceText(e) {
            const p = e.price;
            if (!p) return t('priceTBC');
            if (p.free) return t('free');
            if (p.text) return p.text[lang];
            return p.to ? t('kzThousandRange', { a: kz(p.from), b: kz(p.to) }) : t('kzThousand', { a: kz(p.from) });
        }

        function eventVenueText(e) {
            if (!e.venue) return t('eventVenueTbc');
            return e.venueTbc ? `${e.venue} (${t('eventVenueTbc').toLowerCase()})` : e.venue;
        }

        function eventBadgesHTML(e) {
            const today = luandaToday();
            const end = eventEnd(e);
            const badges = [];
            if (e.confirmed === false) badges.push(['tbc', t('eventTbc')]);
            else if (e.start <= today && end > today) badges.push(['live', t('eventOngoing', { date: fmtDay(end, { day: 'numeric', month: 'long' }) })]);
            else if (e.start <= today && end === today) badges.push(['live', t('eventToday')]);
            else if (e.start === addDays(today, 1)) badges.push(['', t('eventTomorrow')]);
            if (e.price?.free) badges.push(['', t('free')]);
            return badges.map(([cls, text]) => `<span class="event-badge ${cls}">${escapeHTML(text)}</span>`).join('');
        }

        function dateBlockHTML(e) {
            const end = eventEnd(e);
            const month = (iso) => fmtDay(iso, { month: 'short' }).replace('.', '');
            const day = (iso) => Number(iso.slice(8));
            let to = '';
            if (end !== e.start) to = end.slice(0, 7) === e.start.slice(0, 7) ? `– ${day(end)}` : `– ${day(end)} ${month(end)}`;
            return `<span class="date-block" aria-hidden="true"><span class="db-month">${month(e.start)}</span><span class="db-day">${day(e.start)}</span>${to ? `<span class="db-to">${to}</span>` : ''}</span>`;
        }

        function eventCardHTML(e) {
            const when = [eventDateText(e), e.when?.[lang]].filter(Boolean).join(' · ');
            const programme = e.programme?.length

            const phones = e.phones?.length
                ? `<p><b>${t('eventInfoPhone')}:</b> ${e.phones.map((n) => `<a href="tel:+244${n.replace(/\D/g, '')}">${escapeHTML(n)}</a>`).join(', ')}</p>`
                : '';
            const source = `<a href="${escapeHTML(e.source.url)}" target="_blank" rel="noopener">${escapeHTML(e.source.name)}</a>`;
            const link = e.link
                ? `<a class="action-btn solid" href="${escapeHTML(e.link)}" target="_blank" rel="noopener">${icon(e.tickets ? 'ticket' : 'external')}${t(e.tickets ? 'eventTickets' : 'eventOfficial')}</a>`
                : '';
            const directions = e.venue && !e.venueTbc
                ? `<a class="action-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.mapsQuery || `${e.venue}, ${e.city}, Angola`)}" target="_blank" rel="noopener">${icon('directions')}${t('directions')}</a>`
                : '';
            // The iPhone app saves through Calendar (addEventToCalendar), so the button needs the native bridge there.
            const calendar = (inNativeApp && !nativeBridge('calendar')) || e.confirmed === false
                ? ''
                : `<button class="action-btn" type="button" data-event-ics="${e.id}" aria-label="${escapeHTML(t('eventCalendarAria', { name: eventTitle(e) }))}">${icon('calendar')}${t('eventCalendar')}</button>`;
            return `
                <article class="event-card" id="evento-${e.id}" aria-labelledby="evt-${e.id}">
                    ${e.photo ? `
                        <figure class="event-photo">
                            <img src="${escapeHTML(fullSrc(e.photo))}" alt="${escapeHTML(e.photo.caption[lang])}" loading="lazy" crossorigin="anonymous" onerror="this.closest('figure').remove()">
                            <figcaption>${t('venuePhoto', { place: escapeHTML(e.photo.caption[lang]) })} · ${creditHTML(e.photo)}</figcaption>
                        </figure>` : ''}
                    ${dateBlockHTML(e)}
                    <div class="event-body">
                        <span class="card-type">${icon(EVENT_TYPES[e.type].icon)}${eventTypeLabel(e.type)} · ${escapeHTML(e.city)}</span>
                        <h3 class="event-title" id="evt-${e.id}" tabindex="-1">${escapeHTML(eventTitle(e))}</h3>
                        <div class="event-badges">${eventBadgesHTML(e)}</div>
                        <ul class="event-meta">
                            <li>${icon('calendar')}<span>${escapeHTML(when)}</span></li>
                            <li>${icon('pin')}<span>${escapeHTML(eventVenueText(e))}</span></li>
                            <li>${icon('tag')}<span>${escapeHTML(eventPriceText(e))}</span></li>
                        </ul>
                        ${e.tags ? `<p class="event-tags">${(e.tags[lang] || e.tags.en).map((tag) => `#${escapeHTML(tag.replace(/\s+/g, ''))}`).join(' ')}</p>` : ''}
                        <details class="event-details">
                            <summary>${t('eventMore')}</summary>
                            <p>${escapeHTML(e.desc[lang])}</p>
                            ${e.price?.note ? `<p>${escapeHTML(e.price.note[lang])}</p>` : ''}
                            ${programme}
                            ${e.host ? `<p><b>${t('eventHost')}:</b> ${escapeHTML(e.host)}</p>` : ''}
                            ${phones}
                            <p class="event-source">${t('eventSource', { source, date: formatDate(e.checked) })}</p>

                        <div class="event-actions">
                            ${link}${directions}${calendar}

        function eventMiniHTML(e) {
            return `
                <button class="event-mini" type="button" data-event-open="${e.id}">
                    ${dateBlockHTML(e)}

                        <span class="card-type">${icon(EVENT_TYPES[e.type].icon)}${eventTypeLabel(e.type)}</span>

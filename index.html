<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tuende - Descubra onde ir em Angola</title>
    <meta name="description" content="Encontre restaurantes, praias, hotéis, vida noturna e experiências em Angola, perto de si. Com preços em Kwanza e indicações para chegar.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tuende">
    <meta property="og:title" content="Tuende - Descubra onde ir em Angola">
    <meta property="og:description" content="Restaurantes, praias, cultura, natureza, vida noturna, alojamento e agenda de eventos em Angola, com preços em Kwanza.">
    <meta property="og:url" content="https://kingic17.github.io/tuende/">
    <meta property="og:image" content="https://kingic17.github.io/tuende/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Tuende: Descubra onde ir em Angola">
    <meta property="og:locale" content="pt_PT">
    <meta property="og:locale:alternate" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#CE1126">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tuende">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        @font-face {
            font-family: 'Plus Jakarta Sans';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            /* The iPhone app bundles the font next to the page, so the second address is its fallback. */
            src: url('fonts/plus-jakarta-sans-latin.woff2') format('woff2'), url('plus-jakarta-sans-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* --primary colours text and outlines; --primary-fill sits behind white text, so it stays dark enough in both themes. */
        :root {
            --primary: #CE1126;
            --primary-strong: #A50E1F;
            --primary-fill: #CE1126;
            --primary-fill-strong: #A50E1F;
            --primary-soft: rgba(206, 17, 38, 0.08);
            --accent: #FFCB00;
            --accent-ink: #111111;
            --bg: #FFFFFF;
            --surface: #FFFFFF;
            --surface-2: #F3F3F5;
            --text: #161618;
            --muted: #55555D;
            --border: #DADADF;
            --line: #E4E4E8;
            --tile-night: #111111;
            --free-bg: #E9F6EE;
            --free-ink: #1E6B3A;
            --tbc-bg: #F3F3F5;
            --tbc-ink: #55555D;
            --ok: #127A3E;
            --overlay: rgba(0, 0, 0, 0.6);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #FF6B7A;
                --primary-strong: #FF8A96;
                --primary-soft: rgba(255, 107, 122, 0.14);
                --bg: #0E0E10;
                --surface: #1A1A1F;
                --surface-2: #222226;
                --text: #F2F2F4;
                --muted: #B4B4BC;
                --border: #34343A;
                --line: #2E2E35;
                --tile-night: #2B2B33;
                --free-bg: #12301E;
                --free-ink: #7EDB9C;
                --tbc-bg: #1F1F25;
                --tbc-ink: #C9C9D1;
                --ok: #4ADE80;
                --overlay: rgba(0, 0, 0, 0.75);
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --primary: #FF6B7A;
            --primary-strong: #FF8A96;
            --primary-soft: rgba(255, 107, 122, 0.14);
            --bg: #0E0E10;
            --surface: #1A1A1F;
            --surface-2: #222226;
            --text: #F2F2F4;
            --muted: #B4B4BC;
            --border: #34343A;
            --line: #2E2E35;
            --tile-night: #2B2B33;
            --free-bg: #12301E;
            --free-ink: #7EDB9C;
            --tbc-bg: #1F1F25;
            --tbc-ink: #C9C9D1;
            --ok: #4ADE80;
            --overlay: rgba(0, 0, 0, 0.75);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-size: 16px;
            line-height: 1.45;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body.no-scroll { overflow: hidden; }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }
        a { color: inherit; }
        [hidden] { display: none !important; }

        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        .icon {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-icon] { display: inline-flex; }

        /* Header */
        /* Samakaka: the diamond pattern of Angolan printed cloth, in the flag's red and yellow. */
        .samakaka {
            background:
                linear-gradient(135deg, var(--accent) 25%, transparent 25%) -10px 0 / 20px 20px,
                linear-gradient(225deg, var(--accent) 25%, transparent 25%) -10px 0 / 20px 20px,
                linear-gradient(315deg, var(--accent) 25%, transparent 25%) 0 0 / 20px 20px,
                linear-gradient(45deg, var(--accent) 25%, transparent 25%) 0 0 / 20px 20px,
                var(--primary-fill);
        }
        .samakaka-strip { height: 12px; }

        .topbar { background: var(--bg); border-bottom: 1px solid var(--line); }
        .topbar-inner { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; padding: 10px 16px; }
        .top-nav { display: flex; flex-wrap: wrap; gap: 0 20px; }
        .top-nav button { min-height: 44px; padding: 0 2px; background: none; border: none; font-size: 15px; font-weight: 600; color: var(--text); }
        .top-nav button:hover { color: var(--primary); }
        .topbar-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }

        .top-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .top-btn:hover { border-color: var(--primary); }
        .top-btn.solid { background: var(--primary-fill); border-color: var(--primary-fill); color: #fff; }
        .top-btn.solid:hover { background: var(--primary-fill-strong); }

        .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .brand-logo { width: 54px; height: 26px; display: block; }
        .brand-logo .wave-red { stroke: var(--primary); }
        .brand-logo .wave-yellow { stroke: var(--accent); }
        .brand-logo .dot { fill: var(--text); }

        .brand-name { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; color: var(--primary); }

        /* Hero and search */
        .hero { background: var(--bg); padding: 32px 0 4px; }
        .hero-grid { display: flex; flex-wrap: wrap; align-items: center; gap: 28px 44px; }
        .hero-main { flex: 3 1 460px; min-width: 0; }
        .hero h1 { font-size: 46px; line-height: 1.06; font-weight: 800; letter-spacing: -0.03em; }
        .hero-sub { color: var(--muted); font-size: 18px; margin: 12px 0 0; max-width: 540px; }
        .hero-photo { flex: 2 1 340px; max-width: 480px; margin: 0; position: relative; }
        .hero-photo .samakaka { position: absolute; right: -12px; bottom: 14px; width: 60%; height: 60%; border-radius: 24px; }
        .hero-photo img { position: relative; display: block; width: 100%; height: 360px; object-fit: cover; border-radius: 24px; background: var(--surface-2); }
        .hero-photo figcaption { position: relative; margin-top: 18px; font-size: 12px; color: var(--muted); }
        .hero-photo figcaption a { color: inherit; }

        .search-card {
            display: grid;
            grid-template-columns: 1.4fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin: 22px 0 0;
            padding: 14px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 18px;
        }

        .search-field { display: grid; gap: 6px; }
        .field-label { font-size: 15px; font-weight: 700; }
        .input-wrap { position: relative; display: block; }
        .input-wrap [data-icon] { position: absolute; left: 14px; top: 0; bottom: 0; align-items: center; color: var(--muted); pointer-events: none; }
        .input-wrap .field { padding-left: 44px; }

        .field {
            display: block;
            width: 100%;
            min-height: 50px;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            font-size: 16px;
        }

        .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

        .submit-btn {
            min-height: 50px;
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: var(--primary-fill);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .submit-btn:hover { background: var(--primary-fill-strong); }
        .submit-btn.secondary { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--border); }

        .chips { display: flex; gap: 8px; margin: 14px 0 0; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        .chips::-webkit-scrollbar { display: none; }

        .chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
        }

        .chip .icon { width: 18px; height: 18px; color: var(--primary); }
        .chip.active .icon { color: #fff; }
        .chip:hover { border-color: var(--primary); }
        .chip.active { background: var(--primary-fill); border-color: var(--primary-fill); color: #fff; }

        .notice { font-size: 15px; color: var(--primary); font-weight: 600; margin: 10px 0 0; }
        .notice:empty { display: none; }

        /* Banners */
        .banner {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--primary);
            background: var(--primary-soft);
            font-size: 15px;
        }

        .banner p { flex: 1 1 240px; }
        .banner-actions { display: flex; gap: 8px; }

        /* Main category tiles */
        .feature-tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
        .ftile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            min-height: 104px;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 20px;
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            text-align: left;
        }
        .ftile .icon { width: 26px; height: 26px; }
        .ftile:hover { filter: brightness(1.1); }
        .ftile.beach { background: #1D4E89; }
        .ftile.nature { background: #1E6B3A; }
        .ftile.culture { background: var(--accent); color: var(--accent-ink); }
        .ftile.food { background: var(--primary-fill); }
        .ftile.night { background: var(--tile-night); }
        .ftile.agenda { background: var(--bg); color: var(--text); border-color: var(--text); }

        /* Home sections */
        main { padding-bottom: 56px; }
        .home-section { margin-top: 36px; }
        .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .section-head h2 { font-size: 22px; line-height: 1.25; font-weight: 800; }
        .section-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }

        .link-btn {
            flex: none;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            min-height: 44px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .card-row {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(270px, 300px);
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 12px 2px 6px;
            scrollbar-width: thin;
        }

        .card-row > * { scroll-snap-align: start; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 12px; }

        .prompt-card {
            margin-top: 12px;
            padding: 18px;
            border-radius: 16px;
            border: 1.5px dashed var(--border);
            background: var(--surface);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .prompt-card p { flex: 1 1 260px; }
        .prompt-card .hint { margin-top: 4px; }

        .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            min-height: 96px;
            padding: 14px;
            text-align: left;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
        }

        .tile:hover { border-color: var(--primary); }
        .tile .icon { width: 26px; height: 26px; color: var(--primary); }
        .tile-label { font-size: 17px; font-weight: 700; }
        .tile-count { font-size: 14px; color: var(--muted); }

        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }

        .collection {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 150px;
            padding: 14px;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            text-align: left;
            color: #fff;
            background: linear-gradient(135deg, var(--primary-fill) 0%, var(--primary-fill-strong) 100%);
        }

        .collection img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .collection::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.75) 100%); }
        .collection > span { position: relative; z-index: 1; }
        .collection-title { font-size: 19px; font-weight: 800; line-height: 1.2; }
        .collection-desc { font-size: 14px; opacity: 0.95; margin-top: 4px; }

        /* Place cards */
        .card { position: relative; display: flex; flex-direction: column; }

        .card-media {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 170px;
            padding: 0;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-fill) 0%, var(--primary-fill-strong) 100%);
            color: #fff;
            font-size: 30px;
            font-weight: 800;
        }

        .card-media img, .modal-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .saved-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .saved-tag .icon { width: 14px; height: 14px; fill: currentColor; }

        .card-body { display: flex; flex-direction: column; gap: 6px; padding: 10px 2px 4px; flex: 1; }
        .card-type { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.04em; }
        .card-type .icon { width: 14px; height: 14px; }
        .card-name { font-size: 18px; font-weight: 800; line-height: 1.2; }
        .price-pill { display: inline-block; padding: 3px 10px; border-radius: 10px; background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 700; }
        .price-pill.free { background: var(--free-bg); color: var(--free-ink); }
        .price-pill.tbc { background: var(--tbc-bg); color: var(--tbc-ink); }
        .card-name button { background: none; border: none; padding: 0; text-align: left; font-weight: inherit; }
        .card-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 14px; color: var(--muted); }
        .card-facts strong { color: var(--text); }
        .card-highlight { font-size: 15px; }
        .card-reason { font-size: 15px; }
        .card-reason b { color: var(--primary); }
        .card-verified { font-size: 13px; color: var(--muted); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 6px; }
        .card-actions .action-btn { font-size: 14px; padding: 0 8px; white-space: nowrap; }
        .card-actions .action-btn:only-child { grid-column: 1 / -1; }
        .price-note { display: inline-block; margin-top: 4px; font-size: 14px; color: var(--muted); }

        .rating {
            display: inline-block;
            background: var(--accent);
            color: var(--accent-ink);
            padding: 1px 8px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 800;
        }

        .status-open { color: var(--ok); font-weight: 700; }
        .status-closed { color: var(--primary); font-weight: 700; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .action-btn:hover { background: var(--primary-soft); }
        .action-btn.solid { background: var(--primary-fill); color: #fff; }
        .action-btn.solid:hover { background: var(--primary-fill-strong); }
        .action-btn.wide { grid-column: 1 / -1; min-height: 56px; font-size: 17px; }
        .action-btn.saved .icon { fill: currentColor; }

        /* Results */
        .results-head { margin-top: 22px; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--primary); font-weight: 700; font-size: 16px; min-height: 44px; padding: 0; }
        .results-head h2 { font-size: 26px; line-height: 1.2; font-weight: 800; }
        .results-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
        .results-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .results-tools .field { width: auto; min-width: 220px; }
        .results-count { font-size: 15px; color: var(--muted); }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 16px;
            padding: 40px 16px;
            border: 1.5px dashed var(--border);
            border-radius: 16px;
        }

        .hint { font-size: 14px; color: var(--muted); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; z-index: 100; padding: 16px; background: var(--overlay); align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-panel { position: relative; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 18px; }
        .profile-panel { max-width: 440px; padding: 28px 22px 22px; }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--text);
            font-size: 26px;
            line-height: 1;
            box-shadow: var(--shadow);
        }

        .modal-hero {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 240px;
            background: linear-gradient(135deg, var(--primary-fill) 0%, var(--primary-fill-strong) 100%);
            color: #fff;
            font-size: 52px;
            font-weight: 800;
        }

        .photo-badge { position: absolute; left: 12px; bottom: 12px; z-index: 1; background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
        .photo-meta { padding: 10px 20px 0; }
        .photo-credit { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
        .photo-credit a { color: inherit; }
        .photo-strip { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
        .photo-thumb { flex: 0 0 76px; height: 56px; padding: 0; border-radius: 10px; overflow: hidden; border: 3px solid transparent; background: var(--surface-2); }
        .photo-thumb.active { border-color: var(--primary); }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
        .modal-name { font-size: 26px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
        .modal-sub { display: flex; gap: 12px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }

        .rating-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;

        .event-actions .action-btn { min-height: 44px; padding: 0 10px; font-size: 14px; white-space: nowrap; }
        .events-note { margin-top: 18px; }
        .event-mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
        .event-mini { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-align: left; }
        .event-mini:hover { border-color: var(--primary); }
        .event-mini .db-day { font-size: 24px; }
        .event-mini-title { display: block; margin-top: 2px; font-size: 17px; font-weight: 800; line-height: 1.25; }
        .event-mini-meta { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }

        @media (max-width: 720px) {
            .rec-title { font-size: 27px; }
            .guide-jump { flex-wrap: nowrap; overflow-x: auto; }
            .sos-grid { grid-template-columns: 1fr; }
            .sos-call { flex-direction: row; align-items: center; gap: 14px; }
            .sos-call b { font-size: 28px; min-width: 64px; }
            .guide-card { padding: 16px; }
            .rec-grid, .social-row.other-row { grid-template-columns: 1fr; }
            .social-row { grid-template-columns: 1fr 50px; }
            .social-row select { grid-column: 1 / -1; }
            .event-card { grid-template-columns: 62px 1fr; gap: 10px; padding: 12px; }
            .event-photo { margin: -12px -12px 0; }
            .event-card .db-day { font-size: 24px; }
        }

        @media (min-width: 721px) {
            .row-nav {
                position: absolute;
                top: 70px;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 1.5px solid var(--border);
                background: var(--surface);
                color: var(--primary);
                box-shadow: var(--shadow);
            }
            .row-nav.prev { left: -16px; }
            .row-nav.next { right: -16px; }
            .row-nav:disabled { opacity: 0; pointer-events: none; }
        }

        /* Phone tab bar: the app's main sections, always one tap away. */
        .tabbar { display: none; }

        @media (max-width: 900px) {
            .hero-photo { display: none; }
            .feature-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (min-width: 721px) {
            .samakaka-strip { height: 16px; }
        }

        @media (max-width: 720px) {
            .top-nav, .desktop-only, #themeLabel { display: none !important; }
            .topbar-inner { padding: 8px 16px; }
            .hero { padding: 14px 0 0; }
            .hero-sub { display: none; }
            .search-card { grid-template-columns: 1fr; margin-top: 14px; }
            .hero h1 { font-size: 28px; line-height: 1.12; }
            .brand-name { font-size: 22px; }
            .brand-logo { width: 46px; height: 22px; }
            .feature-tiles { gap: 8px; margin-top: 18px; }
            .ftile { min-height: 78px; padding: 10px; border-radius: 16px; font-size: 13px; letter-spacing: -0.01em; }
            .ftile .icon { width: 22px; height: 22px; }
            .home-section { margin-top: 28px; }
            .tabbar {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 60;
                display: flex;
                padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
                background: var(--surface);
                border-top: 1px solid var(--line);
            }
            .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; padding: 4px 0; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 700; }
            .tab .icon, .tab .avatar { width: 24px; height: 24px; }
            .tab.active { color: var(--primary); }
            body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
            .modal { padding: 0; align-items: flex-end; }
            .modal-panel { max-height: 94vh; border-radius: 18px 18px 0 0; }
            .modal-hero { height: 200px; }
            .fact { grid-template-columns: 1fr; gap: 2px; }
            .results-tools .field { width: 100%; }
        }
    </style>
</head>

            {"id": 70, "type": "culture", "name": "Santuário da Muxima", "location": "Icolo e Bengo - Muxima", "lat": -9.5186, "lng": 13.9569, "exact": false, "description": "A Igreja de Nossa Senhora da Conceição da Muxima, do século XVI, na margem do rio Kwanza, a cerca de 130 km de Luanda. É o maior santuário mariano da África subsariana e monumento nacional desde 1924. A peregrinação anual costuma ser nas duas primeiras semanas de setembro; em 2024 juntou mais de 700 mil fiéis.", "photos": [{"url": "photos/muxima-pilgrimage-960.jpg", "thumb": "photos/muxima-pilgrimage-330.jpg", "author": "Paulo César Santos", "license": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Muxima_pilgrimage.JPG", "caption": {"pt": "A igreja e o rio Kwanza", "en": "The church and the Kwanza River"}}, {"url": "photos/church-of-muxima-pilgrimage-site-bengo-province-960.jpg", "thumb": "photos/church-of-muxima-pilgrimage-site-bengo-province-330.jpg", "author": "Paulo César Santos", "license": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Church_of_Muxima,_pilgrimage_site,_Bengo_province.JPG"}], "phone": "", "highlight": {"pt": "O maior santuário mariano da África subsariana, junto ao Kwanza.", "en": "Sub-Saharan Africa's largest Marian shrine, by the Kwanza."}, "family": true, "verified": {"date": "2026-10-10", "sources": [{"label": "Ver Angola (setembro de 2024)", "url": "https://www.verangola.net/va/pt/092024/Cultura/41301/Peregrina%C3%A7%C3%A3o-ao-Santu%C3%A1rio-da-Muxima-reuniu-mais-de-700-mil-fi%C3%A9is-Bispo-do-Porto-esteve-presente.htm"}, {"label": "Ver Angola", "url": "https://www.verangola.net/va/pt/072016/sugestoes/4875/Santu%C3%A1rio-de-Nossa-Senhora-da-Muxima.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Santu%C3%A1rio_de_Nossa_Senhora_da_Concei%C3%A7%C3%A3o_da_Muxima"}]}},
            {"id": 71, "type": "culture", "name": "Fortaleza de Massangano", "location": "Cuanza Norte - Massangano", "lat": -9.6294, "lng": 14.2565, "exact": true, "description": "Fortaleza de 1583 na margem do rio Cuanza, uma das mais antigas de Angola, ligada à ocupação portuguesa do interior e ao tráfico de escravos. Ainda se veem vestígios da antiga igreja. Em agosto de 2025 o Governo anunciou a sua reabilitação.", "photos": [{"url": "photos/fortaleza-de-massangano-angola-2021-04-17-960.jpg", "thumb": "photos/fortaleza-de-massangano-angola-2021-04-17-330.jpg", "author": "Angel Tostado", "license": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Fortaleza_de_Massangano,_Angola_-_2021-04-17.jpg"}], "phone": "", "highlight": {"pt": "Fortaleza de 1583 junto ao rio Cuanza.", "en": "A 1583 fortress by the Cuanza River."}, "family": true, "verified": {"date": "2026-10-10", "sources": [{"label": "Ver Angola", "url": "https://www.verangola.net/va/pt/072020/sugestoes/20926/Fortaleza-de-Massangano-O-que-fazer.htm"}, {"label": "Ver Angola (agosto de 2025)", "url": "https://www.verangola.net/va/pt/082025/Cultura/45628/Governo-anuncia-investimento-na-reabilita%C3%A7%C3%A3o-da-Fortaleza-de-Massangano.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Forte_de_Massangano"}]}},
            {"id": 72, "type": "nature", "name": "Parque Nacional da Cangandala", "location": "Malanje - Cangandala", "lat": -9.8, "lng": 16.75, "exact": false, "description": "O mais pequeno parque nacional de Angola, com 630 km², criado para proteger a palanca negra gigante, o símbolo do país. Em agosto de 2026 foram avistadas mais de 200 palancas negras gigantes juntas. Em 2024 o Governo anunciou que o parque ia abrir a visitantes, mas não encontrámos confirmação da abertura: confirme antes de ir.", "phone": "", "highlight": {"pt": "O parque da palanca negra gigante, símbolo de Angola.", "en": "The park of the giant sable antelope, Angola's symbol."}, "verified": {"date": "2026-10-10", "sources": [{"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Parque_Nacional_da_Cangandala"}, {"label": "Ver Angola (julho de 2024)", "url": "https://www.verangola.net/va/pt/072024/Ambiente/40959/Parque-Nacional-da-Cangandala-abre-ao-p%C3%BAblico-em-breve.htm"}, {"label": "Ver Angola (agosto de 2026)", "url": "https://www.verangola.net/va/pt/082026/Ambiente/49788/Parque-Nacional-de-Cangandala-regista-avistamento-in%C3%A9dito-de-mais-de-200-Palancas-Negras-Gigantes.htm"}]}, "hoursText": {"pt": "Visitas por confirmar.", "en": "Visits to be confirmed."}},

            const note = $('ratingNote');
            if (link) link.innerHTML = ratingLinkHTML(statsOf(v));
            if (avg) avg.innerHTML = avgHTML(statsOf(v));
            if (note) note.hidden = !statsOf(v);
        }

        async function loadRatingStats() {
            if (!reviewsEnabled()) return;
            try {
                const res = await sbRequest('/rest/v1/review_stats?select=venue_id,avg_rating,review_count', { headers: sbHeaders() });
                ratingStats = Object.fromEntries((await res.json()).map((r) => [r.venue_id, { avg: Number(r.avg_rating), count: r.review_count }]));
                render();
                refreshOpenRating();
            } catch {
                ratingStats = {};
            }
        }

        /* ---------- Filters and URL ---------- */

        const slug = (text) => normalize(text).replace(/[^a-z0-9]+/g, '-');
        const hasFilters = (f) => Boolean(f.q || f.where || f.quick || f.category || f.collection || f.saved);

        function filtersToQuery(f) {
            const params = new URLSearchParams();
            if (f.q) params.set('q', f.q);
            if (f.where) params.set('where', f.where === 'near' ? 'near' : slug(f.where));
            if (f.quick) params.set('filter', f.quick);
            if (f.category) params.set('category', f.category);
            if (f.collection) params.set('collection', f.collection);
            if (f.saved) params.set('saved', '1');
            return params.toString();
        }

        function filtersFromQuery(search) {
            const params = new URLSearchParams(search);
            const where = params.get('where');
            const has = (obj, key) => Boolean(key && Object.prototype.hasOwnProperty.call(obj, key));
            return {
                q: (params.get('q') || '').slice(0, 80),
                where: where === 'near' ? 'near' : CITIES.find((c) => slug(c) === where) || '',
                quick: has(QUICK, params.get('filter')) ? params.get('filter') : null,
                category: has(CATEGORY, params.get('category')) ? params.get('category') : null,
                collection: has(COLLECTIONS, params.get('collection')) ? params.get('collection') : null,
                saved: params.get('saved') === '1'
            };
        }

        function collectionMatch(key, v) {
            const c = COLLECTIONS[key];
            return c.ids ? c.ids.includes(v.id) : c.match(v);
        }

        function filteredVenues() {
            const f = state.filters;
            const list = venues.filter((v) =>
                (!f.saved || favorites.includes(v.id)) &&
                (!f.category || v.type === f.category) &&
                (!f.collection || collectionMatch(f.collection, v)) &&
                (!f.quick || QUICK[f.quick].match(v)) &&
                (!f.where || f.where === 'near' || cityOf(v) === f.where) &&
                matchesQuery(v, f.q)
            );
            const useDistance = state.userPos && (state.sort === 'distance' || (state.sort === 'relevance' && (f.where === 'near' || f.quick === 'near')));
            const byRating = (a, b) => (statsOf(b)?.avg || 0) - (statsOf(a)?.avg || 0) || (statsOf(b)?.count || 0) - (statsOf(a)?.count || 0);
            const recRank = (v) => {
                if (f.collection && COLLECTIONS[f.collection].ids) return COLLECTIONS[f.collection].ids.indexOf(v.id);
                const i = RECOMMENDED.indexOf(v.id);
                return i === -1 ? 99 : i;
            };
            const sorters = {
                relevance: (a, b) => queryScore(b, f.q) - queryScore(a, f.q) || recRank(a) - recRank(b) || byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                rating: (a, b) => byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                price: (a, b) => priceValue(a) - priceValue(b) || a.name.localeCompare(b.name, 'pt'),
                name: (a, b) => a.name.localeCompare(b.name, 'pt'),
                distance: (a, b) => distanceKm(a) - distanceKm(b)
            };
            const key = state.sort === 'distance' || (state.sort === 'rating' && !reviewsEnabled()) ? 'relevance' : state.sort;
            return list.sort(useDistance ? sorters.distance : sorters[key]);
        }

        function syncSearchForm() {
            $('qInput').value = state.filters.q;
            $('whereSelect').value = state.filters.where;
        }

        function showResults(filters, { push = true, scroll = true } = {}) {
            state.filters = { ...DEFAULT_FILTERS, ...filters };
            state.view = 'results';
            state.sort = 'relevance';
            renderSortOptions();
            syncSearchForm();
            if (push) history.pushState(null, '', `${location.pathname}?${filtersToQuery(state.filters)}`);
            if (state.filters.where === 'near' || state.filters.quick === 'near') locate();
            render();
            if (scroll) $('resultsView').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showRecommend({ push = true } = {}) {
            state.view = 'recommend';
            prepareRecommendForm();
            if (push) history.pushState(null, '', `${location.pathname}?page=recommend`);
            render();
            window.scrollTo({ top: 0 });
            $('recTitle').focus?.();
        }

        function showGuide({ push = true, section = '' } = {}) {
            state.view = 'guide';
            if (push) history.pushState(null, '', `${location.pathname}?page=guide${section ? `#guia-${section}` : ''}`);
            render();
            const target = section && $(`guia-${section}`);
            if (target) target.scrollIntoView({ block: 'start' });
            else window.scrollTo({ top: 0 });
        }

        function goHome({ push = true } = {}) {
            state.view = 'home';
            state.filters = { ...DEFAULT_FILTERS };
            syncSearchForm();
            if (push) history.pushState(null, '', location.pathname);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function applyURL() {
            const filters = filtersFromQuery(location.search);
            const params = new URLSearchParams(location.search);
            if (params.get('page') === 'recommend') {
                if (state.view !== 'recommend') showRecommend({ push: false });
            } else if (params.get('page') === 'events') showEvents({ push: false, filters: eventFiltersFromQuery(params) });
            else if (params.get('page') === 'guide') {
                const section = location.hash.match(/^#guia-([a-z]+)$/)?.[1] || '';
                if (state.view !== 'guide' || section) showGuide({ push: false, section: GUIDE.some((g) => g.id === section) ? section : '' });
            }
            else if (hasFilters(filters)) showResults(filters, { push: false, scroll: false });
            else if (state.view !== 'home') goHome({ push: false });
            const deepLink = location.hash.match(/^#local-(\d+)$/);
            if (deepLink) openVenue(Number(deepLink[1]));
            else if (state.openId) closeModal('venueModal', { updateURL: false });
            const eventLink = location.hash.match(/^#evento-([\w-]+)$/);
            if (eventLink && state.view === 'events') focusEvent(eventLink[1]);
        }

        /* ---------- Cards and rows ---------- */

        function cardHTML(v, options = {}) {
            const stats = statsOf(v);
            const dist = distanceText(v);
            const saved = favorites.includes(v.id);
            const highlight = options.reason
                ? `<p class="card-reason"><b>${t('why')}</b> ${escapeHTML(highlightOf(v))}</p>`
                : `<p class="card-highlight">${escapeHTML(highlightOf(v))}</p>`;
            return `
                <article class="card">
                    <button class="card-media" type="button" data-open="${v.id}" aria-label="${t('viewPlace')}: ${escapeHTML(v.name)}">
                        <span aria-hidden="true">${escapeHTML(initials(v.name))}</span>
                        ${thumbSrc(v) ? `<img src="${escapeHTML(thumbSrc(v))}" alt=""${focusAttr(v.photos?.[0])} crossorigin="anonymous" loading="lazy" onerror="this.remove()">` : ''}
                        ${saved ? `<span class="saved-tag">${icon('heart')}${t('saved')}</span>` : ''}
                    </button>
                    <div class="card-body">
                        <span class="card-type">${icon(CATEGORY[v.type].icon)}${catLabel(v.type, false)} · ${escapeHTML(placeLine(v))}</span>
                        <h3 class="card-name"><button type="button" data-open="${v.id}">${escapeHTML(v.name)}</button></h3>
                        <div class="card-facts">
                            ${stats ? `<span><span class="rating">★ ${stats.avg.toFixed(1)}</span> ${reviewCountText(stats.count)}</span>` : ''}
                            <span class="price-pill${!v.price ? ' tbc' : v.price.free ? ' free' : ''}">${escapeHTML(priceText(v))}</span>
                            ${options.fromLuanda ? `<span>${t('fromLuanda', { d: formatKm(kmBetween(LUANDA_CENTRE, v)) })}</span>` : dist ? `<span>${dist}</span>` : ''}
                            ${statusHTML(v)}
                        </div>
                        ${highlight}
                        <div class="card-actions">
                            <button class="action-btn" type="button" data-open="${v.id}">${t('viewPlace')}</button>
                            ${v.citywide ? '' : `<a class="action-btn solid" href="${mapsURL(v, 'directions')}" target="_blank" rel="noopener">${t('directions')}</a>`}
                        </div>
                    </div>
                </article>
            `;
        }

        function rowHTML(list, options) {
            return `
                <div class="row-wrap">
                    <button class="row-nav prev" type="button" data-scroll="-1" aria-label="${t('prevRow')}" disabled>${icon('back')}</button>
                    <div class="card-row">${list.map((v) => cardHTML(v, options)).join('')}</div>
                    <button class="row-nav next" type="button" data-scroll="1" aria-label="${t('nextRow')}">${icon('next')}</button>
                </div>`;
        }

        // Arrows and the fade only show while there is more to scroll.
        function updateRowControls(row) {
            const wrap = row.closest('.row-wrap');
            if (!wrap) return;
            const atStart = row.scrollLeft <= 4;
            const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
            wrap.querySelector('.prev').disabled = atStart;
            wrap.querySelector('.next').disabled = atEnd;
            row.classList.toggle('fade-end', !atEnd);
        }

        function sectionHTML(id, title, sub, body, more) {
            return `
                <section class="home-section" aria-labelledby="${id}">
                    <div class="section-head">
                        <h2 id="${id}">${title}</h2>
                        ${more ? `<button class="link-btn" type="button" data-more='${escapeHTML(JSON.stringify(more))}'>${t('seeAll')}</button>` : ''}
                    </div>
                    ${sub ? `<p class="section-sub">${sub}</p>` : ''}
                    ${body}
                </section>
            `;
        }

        function categoryTilesHTML() {
            return `<div class="tile-grid">${Object.entries(CATEGORY).map(([key, c]) => {
                const count = venues.filter((v) => v.type === key).length;
                return `<button class="tile" type="button" data-category="${key}">${icon(c.icon)}<span class="tile-label">${c[lang][0]}</span><span class="tile-count">${placesCount(count)}</span></button>`;
            }).join('')}</div>`;
        }

        // The six big tiles under the search: four categories, nightlife (bars and clubs) and the agenda.
        function featureTilesHTML() {
            const tiles = [
                ['beach', 'tileBeach', 'beach', 'data-category="beach"'],
                ['nature', 'tileNature', 'mountain', 'data-category="nature"'],
                ['culture', 'tileCulture', 'landmark', 'data-category="culture"'],
                ['food', 'tileFood', 'restaurant', 'data-category="restaurant"'],
                ['night', 'nightlife', 'moon', 'data-quick="nightlife"'],
                ['agenda', 'agenda', 'calendar', 'data-action="events"']
            ];
            return `<nav class="feature-tiles" aria-label="${t('tilesTitle')}">${tiles.map(([cls, label, ic, attr]) =>
                `<button class="ftile ${cls}" type="button" ${attr}>${icon(ic)}<span>${t(label)}</span></button>`).join('')}</nav>`;
        }

        const recommendedList = () => RECOMMENDED.map((id) => venues.find((v) => v.id === id)).filter(Boolean);

        /* ---------- Home ---------- */

        function renderHome() {
            const parts = [featureTilesHTML()];
            const savedList = venues.filter((v) => favorites.includes(v.id));
            if (savedList.length) parts.push(sectionHTML('secSaved', t('savedTitle'), '', rowHTML(savedList), { saved: true }));

            parts.push(sectionHTML('secRecommended', t('recommendedTitle'), t('recommendedSub'), rowHTML(recommendedList(), { reason: true })));

            const nextEvents = upcomingEvents().slice(0, 3);
            if (nextEvents.length) {
                parts.push(`
                    <section class="home-section" aria-labelledby="secEvents">
                        <div class="section-head">
                            <h2 id="secEvents">${t('eventsHomeTitle')}</h2>
                            <button class="link-btn" type="button" data-action="events">${t('eventsSeeAll')}</button>
                        </div>
                        <p class="section-sub">${t('eventsHomeSub')}</p>
                        <div class="event-mini-grid">${nextEvents.map(eventMiniHTML).join('')}</div>
                    </section>`);
            }
            parts.push(`
                <section class="home-cta guide-cta" aria-labelledby="guideCtaTitle">
                    <div><h2 id="guideCtaTitle">${t('guideCtaTitle')}</h2><p>${t('guideCtaText')}</p></div>
                    <button class="submit-btn" type="button" data-action="guide">${t('guideOpen')}</button>
                </section>`);
            parts.push(sectionHTML('secCategories', t('categoriesTitle'), '', categoryTilesHTML()));

            const collections = Object.entries(COLLECTIONS).map(([key, c]) => {
                const count = venues.filter((v) => collectionMatch(key, v)).length;
                const cover = venues.find((v) => v.id === c.cover);
                return `
                    <button class="collection" type="button" data-collection="${key}">
                        ${cover?.photos ? `<img src="${escapeHTML(asset(cover.photos[0].thumb))}" alt="" crossorigin="anonymous" loading="lazy">` : ''}
                        <span class="collection-title">${t(c.title)}</span>
                        <span class="collection-desc">${t(c.desc)} · ${placesCount(count)}</span>
                    </button>`;
            }).join('');
            parts.push(sectionHTML('secCollections', t('collectionsTitle'), t('collectionsSub'), `<div class="collection-grid">${collections}</div>`));

            const dayTrips = venues
                .filter((v) => v.exact && kmBetween(LUANDA_CENTRE, v) >= 25 && kmBetween(LUANDA_CENTRE, v) <= 160)
                .sort((a, b) => kmBetween(LUANDA_CENTRE, a) - kmBetween(LUANDA_CENTRE, b));
            if (dayTrips.length) parts.push(sectionHTML('secDayTrips', t('dayTripsTitle'), t('dayTripsSub'), rowHTML(dayTrips, { fromLuanda: true })));

            if (canRecommend()) {
                parts.push(`
                    <section class="home-cta" aria-labelledby="recCtaTitle">
                        <div><h2 id="recCtaTitle">${t('recCtaTitle')}</h2><p>${t('recCtaText')}</p></div>
                        <button class="submit-btn" type="button" data-action="recommend">${t('recTitle')}</button>
                    </section>`);
            }

            $('homeView').innerHTML = parts.join('');
            document.querySelectorAll('#homeView .card-row').forEach(updateRowControls);
        }

        /* ---------- Results ---------- */

        function resultsTitle() {
            const f = state.filters;
            if (f.saved) return t('savedTitle');
            if (f.collection) return t(COLLECTIONS[f.collection].title);
            if (f.category) return catLabel(f.category, true);
            if (f.quick) return t(QUICK[f.quick].label);
            if (f.q) return t('resultsFor', { q: f.q });
            if (f.where === 'near') return t('nearYou');
            if (f.where) return t('inCity', { city: f.where });
            return t('allPlaces');
        }

        function resultsSub() {
            const f = state.filters;
            const parts = [];
            if (f.collection) parts.push(t(COLLECTIONS[f.collection].desc));
            if (f.quick && QUICK[f.quick].note) parts.push(t(QUICK[f.quick].note));
            if (f.q && (f.category || f.collection || f.quick)) parts.push(t('resultsFor', { q: f.q }));
            if (f.where && f.where !== 'near' && resultsTitle() !== t('inCity', { city: f.where })) parts.push(t('inCity', { city: f.where }));
            return parts.join(' · ');
        }

        function emptyHTML() {
            return `
                <div class="empty-block">
                    <p>${state.filters.saved ? t('emptySaved') : t('emptyFilter')}</p>
                    <button class="submit-btn" type="button" data-action="clear">${t('clearSearch')}</button>
                    <p class="hint">${t('emptyTry')}</p>
                    ${categoryTilesHTML()}
                </div>
                ${sectionHTML('secEmptyRecommended', t('recommendedTitle'), '', rowHTML(recommendedList(), { reason: true }))}`;
        }

        function renderResults() {
            const list = filteredVenues();
            $('resultsTitle').textContent = resultsTitle();
            $('resultsSub').textContent = resultsSub();
            $('resultsCount').textContent = placesCount(list.length);
            $('resultsTools').hidden = list.length === 0;
            if (list.length) {
                $('resultsList').className = 'card-grid';
                $('resultsList').innerHTML = list.map((v) => cardHTML(v)).join('');
            } else {
                $('resultsList').className = '';
                $('resultsList').innerHTML = emptyHTML();
                document.querySelectorAll('#resultsList .card-row').forEach(updateRowControls);
            }
        }

        function renderQuickFilters() {
            $('quickFilters').innerHTML = Object.entries(QUICK)
                .filter(([, q]) => !q.show || q.show())
                .map(([key, q]) => {
                    const active = state.view === 'results' && state.filters.quick === key;
                    return `<button type="button" class="chip${active ? ' active' : ''}" data-quick="${key}" aria-pressed="${active}">${icon(q.icon)}${t(q.label)}</button>`;
                }).join('');
        }

        function renderWhereOptions() {
            $('whereSelect').innerHTML = [
                `<option value="">${t('whereAll')}</option>`,
                `<option value="near">${t('nearMe')}</option>`,
                ...CITIES.map((c) => `<option value="${c}">${c}</option>`)
            ].join('');
            $('whereSelect').value = state.filters.where;
        }

        function renderSortOptions() {
            const options = ['relevance', 'distance', ...(reviewsEnabled() ? ['rating'] : []), 'price', 'name'];
            const labels = { relevance: 'sortRelevance', distance: 'sortDistance', rating: 'sortRating', price: 'sortPrice', name: 'sortName' };
            $('sortSelect').innerHTML = options.map((o) => `<option value="${o}">${t(labels[o])}</option>`).join('');
            $('sortSelect').value = options.includes(state.sort) ? state.sort : 'relevance';
        }

        function renderSavedButton() {
            $('savedCount').textContent = favorites.length;
            $('savedCount').hidden = favorites.length === 0;
        }

        function renderTabbar() {
            const active = state.view === 'events' || state.view === 'guide' ? state.view : state.view === 'results' && state.filters.saved ? 'saved' : state.view === 'home' ? 'home' : '';
            document.querySelectorAll('#tabbar .tab').forEach((tab) => {
                const on = tab.dataset.tab === active;
                tab.classList.toggle('active', on);
                if (on) tab.setAttribute('aria-current', 'page');
                else tab.removeAttribute('aria-current');
            });
        }

        function render() {
            renderQuickFilters();
            renderSavedButton();
            renderTabbar();
            $('hero').hidden = state.view === 'recommend' || state.view === 'events' || state.view === 'guide';
            $('homeView').hidden = state.view !== 'home';
            $('resultsView').hidden = state.view !== 'results';
            $('recommendView').hidden = state.view !== 'recommend';
            $('eventsView').hidden = state.view !== 'events';
            $('guideView').hidden = state.view !== 'guide';
            if (state.view === 'home') renderHome();
            else if (state.view === 'results') renderResults();
            else if (state.view === 'events') renderEvents();
            else if (state.view === 'guide') renderGuide();
        }

        /* ---------- Practical guide ---------- */

        function guideItemHTML(item) {
            const place = item.place && venues.find((v) => v.id === item.place);
            const links = [
                place ? `<button class="link-btn" type="button" data-open="${place.id}">${t('guideSeePlace', { name: escapeHTML(place.name) })}</button>` : '',
                item.category ? `<button class="link-btn" type="button" data-category="${item.category}">${t('guideSeeCategory', { name: catLabel(item.category, true) })}</button>` : '',
                item.link ? `<a class="link-btn" href="${escapeHTML(item.link)}" target="_blank" rel="noopener">${escapeHTML(new URL(item.link).hostname.replace(/^www\./, ''))}${icon('external')}</a>` : ''
            ].join('');
            return `
                <li>
                    ${item.lead ? `<b>${escapeHTML(item.lead[lang])}</b>` : ''}
                    ${item.tbc ? `<span class="price-pill tbc">${t('toConfirm')}</span>` : ''}
                    <span>${escapeHTML(item[lang])}</span>
                    ${links ? `<span class="guide-links">${links}</span>` : ''}
                </li>`;
        }

        function renderGuide() {
            $('guideChecked').textContent = t('guideChecked', { date: formatDate(GUIDE_CHECKED) });
            const jump = `<nav class="chips guide-jump" aria-label="${t('guideJump')}">${GUIDE.map((g) =>
                `<button class="chip" type="button" data-guide-jump="${g.id}">${icon(g.icon)}${escapeHTML(g.title[lang])}</button>`).join('')}</nav>`;
            const sections = GUIDE.map((g) => `
                <section class="guide-card${g.emergency ? ' sos' : ''}" id="guia-${g.id}" aria-labelledby="guia-${g.id}-title">
                    <h2 id="guia-${g.id}-title">${icon(g.icon)}${escapeHTML(g.title[lang])}</h2>
                    ${g.emergency ? `<div class="sos-grid">${EMERGENCY.map((e) =>
                        `<a class="sos-call" href="tel:${e.number}" aria-label="${t('guideCall', { number: e.number, name: escapeHTML(e[lang]) })}"><b>${e.number}</b><span>${escapeHTML(e[lang])}</span></a>`).join('')}</div>` : ''}
                    <ul class="guide-list">${g.items.map(guideItemHTML).join('')}</ul>
                    <p class="guide-sources">${t('sourcesLabel')}: ${g.sources.map((src) => `<a href="${escapeHTML(src.url)}" target="_blank" rel="noopener">${escapeHTML(src.label)}</a>`).join(', ')}</p>
                </section>`).join('');
            $('guideBody').innerHTML = jump + sections;
        }

        /* ---------- Place details ---------- */

        function socialLinks(v) {
            const q = `${v.name} ${cityOf(v)} Angola`;
            const enc = encodeURIComponent(q);
            return [
                ['YouTube', `https://www.youtube.com/results?search_query=${enc}`],
                ['Instagram', `https://www.google.com/search?q=${encodeURIComponent(q + ' site:instagram.com')}`],
                ['TikTok', `https://www.tiktok.com/search?q=${enc}`]
            ].map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`).join('');
        }

        function hoursHTML(v) {
            if (!v.hours) return v.hoursText ? escapeHTML(v.hoursText[lang] || v.hoursText.pt) : t('toConfirm');
            const today = luandaNow().day;
            const order = [1, 2, 3, 4, 5, 6, 0];
            return `${statusHTML(v)}<ul class="week">${order.map((d) => {
                const slots = v.hours[d];
                const text = slots ? slots.map(([o, c]) => `${o}–${c}`).join(', ') : t('closed');
                return `<li class="${d === today ? 'today' : ''}"><span>${weekdayName(d)}</span><span>${text}</span></li>`;
            }).join('')}</ul>`;
        }

        function verifiedRowHTML(v) {
            if (!v.verified) return `<div class="fact"><dt>${t('notVerifiedLabel')}</dt><dd>${t('notVerified')}</dd></div>`;
            const date = formatDate(v.verified.date);
            const sources = v.verified.sources.length
                ? `<br>${t('sourcesLabel')}: ${v.verified.sources.map((s) => `<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener">${escapeHTML(s.label)}</a>`).join(', ')}`
                : '';
            const label = v.exact ? t('verifiedLabelExact') : t('verifiedLabelApprox');
            const text = v.exact ? t('verifiedExact', { date }) : t('verifiedApprox', { date });
            return `<div class="fact"><dt>${label}</dt><dd>${text}${v.verified.stale ? `<br>${t('verifiedStale')}` : ''}${sources}</dd></div>`;
        }

        function practicalHTML(v) {
            const digits = phoneDigits(v);
            const address = v.address || placeLine(v);
            const map = v.citywide
                ? `<p class="hint">${t('citywideMap')}</p>`
                : v.exact
                ? `<iframe class="map-frame" src="${mapEmbedURL(v)}" title="${escapeHTML(v.name)}" loading="lazy"></iframe>
                   <p class="coords">Lat ${v.lat.toFixed(4)} · Long ${v.lng.toFixed(4)}</p>`
                : `<p class="hint">${t('approxMap')}</p>`;
            return `
                <section>
                    <h3 class="section-title">${t('practicalInfo')}</h3>

        function updateStars() {
            document.querySelectorAll('#starInput .star-btn').forEach((btn) => {
                const on = Number(btn.dataset.star) <= state.rating;
                btn.textContent = on ? '★' : '☆';

        // The author name and account are filled in by the database from the signed-in account.
        async function submitReview(event) {
            event.preventDefault();
            const comment = $('reviewText').value.trim();
            const msg = $('reviewMsg');
            const button = $('reviewSubmit');
            msg.classList.remove('ok');
            if (!state.rating && !comment) { msg.textContent = t('errReviewEmpty'); $('reviewText').focus(); return; }

            button.disabled = true;
            button.textContent = t('sending');
            try {
                await sbRequest('/rest/v1/reviews', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify({ venue_id: state.openId, rating: state.rating || null, comment: comment || null })
                });
                const rated = Boolean(state.rating);
                $('reviewText').value = '';
                state.rating = 0;
                updateStars();
                msg.textContent = t('reviewPending');
                msg.classList.add('ok');
                // Posts go live straight away, so show the new comment and the updated stars.

            } catch (err) {
                if (needsSignIn(err, msg)) return;
                msg.textContent = err.status === 409 ? t('errAlreadyRated') : t('errSend');

                button.disabled = false;
                button.textContent = t('send');
            }
        }

        /* ---------- Visitor photos and videos (Supabase) ---------- */

        const VIDEO_URL = /^https:\/\/(www\.|m\.|vm\.)?(youtube\.com|youtu\.be|tiktok\.com|instagram\.com)\//i;
        const photoBase = () => `${SUPABASE_URL}/storage/v1/object/public/submissions/`;

        function sbHeaders(extra = {}) {
            const headers = { apikey: SUPABASE_KEY, ...extra };
            if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = `Bearer ${SUPABASE_KEY}`;
            return headers;
        }

        async function sbRequest(path, options = {}) {
            const res = await fetch(`${SUPABASE_URL}${path}`, options);
            if (!res.ok) throw Object.assign(new Error(`Supabase ${res.status}`), { status: res.status });
            return res;
        }

        async function compressPhoto(file) {
            const bitmap = await createImageBitmap(file);
            const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(bitmap.width * scale);
            canvas.height = Math.round(bitmap.height * scale);
            canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            bitmap.close?.();
            return new Promise((resolve, reject) => canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('encode'))), 'image/jpeg', 0.82));
        }

        function visitorHTML(v) {
            if (!supabaseReady()) return '';

        function submissionHTML(s, v) {
            const caption = `<div class="visitor-caption">${avatarHTML(s.author_avatar, s.author, 'sm')}<span>${escapeHTML(s.author)}${s.caption ? ` · ${escapeHTML(s.caption)}` : ''}</span></div>`;
            const report = `<button type="button" class="report-btn" data-report="${escapeHTML(s.id)}">${t('report')}</button>`;
            if (s.kind === 'photo' && s.url.startsWith(photoBase())) {
                return `<figure class="visitor-item"><a href="${escapeHTML(s.url)}" target="_blank" rel="noopener"><img src="${escapeHTML(s.url)}" alt="${escapeHTML(s.caption || v.name)}" loading="lazy"></a>${caption}${report}</figure>`;
            }
            if (s.kind === 'video' && VIDEO_URL.test(s.url)) {
                const host = new URL(s.url).hostname;
                const site = host.includes('tiktok') ? 'TikTok' : host.includes('instagram') ? 'Instagram' : 'YouTube';
                return `<div class="visitor-item"><a class="video-link" href="${escapeHTML(s.url)}" target="_blank" rel="noopener">${icon('play')}${t('watchVideo', { site })}</a>${caption}${report}</div>`;
            }
            return '';

        async function loadSubmissions(venueId) {
            if (!supabaseReady()) return;
            try {
                const res = await sbRequest(`/rest/v1/submissions?select=id,kind,url,author,author_avatar,caption&venue_id=eq.${venueId}&status=eq.approved&order=created_at.desc&limit=30`, { headers: sbHeaders() });
                const items = await res.json();
                const gallery = $('visitorGallery');
                if (state.openId !== venueId || !gallery) return;
                const v = venues.find((x) => x.id === venueId);
                const html = items.map((s) => submissionHTML(s, v)).join('');
                gallery.innerHTML = html || `<p class="hint">${t('visitorEmpty')}</p>`;
            } catch {
                const gallery = $('visitorGallery');
                if (gallery && state.openId === venueId) gallery.innerHTML = `<p class="hint">${t('visitorError')}</p>`;
            }
        }

        async function submitMedia(event) {
            event.preventDefault();
            const venueId = state.openId;
            const kind = document.querySelector('input[name="mediaKind"]:checked').value;
            const caption = $('mediaCaption').value.trim();
            const msg = $('mediaMsg');
            const button = $('mediaSubmit');
            msg.classList.remove('ok');

            const file = $('mediaFile').files[0];
            const videoUrl = $('mediaUrl').value.trim();
            if (kind === 'photo' && !file) { msg.textContent = t('errFile'); return; }
            if (kind === 'photo' && !file.type.startsWith('image/')) { msg.textContent = t('errFileType'); return; }
            if (kind === 'video' && !VIDEO_URL.test(videoUrl)) { msg.textContent = t('errVideo'); $('mediaUrl').focus(); return; }
            if (!$('mediaConsent').checked) { msg.textContent = t('errConsent'); return; }

            button.disabled = true;
            button.textContent = t('sending');
            msg.textContent = '';
            try {
                let url = videoUrl;
                if (kind === 'photo') {
                    const blob = await compressPhoto(file);
                    // Each account uploads into its own folder, so the files can be removed with the account.
                    const path = `${session.user.id}/${venueId}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}.jpg`;
                    await sbRequest(`/storage/v1/object/submissions/${path}`, {
                        method: 'POST',
                        headers: await userHeaders({ 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }),
                        body: blob
                    });
                    url = photoBase() + path;
                }
                await sbRequest('/rest/v1/submissions', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify({ venue_id: venueId, kind, url, caption: caption || null })
                });
                if (state.openId !== venueId) return;
                $('mediaForm').reset();
                $('photoField').hidden = false;
                $('videoField').hidden = true;
                msg.textContent = t('mediaThanks');
                msg.classList.add('ok');
                loadSubmissions(venueId);
            } catch (err) {
                if (needsSignIn(err, msg)) return;
                msg.textContent = t('errSend');
            } finally {
                button.disabled = false;
                button.textContent = t('sendMedia');
            }
        }

        async function reportSubmission(button) {
            if (!signedIn()) { openAuth('signin', { reason: t('authNeedReport') }); return; }
            if (!confirm(t('reportConfirm'))) return;
            button.disabled = true;
            try {
                await sbRequest('/rest/v1/reports', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify(button.dataset.report ? { submission_id: button.dataset.report } : { review_id: button.dataset.reportReview })
                });
                button.textContent = t('reported');
            } catch (err) {
                if (err.status === 409) { button.textContent = t('alreadyReported'); return; }
                button.disabled = false;
                button.textContent = needsSignIn(err) ? t('signIn') : t('errSend');

        /* ---------- Accounts (Supabase Auth: email and password) ---------- */

        let session = store.get('angoliveSession', null);
        let authView = 'signin';
        let afterAuth = null;
        let refreshing = null;
        const accountsEnabled = supabaseReady;
        const signedIn = () => accountsEnabled() && Boolean(session?.access_token);
        const accountName = () => session?.user?.user_metadata?.display_name || session?.user?.email?.split('@')[0] || '';
        const myAvatar = () => session?.user?.user_metadata?.avatar || null;

        // Profile pictures: cartoon drawings of traditional masks from Angola, in the flag's colours (avatars/).
        const AVATARS = {
            'mask-mwana-pwo': { pt: 'Máscara Mwana Pwo (Cokwe)', en: 'Mwana Pwo mask (Chokwe)' },
            'mask-pwo': { pt: 'Máscara Pwo (Cokwe)', en: 'Pwo mask (Chokwe)' },
            'mask-chihongo': { pt: 'Máscara Chihongo (Cokwe)', en: 'Chihongo mask (Chokwe)' },
            'mask-chikunza': { pt: 'Máscara Chikunza (Cokwe)', en: 'Chikunza mask (Chokwe)' },
            'mask-danca': { pt: 'Máscara de dança (Cokwe)', en: 'Dance mask (Chokwe)' },
            'mask-lwena': { pt: 'Máscara Lwena', en: 'Lwena mask' }
        };

        // Only the app's own masks or a photo in a person's own folder are shown, never any other link.
        const isAvatarPhoto = (value) => typeof value === 'string' && value.startsWith(photoBase()) && /^[0-9a-f-]{36}\/avatar-\d+\.jpg$/.test(value.slice(photoBase().length));
        function avatarSrc(value) {
            if (AVATARS[value]) return asset(`avatars/${value}.svg`);
            return isAvatarPhoto(value) ? value : '';
        }

        function avatarHTML(value, name, size = '') {
            const src = avatarSrc(value);
            return src
                ? `<img class="avatar ${size}" src="${escapeHTML(src)}" alt="" loading="lazy">`
                : `<span class="avatar avatar-initial ${size}" aria-hidden="true">${escapeHTML((name || '?').trim().charAt(0).toUpperCase() || '?')}</span>`;
        }

        function avatarOptionsHTML(current, inputName) {
            const own = isAvatarPhoto(current)
                ? `<label class="avatar-opt" title="${t('avatarYourPhoto')}"><input type="radio" name="${inputName}" value="${escapeHTML(current)}" checked><img src="${escapeHTML(current)}" alt="${t('avatarYourPhoto')}" width="56" height="56"></label>`
                : '';
            return `<div class="avatar-options">${own}${Object.entries(AVATARS).map(([key, a]) => `
                <label class="avatar-opt" title="${escapeHTML(a[lang])}">
                    <input type="radio" name="${inputName}" value="${key}" ${current === key ? 'checked' : ''}>
                    <img src="${escapeHTML(asset(`avatars/${key}.svg`))}" alt="${escapeHTML(a[lang])}" width="56" height="56">
                </label>`).join('')}</div>`;
        }
        const authRedirect = () => (inNativeApp ? PUBLIC_URL : `${location.origin}${location.pathname}`);
        const validEmail = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        const STATUS_LABELS = { pending: 'statusPending', approved: 'statusApproved', rejected: 'statusRejected', hidden: 'statusHidden', new: 'statusNew', done: 'statusDone' };

        function saveSession(data) {
            if (!data) {
                session = null;
                store.remove('angoliveSession');
            } else {
                session = {
                    access_token: data.access_token,
                    refresh_token: data.refresh_token || session?.refresh_token,
                    expires_at: Number(data.expires_at) || Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600),
                    user: data.user ? { id: data.user.id, email: data.user.email, user_metadata: data.user.user_metadata || {} } : session?.user || null
                };
                store.set('angoliveSession', session);
            }
            renderAccountButton();
        }

        async function authRequest(path, body, { method = 'POST', token } = {}) {
            const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            const res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw Object.assign(new Error('auth'), { status: res.status, code: data.error_code || data.code || data.error || '', text: data.msg || data.error_description || data.message || '' });
            }
            return data;
        }

        // Access tokens last about an hour; renew them a minute before they run out.
        async function accessToken() {
            if (!signedIn()) return null;
            if (session.expires_at - 60 > Date.now() / 1000) return session.access_token;
            refreshing ||= authRequest('/token?grant_type=refresh_token', { refresh_token: session.refresh_token })
                .then((data) => {
                    saveSession(data);
                    return session.access_token;
                })
                .catch((err) => {
                    if (err.status && err.status < 500) signOutLocally();
                    return null;
                })
                .finally(() => { refreshing = null; });
            return refreshing;
        }

        // Requests made as the signed-in person; the database's row-level security checks who they are.
        async function userHeaders(extra = {}) {
            const token = await accessToken();
            if (!token) throw Object.assign(new Error('signin'), { status: 401 });
            return { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, ...extra };
        }

        function needsSignIn(err, msg) {
            if (err?.status !== 401) return false;
            if (msg) msg.textContent = t('authExpired');
            openAuth('signin', { reason: t('authExpired') });
            return true;
        }

        function authErrorText(err) {
            const code = String(err.code || '');
            const text = String(err.text || '').toLowerCase();
            if (err.status === 429 || code.includes('rate_limit')) return t('authErrRate');
            if (code === 'invalid_credentials' || text.includes('invalid login')) return t('authErrCredentials');
            if (code === 'email_not_confirmed' || text.includes('not confirmed')) return t('authErrNotConfirmed');
            if (code === 'user_already_exists' || code === 'email_exists' || text.includes('already registered')) return t('authErrExists');
            if (code === 'weak_password' || text.includes('password should')) return t('authErrWeak');
            if (code === 'otp_expired' || code === 'flow_state_expired') return t('authErrLink');
            return t('errSend');
        }

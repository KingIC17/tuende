<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tuende - Descubra onde ir em Angola</title>
    <meta name="description" content="Encontre restaurantes, praias, hotéis, vida noturna e experiências em Angola, perto de si. Com preços em Kwanza e indicações para chegar.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tuende">
    <meta property="og:title" content="Tuende - Descubra onde ir em Angola">
    <meta property="og:description" content="Restaurantes, praias, cultura, natureza, vida noturna, alojamento e agenda de eventos em Angola, com preços em Kwanza.">
    <meta property="og:url" content="https://kingic17.github.io/tuende/">
    <meta property="og:image" content="https://kingic17.github.io/tuende/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Tuende: Descubra onde ir em Angola">
    <meta property="og:locale" content="pt_PT">
    <meta property="og:locale:alternate" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#CE1126">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tuende">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        @font-face {
            font-family: 'Plus Jakarta Sans';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            /* The iPhone app bundles the font next to the page, so the second address is its fallback. */
            src: url('fonts/plus-jakarta-sans-latin.woff2') format('woff2'), url('plus-jakarta-sans-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* --primary colours text and outlines; --primary-fill sits behind white text, so it stays dark enough in both themes. */
        :root {
            --primary: #CE1126;
            --primary-strong: #A50E1F;
            --primary-fill: #CE1126;
            --primary-fill-strong: #A50E1F;
            --primary-soft: rgba(206, 17, 38, 0.08);
            --accent: #FFCB00;
            --accent-ink: #111111;
            --bg: #FFFFFF;
            --surface: #FFFFFF;
            --surface-2: #F3F3F5;
            --text: #161618;
            --muted: #55555D;
            --border: #DADADF;
            --line: #E4E4E8;
            --tile-night: #111111;
            --free-bg: #E9F6EE;
            --free-ink: #1E6B3A;
            --tbc-bg: #F3F3F5;
            --tbc-ink: #55555D;
            --ok: #127A3E;
            --overlay: rgba(0, 0, 0, 0.6);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #FF6B7A;
                --primary-strong: #FF8A96;
                --primary-soft: rgba(255, 107, 122, 0.14);
                --bg: #0E0E10;
                --surface: #1A1A1F;
                --surface-2: #222226;
                --text: #F2F2F4;
                --muted: #B4B4BC;
                --border: #34343A;
                --line: #2E2E35;
                --tile-night: #2B2B33;
                --free-bg: #12301E;
                --free-ink: #7EDB9C;
                --tbc-bg: #1F1F25;
                --tbc-ink: #C9C9D1;
                --ok: #4ADE80;
                --overlay: rgba(0, 0, 0, 0.75);
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --primary: #FF6B7A;
            --primary-strong: #FF8A96;
            --primary-soft: rgba(255, 107, 122, 0.14);
            --bg: #0E0E10;
            --surface: #1A1A1F;
            --surface-2: #222226;
            --text: #F2F2F4;
            --muted: #B4B4BC;
            --border: #34343A;
            --line: #2E2E35;
            --tile-night: #2B2B33;
            --free-bg: #12301E;
            --free-ink: #7EDB9C;
            --tbc-bg: #1F1F25;
            --tbc-ink: #C9C9D1;
            --ok: #4ADE80;
            --overlay: rgba(0, 0, 0, 0.75);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-size: 16px;
            line-height: 1.45;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body.no-scroll { overflow: hidden; }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }
        a { color: inherit; }
        [hidden] { display: none !important; }

        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        .icon {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-icon] { display: inline-flex; }
        /* The account icon is filled in by script (icon or profile picture), so it needs the same box as the other icons to line up. */
        #accountIcon, #tabAccountIcon { display: inline-flex; }

        /* Header */
        /* Samakaka: the diamond pattern of Angolan printed cloth, in the flag's red and yellow. */
        .samakaka {
            background:
                linear-gradient(135deg, var(--accent) 25%, transparent 25%) -10px 0 / 20px 20px,
                linear-gradient(225deg, var(--accent) 25%, transparent 25%) -10px 0 / 20px 20px,
                linear-gradient(315deg, var(--accent) 25%, transparent 25%) 0 0 / 20px 20px,
                linear-gradient(45deg, var(--accent) 25%, transparent 25%) 0 0 / 20px 20px,
                var(--primary-fill);
        }
        .samakaka-strip { height: 12px; }

        .topbar { background: var(--bg); border-bottom: 1px solid var(--line); }
        .topbar-inner { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; padding: 10px 16px; }
        .top-nav { display: flex; flex-wrap: wrap; gap: 0 20px; }
        .top-nav button { min-height: 44px; padding: 0 2px; background: none; border: none; font-size: 15px; font-weight: 600; color: var(--text); }
        .top-nav button:hover { color: var(--primary); }
        .topbar-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }

        .top-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .top-btn:hover { border-color: var(--primary); }
        .lang-wrap { position: relative; }
        .lang-menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 60; min-width: 180px; padding: 6px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); display: grid; gap: 2px; }
        .lang-menu[hidden] { display: none; }
        .lang-menu button { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: none; color: var(--text); font-size: 15px; font-weight: 600; text-align: left; }
        .lang-menu button b { min-width: 24px; font-size: 13px; color: var(--muted); }
        .lang-menu button:hover, .lang-menu button:focus-visible { background: var(--primary-soft); }
        .lang-menu button.active { color: var(--primary); }
        .lang-menu button.active b { color: var(--primary); }
        .top-btn.solid { background: var(--primary-fill); border-color: var(--primary-fill); color: #fff; }
        .top-btn.solid:hover { background: var(--primary-fill-strong); }

        .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .brand-logo { width: 54px; height: 26px; display: block; }
        .brand-logo .wave-red { stroke: var(--primary); }
        .brand-logo .wave-yellow { stroke: var(--accent); }
        .brand-logo .dot { fill: var(--text); }

        .brand-name { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; color: var(--primary); }

        /* Hero and search */
        .hero { background: var(--bg); padding: 32px 0 4px; }
        .hero-grid { display: flex; flex-wrap: wrap; align-items: center; gap: 28px 44px; }
        .hero-main { flex: 3 1 460px; min-width: 0; }
        .hero h1 { font-size: 46px; line-height: 1.06; font-weight: 800; letter-spacing: -0.03em; }
        .hero-sub { color: var(--muted); font-size: 18px; margin: 12px 0 0; max-width: 540px; }
        .hero-photo { flex: 2 1 340px; max-width: 480px; margin: 0; position: relative; }
        .hero-photo .samakaka { position: absolute; right: -12px; bottom: 14px; width: 60%; height: 60%; border-radius: 24px; }
        .hero-photo img { position: relative; display: block; width: 100%; height: 360px; object-fit: cover; border-radius: 24px; background: var(--surface-2); }
        .hero-photo figcaption { position: relative; margin-top: 18px; font-size: 12px; color: var(--muted); }
        .hero-photo figcaption a { color: inherit; }

        .search-card {
            display: grid;
            grid-template-columns: 1.4fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin: 22px 0 0;
            padding: 14px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 18px;
        }

        .search-field { display: grid; gap: 6px; }
        .field-label { font-size: 15px; font-weight: 700; }
        .input-wrap { position: relative; display: block; }
        .input-wrap [data-icon] { position: absolute; left: 14px; top: 0; bottom: 0; align-items: center; color: var(--muted); pointer-events: none; }
        .input-wrap .field { padding-left: 44px; }

        .field {
            display: block;
            width: 100%;
            min-height: 50px;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            font-size: 16px;
        }

        .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

        .submit-btn {
            min-height: 50px;
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: var(--primary-fill);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .submit-btn:hover { background: var(--primary-fill-strong); }
        .submit-btn.secondary { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--border); }

        .chips { display: flex; gap: 8px; margin: 14px 0 0; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        .chips::-webkit-scrollbar { display: none; }

        .chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
        }

        .chip .icon { width: 18px; height: 18px; color: var(--primary); }
        .chip.active .icon { color: #fff; }
        .chip:hover { border-color: var(--primary); }
        .chip.active { background: var(--primary-fill); border-color: var(--primary-fill); color: #fff; }

        .notice { font-size: 15px; color: var(--primary); font-weight: 600; margin: 10px 0 0; }
        .notice:empty { display: none; }

        /* Banners */
        .banner {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--primary);
            background: var(--primary-soft);
            font-size: 15px;
        }

        .banner p { flex: 1 1 240px; }
        .banner-actions { display: flex; gap: 8px; }

        /* Main category tiles */
        .feature-tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
        .ftile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            min-height: 104px;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 20px;
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            text-align: left;
        }
        .ftile .icon { width: 26px; height: 26px; }
        .ftile:hover { filter: brightness(1.1); }
        .ftile.beach { background: #1D4E89; }
        .ftile.nature { background: #1E6B3A; }
        .ftile.culture { background: var(--accent); color: var(--accent-ink); }
        .ftile.food { background: var(--primary-fill); }
        .ftile.night { background: var(--tile-night); }
        .ftile.agenda { background: var(--bg); color: var(--text); border-color: var(--text); }

        /* Home sections */
        main { padding-bottom: 56px; }
        .home-section { margin-top: 36px; }
        .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .section-head h2 { font-size: 22px; line-height: 1.25; font-weight: 800; }
        .section-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }

        .link-btn {
            flex: none;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            min-height: 44px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .card-row {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(270px, 300px);
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 12px 2px 6px;
            scrollbar-width: thin;
        }

        .card-row > * { scroll-snap-align: start; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 12px; }

        .prompt-card {
            margin-top: 12px;
            padding: 18px;
            border-radius: 16px;
            border: 1.5px dashed var(--border);
            background: var(--surface);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .prompt-card p { flex: 1 1 260px; }
        .prompt-card .hint { margin-top: 4px; }

        .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            min-height: 96px;
            padding: 14px;
            text-align: left;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
        }

        .tile:hover { border-color: var(--primary); }
        .tile .icon { width: 26px; height: 26px; color: var(--primary); }
        .tile-label { font-size: 17px; font-weight: 700; }
        .tile-count { font-size: 14px; color: var(--muted); }

        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }

        .collection {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 150px;
            padding: 14px;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            text-align: left;
            color: #fff;
            background: linear-gradient(135deg, var(--primary-fill) 0%, var(--primary-fill-strong) 100%);
        }

        .collection img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .collection::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.75) 100%); }
        .collection > span { position: relative; z-index: 1; }
        .collection-title { font-size: 19px; font-weight: 800; line-height: 1.2; }
        .collection-desc { font-size: 14px; opacity: 0.95; margin-top: 4px; }

        /* Place cards */
        .card { position: relative; display: flex; flex-direction: column; }

        .card-media {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 170px;
            padding: 0;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-fill) 0%, var(--primary-fill-strong) 100%);
            color: #fff;
            font-size: 30px;
            font-weight: 800;
        }

        .card-media img, .modal-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .saved-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .saved-tag .icon { width: 14px; height: 14px; fill: currentColor; }

        .card-body { display: flex; flex-direction: column; gap: 6px; padding: 10px 2px 4px; flex: 1; }
        .card-type { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.04em; }
        .card-type .icon { width: 14px; height: 14px; }
        .card-name { font-size: 18px; font-weight: 800; line-height: 1.2; }
        .price-pill { display: inline-block; padding: 3px 10px; border-radius: 10px; background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 700; }
        .price-pill.free { background: var(--free-bg); color: var(--free-ink); }
        .price-pill.tbc { background: var(--tbc-bg); color: var(--tbc-ink); }
        .fx { font-weight: 700; color: var(--text); }
        .card-name button { background: none; border: none; padding: 0; text-align: left; font-weight: inherit; }
        .card-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 14px; color: var(--muted); }
        .card-facts strong { color: var(--text); }
        .card-highlight { font-size: 15px; }
        .card-reason { font-size: 15px; }
        .card-reason b { color: var(--primary); }
        .card-verified { font-size: 13px; color: var(--muted); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 6px; }
        .card-actions .action-btn { font-size: 14px; padding: 0 8px; white-space: nowrap; }
        .card-actions .action-btn:only-child { grid-column: 1 / -1; }
        .price-note { display: inline-block; margin-top: 4px; font-size: 14px; color: var(--muted); }

        .rating {
            display: inline-block;
            background: var(--accent);
            color: var(--accent-ink);
            padding: 1px 8px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 800;
        }

        .status-open { color: var(--ok); font-weight: 700; }
        .status-closed { color: var(--primary); font-weight: 700; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .action-btn:hover { background: var(--primary-soft); }
        .action-btn.solid { background: var(--primary-fill); color: #fff; }
        .action-btn.solid:hover { background: var(--primary-fill-strong); }
        .action-btn.wide { grid-column: 1 / -1; min-height: 56px; font-size: 17px; }
        .action-btn.saved .icon { fill: currentColor; }

        /* Results */
        .results-head { margin-top: 22px; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--primary); font-weight: 700; font-size: 16px; min-height: 44px; padding: 0; }
        .results-head h2 { font-size: 26px; line-height: 1.2; font-weight: 800; }
        .results-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
        .results-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .results-tools .field { width: auto; min-width: 220px; }
        .results-count { font-size: 15px; color: var(--muted); }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 16px;
            padding: 40px 16px;
            border: 1.5px dashed var(--border);
            border-radius: 16px;
        }

        .hint { font-size: 14px; color: var(--muted); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; z-index: 100; padding: 16px; background: var(--overlay); align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-panel { position: relative; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 18px; }
        .profile-panel { max-width: 440px; padding: 28px 22px 22px; }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--text);
            font-size: 26px;
            line-height: 1;
            box-shadow: var(--shadow);
        }

        .modal-hero {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 240px;
            background: linear-gradient(135deg, var(--primary-fill) 0%, var(--primary-fill-strong) 100%);
            color: #fff;
            font-size: 52px;
            font-weight: 800;
        }

        .route-name:hover { color: var(--primary); }
        .route-where { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .route-why { font-size: 14px; margin-top: 2px; }
        .route-note { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
        .sos-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
        .sos-call { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 14px; background: var(--primary-fill); color: #fff; text-decoration: none; }
        .sos-call b { font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: 0.02em; }
        .sos-call span { font-size: 14px; font-weight: 700; }
        .sos-call:hover { background: var(--primary-fill-strong); }
        .events-filters { display: grid; gap: 14px; margin-top: 18px; padding: 16px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface); }
        .events-filters .field { max-width: 320px; margin-top: 6px; }
        .events-filters .chips { margin: 8px 0 0; max-width: none; flex-wrap: wrap; overflow: visible; }
        .chip-count { font-weight: 600; opacity: 0.85; }
        .events-count { margin-top: 18px; font-size: 15px; font-weight: 700; color: var(--muted); }
        .event-month { margin-top: 18px; }
        .event-month h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .event-list { display: grid; gap: 12px; }
        .event-card { display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding: 14px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); scroll-margin-top: 16px; }
        .event-photo { grid-column: 1 / -1; margin: -14px -14px 0; }
        .event-photo img { display: block; width: 100%; aspect-ratio: 16 / 7; object-fit: cover; border-radius: 15px 15px 0 0; background: var(--surface-2); }
        .event-photo figcaption { padding: 6px 14px 0; font-size: 12px; color: var(--muted); }
        .event-card.highlight { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        .date-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: fit-content;
            padding: 6px 2px;
            border: 5px solid transparent;
            border-radius: 14px;
            background:
                linear-gradient(var(--primary-fill), var(--primary-fill)) padding-box,
                linear-gradient(135deg, var(--accent) 25%, transparent 25%) -6px 0 / 12px 12px border-box,
                linear-gradient(225deg, var(--accent) 25%, transparent 25%) -6px 0 / 12px 12px border-box,
                linear-gradient(315deg, var(--accent) 25%, transparent 25%) 0 0 / 12px 12px border-box,
                linear-gradient(45deg, var(--accent) 25%, transparent 25%) 0 0 / 12px 12px border-box,
                linear-gradient(var(--primary-fill), var(--primary-fill)) border-box;
            color: #fff;
            text-align: center;
            line-height: 1.1;
        }
        .db-month { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
        .db-day { font-size: 30px; font-weight: 800; }
        .db-to { font-size: 12px; font-weight: 700; margin-top: 2px; }
        .event-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .event-title { font-size: 19px; font-weight: 800; line-height: 1.25; }
        .event-title:focus { outline: none; }
        .event-badges { display: flex; flex-wrap: wrap; gap: 6px; }
        .event-badges:empty { display: none; }
        .event-badge { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--surface-2); }
        .event-badge.live { background: var(--accent); color: var(--accent-ink); }
        .event-badge.tbc { color: var(--primary); border: 1px solid var(--primary); }
        .event-meta { display: grid; gap: 4px; list-style: none; font-size: 15px; }
        .event-meta li { display: flex; gap: 8px; align-items: flex-start; }
        .event-meta .icon { width: 18px; height: 18px; margin-top: 2px; color: var(--muted); }
        .event-tags { font-size: 14px; color: var(--muted); }
        .event-details summary { display: flex; align-items: center; min-height: 44px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .event-details p, .event-details ul { font-size: 15px; margin-top: 6px; }
        .event-details ul { padding-left: 20px; }
        .event-source { color: var(--muted); }
        .event-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 4px; }
        .event-actions .action-btn { min-height: 44px; padding: 0 10px; font-size: 14px; white-space: nowrap; }
        .events-note { margin-top: 18px; }
        .event-mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
        .event-mini { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-align: left; }
        .event-mini:hover { border-color: var(--primary); }
        .event-mini .db-day { font-size: 24px; }
        .event-mini-title { display: block; margin-top: 2px; font-size: 17px; font-weight: 800; line-height: 1.25; }
        .event-mini-meta { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }

        @media (max-width: 720px) {
            .rec-title { font-size: 27px; }
            .guide-jump { flex-wrap: nowrap; overflow-x: auto; }
            .sos-grid { grid-template-columns: 1fr; }
            .sos-call { flex-direction: row; align-items: center; gap: 14px; }
            .sos-call b { font-size: 28px; min-width: 64px; }
            .guide-card { padding: 16px; }
            .rec-grid, .social-row.other-row { grid-template-columns: 1fr; }
            .social-row { grid-template-columns: 1fr 50px; }
            .social-row select { grid-column: 1 / -1; }
            .event-card { grid-template-columns: 62px 1fr; gap: 10px; padding: 12px; }
            .event-photo { margin: -12px -12px 0; }
            .event-card .db-day { font-size: 24px; }
        }

        @media (min-width: 721px) {
            .row-nav {
                position: absolute;
                top: 70px;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 1.5px solid var(--border);
                background: var(--surface);
                color: var(--primary);
                box-shadow: var(--shadow);
            }
            .row-nav.prev { left: -16px; }
            .row-nav.next { right: -16px; }
            .row-nav:disabled { opacity: 0; pointer-events: none; }
        }

        /* Phone tab bar: the app's main sections, always one tap away. */
        .tabbar { display: none; }

        @media (max-width: 900px) {
            .hero-photo { display: none; }
            .feature-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (min-width: 721px) {
            .samakaka-strip { height: 16px; }
        }

        @media (max-width: 720px) {
            .top-nav, .desktop-only, #themeLabel { display: none !important; }
            .topbar-inner { padding: 8px 16px; column-gap: 12px; }
            .topbar-actions { gap: 6px; }
            .top-btn { padding: 0 11px; }
            .hero { padding: 14px 0 0; }
            .hero-sub { display: none; }
            .search-card { grid-template-columns: 1fr; margin-top: 14px; }
            .hero h1 { font-size: 28px; line-height: 1.12; }
            .brand-name { font-size: 22px; }
            .brand-logo { width: 46px; height: 22px; }
            .feature-tiles { gap: 8px; margin-top: 18px; }
            .ftile { min-height: 78px; padding: 10px; border-radius: 16px; font-size: 13px; letter-spacing: -0.01em; }
            .ftile .icon { width: 22px; height: 22px; }
            .home-section { margin-top: 28px; }
            .tabbar {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 60;
                display: flex;
                padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
                background: var(--surface);
                border-top: 1px solid var(--line);
            }
            .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; padding: 4px 0; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 700; }
            .tab .icon, .tab .avatar { width: 24px; height: 24px; }
            .tab.active { color: var(--primary); }
            body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
            .modal { padding: 0; align-items: flex-end; }
            .modal-panel { max-height: 94vh; border-radius: 18px 18px 0 0; }
            .modal-hero { height: 200px; }
            .fact { grid-template-columns: 1fr; gap: 2px; }
            .results-tools .field { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="samakaka samakaka-strip" aria-hidden="true"></div>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="./" id="brandLink" aria-label="Tuende">
                <svg class="brand-logo" viewBox="20 45 160 75" aria-hidden="true">
                    <path class="wave-red" d="M 30 90 Q 40 80 50 90 T 70 90 T 90 90 T 110 90 T 130 90 T 150 90 T 170 90" stroke-width="5" stroke-linecap="round" fill="none"/>
                    <path class="wave-yellow" d="M 30 110 Q 40 100 50 110 T 70 110 T 90 110 T 110 110 T 130 110 T 150 110 T 170 110" stroke-width="5" stroke-linecap="round" fill="none"/>
                    <circle class="dot" cx="100" cy="60" r="8"/>
                </svg>
                <span class="brand-name">Tuende</span>
            </a>
            <nav class="top-nav" data-i18n-aria="navMain">
                <button type="button" data-action="home" data-i18n="navExplore"></button>
                <button type="button" data-action="events" data-i18n="agenda"></button>
                <button type="button" data-action="guide" data-i18n="guideNav"></button>
                <button type="button" data-action="routes" data-i18n="routesNav"></button>
                <button type="button" data-action="map" data-i18n="mapNav"></button>
                <button type="button" id="navRecommend" data-action="recommend" hidden data-i18n="recTitle"></button>
            </nav>
            <div class="topbar-actions">
                <div class="lang-wrap">
                    <button class="top-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu"><span data-icon="globe"></span><span id="langLabel">PT</span></button>
                    <div class="lang-menu" id="langMenu" hidden></div>
                </div>
                <button class="top-btn" id="installTopBtn" type="button" data-info="install" data-i18n-aria="installTitle" hidden><span data-icon="download"></span><span class="desktop-only" data-i18n="installTitle"></span></button>
                <button class="top-btn" id="themeBtn" type="button"><span id="themeIcon"></span><span id="themeLabel"></span></button>
                <button class="top-btn desktop-only" id="accountBtn" type="button" hidden><span id="accountIcon"></span><span id="accountLabel"></span></button>
                <button class="top-btn solid desktop-only" id="savedBtn" type="button"><span data-icon="heart"></span><span data-i18n="savedBtn"></span><span class="count-pill" id="savedCount" hidden>0</span></button>
            </div>
        </div>
    </header>

    <section class="hero" id="hero">
        <div class="container hero-grid">
            <div class="hero-main">
            <h1 data-i18n="heroTitle"></h1>
            <p class="hero-sub" data-i18n="heroSub"></p>
            <form class="search-card" id="searchForm" role="search">
                <label class="search-field">
                    <span class="field-label" data-i18n="whatLabel"></span>
                    <span class="input-wrap"><span data-icon="search"></span><input class="field" id="qInput" type="search" autocomplete="off" data-i18n-placeholder="whatPlaceholder"></span>
                </label>
                <label class="search-field">
                    <span class="field-label" data-i18n="whereLabel"></span>
                    <select class="field" id="whereSelect"></select>
                </label>
                <button class="submit-btn" type="submit" data-i18n="explore"></button>
            </form>
            <div class="chips" id="quickFilters" role="group"></div>
            <div class="notice" id="notice" role="status" aria-live="polite"></div>
            </div>
            <figure class="hero-photo" id="heroPhoto" hidden>
                <div class="samakaka" aria-hidden="true"></div>
                <img id="heroPhotoImg" alt="" width="520" height="360">
                <figcaption id="heroPhotoCredit"></figcaption>
            </figure>
        </div>
    </section>

    <main class="container">
        <div class="banner" id="offlineBanner" hidden><p data-i18n="offline"></p></div>
        <div class="banner" id="installBanner" hidden></div>
        <div id="homeView"></div>
        <section id="resultsView" hidden aria-labelledby="resultsTitle">
            <div class="results-head">
                <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
                <h2 id="resultsTitle"></h2>
                <p class="results-sub" id="resultsSub"></p>
                <div class="results-tools" id="resultsTools">
                    <span class="results-count" id="resultsCount" aria-live="polite"></span>
                    <select class="field" id="sortSelect" data-i18n-aria="sortLabel"></select>
                </div>
            </div>
            <div class="card-grid" id="resultsList"></div>
        </section>

        <section id="recommendView" class="rec-page" hidden aria-labelledby="recTitle">
            <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
            <h1 class="rec-title" id="recTitle" data-i18n="recTitle"></h1>
            <p class="rec-intro" data-i18n="recIntro"></p>
            <p class="hint" data-i18n="recOwnerNote"></p>
            <div class="banner" id="recUnavailable" hidden><p data-i18n="recUnavailable"></p></div>
            <form class="rec-form" id="recForm" novalidate>
                <fieldset class="rec-group">
                    <legend data-i18n="recAboutPlace"></legend>
                    <div class="rec-grid">
                        <div class="form-group"><label for="recName"><span data-i18n="recName"></span> *</label><input class="field" id="recName" type="text" maxlength="120"></div>
                        <div class="form-group"><label for="recCategory"><span data-i18n="recCategory"></span> *</label><select class="field" id="recCategory"></select></div>
                        <div class="form-group"><label for="recCity"><span data-i18n="recCity"></span> *</label><select class="field" id="recCity"></select></div>
                        <div class="form-group" id="recCityOtherGroup" hidden><label for="recCityOther" data-i18n="recCityOtherLabel"></label><input class="field" id="recCityOther" type="text" maxlength="80"></div>
                        <div class="form-group rec-wide"><label for="recAddress" data-i18n="recAddress"></label><input class="field" id="recAddress" type="text" maxlength="200"></div>
                    </div>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recContacts"></legend>
                    <div class="rec-grid">
                        <div class="form-group"><label for="recPhone" data-i18n="recPhone"></label><input class="field" id="recPhone" type="tel" maxlength="40" autocomplete="off"></div>
                        <div class="form-group"><label for="recEmail" data-i18n="recEmail"></label><input class="field" id="recEmail" type="email" maxlength="120" autocomplete="off"></div>
                        <div class="form-group"><label for="recWebsite" data-i18n="recWebsite"></label><input class="field" id="recWebsite" type="url" inputmode="url" maxlength="300" placeholder="https://"></div>
                        <div class="form-group"><label for="recPress" data-i18n="recPress"></label><input class="field" id="recPress" type="url" inputmode="url" maxlength="300" placeholder="https://"><span class="hint" data-i18n="recPressHint"></span></div>
                    </div>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recSocial"></legend>
                    <div id="recSocialRows"></div>
                    <button class="link-btn" type="button" id="recSocialAdd"><span data-icon="plus"></span><span data-i18n="recSocialAdd"></span></button>
                    <p class="field-label rec-sub" data-i18n="recOtherLink"></p>
                    <div class="social-row other-row">
                        <input class="field" id="recOtherName" type="text" maxlength="60" data-i18n-placeholder="recOtherName" data-i18n-aria="recOtherName">
                        <input class="field" id="recOtherUrl" type="url" inputmode="url" maxlength="300" placeholder="https://" data-i18n-aria="recOtherUrl">
                    </div>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recPhotos"></legend>
                    <p class="hint rec-photos-hint" data-i18n="recPhotosHint"></p>
                    <div id="recPhotoUpload">
                        <label class="photo-picker" id="recPhotoPicker">
                            <span data-icon="camera"></span><span data-i18n="recPhotosAdd"></span>
                            <input id="recPhotoInput" type="file" accept="image/*" multiple>
                        </label>
                        <span class="hint rec-photo-count" id="recPhotoCount" aria-live="polite"></span>
                        <div class="rec-photos" id="recPhotoList"></div>
                        <div class="form-msg" id="recPhotoMsg" role="status" aria-live="polite"></div>
                        <label class="consent" id="recPhotoRightsLabel" hidden><input type="checkbox" id="recPhotoRights"><span data-i18n="recPhotoRights"></span></label>
                    </div>
                    <p class="hint" id="recPhotosEmail" hidden data-i18n="recPhotosEmail"></p>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recAboutYou"></legend>
                    <div class="form-group"><label for="recReason" data-i18n="recReason"></label><textarea class="field" id="recReason" maxlength="500" data-i18n-placeholder="recReasonPlaceholder"></textarea></div>
                    <div class="media-kind rec-relation" role="radiogroup">
                        <label><input type="radio" name="recRelation" value="visitor" checked><span data-i18n="recRelVisitor"></span></label>
                        <label><input type="radio" name="recRelation" value="owner"><span data-i18n="recRelOwner"></span></label>
                    </div>
                    <div class="form-group"><label for="recContact" data-i18n="recContact"></label><input class="field" id="recContact" type="text" maxlength="120" autocomplete="email"></div>
                    <label class="consent"><input type="checkbox" id="recConsent"><span data-i18n="recConsent"></span></label>
                </fieldset>
                <div class="form-msg" id="recMsg" role="alert"></div>
                <button class="submit-btn" type="submit" id="recSubmit" data-i18n="recSubmit"></button>
            </form>
            <div class="rec-success" id="recSuccess" hidden>

                <div class="banner-actions">

                    <button class="submit-btn secondary" type="button" data-action="home" data-i18n="backHome"></button>

            <p class="rec-intro" data-i18n="eventsIntro"></p>
            <div class="events-filters">
                <div>
                    <span class="field-label" id="eventsWhenLabel" data-i18n="eventsWhen"></span>
                    <div class="chips" id="eventsWhen" role="group" aria-labelledby="eventsWhenLabel"></div>
                </div>

                    <span class="field-label" id="eventsTypeLabel" data-i18n="eventsType"></span>

                </div>

        <section id="guideView" class="guide-page" hidden aria-labelledby="guideTitle">
            <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
            <h1 class="rec-title" id="guideTitle" data-i18n="guideTitle"></h1>
            <p class="rec-intro" data-i18n="guideIntro"></p>
            <p class="hint" id="guideChecked"></p>
            <div id="guideBody"></div>
        </section>

        <section id="mapView" class="map-page" hidden aria-labelledby="mapTitle">
            <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
            <h1 class="rec-title" id="mapTitle" data-i18n="mapTitle"></h1>
            <p class="rec-intro" id="mapIntro"></p>
            <div class="chips map-filter" id="mapFilter" role="group" data-i18n-aria="mapFilter"></div>
            <div class="map-box" id="mapBox"><p class="hint" id="mapStatus" data-i18n="loading"></p></div>
            <p class="hint events-note" data-i18n="mapNote"></p>
        </section>

        <section id="routesView" class="guide-page" hidden aria-labelledby="routesTitle">
            <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
            <h1 class="rec-title" id="routesTitle" data-i18n="routesTitle"></h1>
            <p class="rec-intro" data-i18n="routesIntro"></p>
            <div id="routesBody"></div>

        <section id="wondersView" class="guide-page" hidden aria-labelledby="wondersTitle">
            <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
            <h1 class="rec-title" id="wondersTitle" data-i18n="wondersTitle"></h1>
            <p class="rec-intro" data-i18n="wondersIntro"></p>
            <p class="hint" id="wondersChecked"></p>
            <div id="wondersBody"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <nav class="footer-links" aria-label="Tuende">
                <button type="button" class="footer-link" id="footerInstall" data-info="install" hidden data-i18n="installTitle"></button>
                <button type="button" class="footer-link" data-action="events" data-i18n="agenda"></button>
                <button type="button" class="footer-link" data-action="guide" data-i18n="guideTitle"></button>
                <button type="button" class="footer-link" data-action="routes" data-i18n="routesTitle"></button>
                <button type="button" class="footer-link" data-action="wonders" data-i18n="wondersTitle"></button>
                <button type="button" class="footer-link" data-action="map" data-i18n="mapTitle"></button>

            {"id": 63, "type": "culture", "name": "Igreja de Nossa Senhora do Carmo", "location": "Luanda - Mutamba", "lat": -8.81613, "lng": 13.23293, "exact": true, "description": "Igreja e convento erguidos por frades carmelitas no século XVII; a igreja ficou pronta em 1689. É considerada o monumento mais importante da arquitetura religiosa em Angola, com azulejos de Lisboa, altares de talha dourada e tetos pintados. O convento está em grande parte em ruína.", "photos": [{"url": "photos/igreja-do-carmo-luanda-960.jpg", "thumb": "photos/igreja-do-carmo-luanda-330.jpg", "author": "Fabio Vanin", "license": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:Igreja_do_Carmo_Luanda.jpg"}], "phone": "", "highlight": {"pt": "Barroco do século XVII: azulejos, talha dourada e tetos pintados.", "en": "17th-century Baroque: tiles, gilded woodwork and painted ceilings.", "fr": "Baroque du XVIIe siècle : azulejos, boiseries dorées et plafonds peints.", "es": "Barroco del siglo XVII: azulejos, tallas doradas y techos pintados."}, "family": true, "verified": {"date": "2026-10-10", "sources": [{"label": "Ver Angola", "url": "https://www.verangola.net/va/pt/022021/sugestoes/24126/Igreja-de-Nossa-Senhora-do-Carmo-O-que-fazer.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Igreja_e_Convento_de_Nossa_Senhora_do_Carmo_(Luanda)"}, {"label": "OpenStreetMap", "url": "https://www.openstreetmap.org/relation/2641670"}]}},

            {"id": 70, "type": "culture", "name": "Santuário da Muxima", "location": "Icolo e Bengo - Muxima", "lat": -9.5186, "lng": 13.9569, "exact": false, "description": "A Igreja de Nossa Senhora da Conceição da Muxima, do século XVI, na margem do rio Kwanza, a cerca de 130 km de Luanda. É o maior santuário mariano da África subsariana e monumento nacional desde 1924. A peregrinação anual costuma ser nas duas primeiras semanas de setembro; em 2024 juntou mais de 700 mil fiéis.", "photos": [{"url": "photos/muxima-pilgrimage-960.jpg", "thumb": "photos/muxima-pilgrimage-330.jpg", "author": "Paulo César Santos", "license": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Muxima_pilgrimage.JPG", "caption": {"pt": "A igreja e o rio Kwanza", "en": "The church and the Kwanza River", "fr": "L'église et le fleuve Kwanza", "es": "La iglesia y el río Kwanza"}}, {"url": "photos/church-of-muxima-pilgrimage-site-bengo-province-960.jpg", "thumb": "photos/church-of-muxima-pilgrimage-site-bengo-province-330.jpg", "author": "Paulo César Santos", "license": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Church_of_Muxima,_pilgrimage_site,_Bengo_province.JPG"}], "phone": "", "highlight": {"pt": "O maior santuário mariano da África subsariana, junto ao Kwanza.", "en": "Sub-Saharan Africa's largest Marian shrine, by the Kwanza.", "fr": "Le plus grand sanctuaire marial d'Afrique subsaharienne, au bord du Kwanza.", "es": "El mayor santuario mariano del África subsahariana, junto al Kwanza."}, "family": true, "verified": {"date": "2026-10-10", "sources": [{"label": "Ver Angola (setembro de 2024)", "url": "https://www.verangola.net/va/pt/092024/Cultura/41301/Peregrina%C3%A7%C3%A3o-ao-Santu%C3%A1rio-da-Muxima-reuniu-mais-de-700-mil-fi%C3%A9is-Bispo-do-Porto-esteve-presente.htm"}, {"label": "Ver Angola", "url": "https://www.verangola.net/va/pt/072016/sugestoes/4875/Santu%C3%A1rio-de-Nossa-Senhora-da-Muxima.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/S             {"id": 71, "type": "culture", "name": "Fortaleza de Massangano", "location": "Cuanza Norte - Massangano", "lat": -9.6294, "lng": 14.2565, "exact": true, "description": "Fortaleza de 1583 na margem do rio Cuanza, uma das mais antigas de Angola, ligada à ocupação portuguesa do interior e ao tráfico de escravos. Ainda se veem vestígios da antiga igreja. Em agosto de 2025 o Governo anunciou a sua reabilitação.", "photos": [{"url": "photos/fortaleza-de-massangano-angola-2021-04-17-960.jpg", "thumb": "photos/fortaleza-de-massangano-angola-2021-04-17-330.jpg", "author": "Angel Tostado", "license": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Fortaleza_de_Massangano,_Angola_-_2021-04-17.jpg"}], "phone": "", "highlight": {"pt": "Fortaleza de 1583 junto ao rio Cuanza.", "en": "A 1583 fortress by the Cuanza River.", "fr": "Une forteresse de 1583 au bord du fleuve Cuanza.", "es": "Una fortaleza de 1583 junto al río Cuanza."}, "family": true, "verified": {"date": "2026-10-10", "sources": [{"label": "Ver Angola", "url": "https://www.verangola.net/va/pt/072020/sugestoes/20926/Fortaleza-de-Massangano-O-que-fazer.htm"}, {"label": "Ver Angola (agosto de 2025)", "url": "https://www.verangola.net/va/pt/082025/Cultura/45628/Governo-anuncia-investimento-na-reabilita%C3%A7%C3%A3o-da-Fortaleza-de-Massangano.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Forte_de_Massangano"}]}},
            {"id": 72, "type": "nature", "name": "Parque Nacional da Cangandala", "location": "Malanje - Cangandala", "lat": -9.8, "lng": 16.75, "exact": false, "description": "O mais pequeno parque nacional de Angola, com 630 km², criado para proteger a palanca negra gigante, o símbolo do país. Em agosto de 2026 foram avistadas mais de 200 palancas negras gigantes juntas. Em 2024 o Governo anunciou que o parque ia abrir a visitantes, mas não encontrámos confirmação da abertura: confirme antes de ir.", "phone": "", "highlight": {"pt": "O parque da palanca negra gigante, símbolo de Angola.", "en": "The park of the giant sable antelope, Angola's symbol.", "fr": "Le parc de l'hippotrague noir géant, symbole de l'Angola.", "es": "El parque del antílope sable gigante, símbolo de Angola."}, "verified": {"date": "2026-10-10", "sources": [{"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Parque_Nacional_da_Cangandala"}, {"label": "Ver Angola (julho de 2024)", "url": "https://www.verangola.net/va/pt/072024/Ambiente/40959/Parque-Nacional-da-Cangandala-abre-ao-p%C3%BAblico-em-breve.htm"}, {"label": "Ver Angola (agosto de 2026)", "url": "https://www.verangola.net/va/pt/082026/Ambiente/49788/Parque-Nacional-de-Cangandala-regista-avistamento-in%C3%A9dito-de-mais-de-200-Palancas-Negras-Gigantes.htm"}]}, "hoursText": {"pt": "Visitas por confirmar.", "en": "Visits to be confirmed.", "fr": "Visites à confirmer.", "es": "Visitas por confirmar."}},
            {"id": 73, "type": "museum", "name": "Museu do Dundo", "location": "Lunda Norte - Dundo", "lat": -7.37883, "lng": 20.83478, "exact": true, "description": "O primeiro museu de Angola, fundado em 1936 pela Diamang. Guarda coleções etnográficas dos povos do leste, sobretudo cokwe (esculturas, máscaras, esteiras e cadeiras), além de arqueologia e história natural.", "phone": "", "highlight": {"pt": "O primeiro museu de Angola, com arte cokwe.", "en": "Angola's first museum, with Chokwe art.", "fr": "Le premier musée de l'Angola, avec de l'art tchokwé.", "es": "El primer museo de Angola, con arte chokwe."}, "family": true, "verified": {"date": "2026-10-10", "sources": [{"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Museu_do_Dundo"}, {"label": "Wikipedia (EN)", "url": "https://en.wikipedia.org/wiki/Dundo_Museum"}]}, "hoursText": {"pt": "Horário por confirmar.", "en": "Opening hours to be confirmed.", "fr": "Horaires à confirmer.", "es": "Horario por confirmar."}},
            {"id": 74, "type": "culture", "name": "Mbanza Kongo (centro histórico)", "location": "Zaire - Mbanza Kongo", "lat": -6.26778, "lng": 14.24806, "exact": false, "description": "Capital do antigo Reino do Kongo desde antes da chegada dos portugueses, em 1483, até 1915. O centro histórico é Património Mundial da UNESCO desde 2017.", "phone": "", "highlight": {"pt": "Capital do Reino do Kongo, Património Mundial da UNESCO.", "en": "Capital of the Kingdom of Kongo, a UNESCO World Heritage Site.", "fr": "Capitale du royaume du Kongo, patrimoine mondial de l'UNESCO.", "es": "Capital del Reino del Congo, Patrimonio Mundial de la UNESCO."}, "family": true, "verified": {"date": "2026-10-10", "sources": [{"label": "UNESCO", "url": "https://whc.unesco.org/en/list/1511/"}, {"label": "Wikipedia", "url": "https://en.wikipedia.org/wiki/M%27banza-Kongo"}]}},
            {"id": 75, "type": "museum", "name": "Museu Nacional de Arqueologia de Benguela", "location": "Benguela - Centro", "lat": -12.5778403, "lng": 13.3969773, "exact": true, "description": "Museu criado em 1976 num edifício dos séculos XVII e XVIII junto ao mar, que foi armazém de escravos antes do embarque e, mais tarde, alfândega. Tem cerca de 9150 peças, com exposições permanentes, temporárias e itinerantes. Reabriu em maio de 2023, depois de obras de reabilitação.", "photos": [{"url": "photos/2015-museu-nacional-de-arqueologia-benguela-angola-19669386368-960.jpg", "thumb": "photos/2015-museu-nacional-de-arqueologia-benguela-angola-19669386368-330.jpg", "author": "David Stanley from Nanaimo, Canada", "license": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:2015_Museu_Nacional_de_Arqueologia_Benguela_Angola_19669386368.jpg"}], "phone": "", "highlight": {"pt": "Museu num antigo armazém de escravos junto ao mar.", "en": "A museum in a former seaside slave warehouse.", "fr": "Un musée dans un ancien entrepôt d'esclaves au bord de la mer.", "es": "Un museo en un antiguo almacén de esclavos junto al mar."}, "family": true, "address": "Rua Comandante Kassangi, Bairro do Tchioge, Benguela", "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (fevereiro de 2024)", "url": "https://www.verangola.net/va/pt/022024/sugestoes/38833/Museu-Nacional-de-Arqueologia-de-Benguela-O-que-fazer.htm"}, {"label": "ANGOP (2023)", "url": "https://angop.ao/en/noticias/lazer-cultura/mais-de-cinco-mil-pessoas-visitaram-o-museu-de-arqueologia-de-benguela-em-2023/"}, {"label": "OpenStreetMap", "url": "https://www.openstreetmap.org/node/2463003365"}]}},
            {"id": 76, "type": "culture", "name": "Reduto de São Pedro de Catumbela", "location": "Benguela - Catumbela", "lat": -12.437507, "lng": 13.541999, "exact": true, "description": "Pequeno forte no alto de um morro sobre o rio Catumbela, entre o Lobito e Benguela. A primeira pedra foi lançada a 5 de outubro de 1846, como diz a inscrição sobre o portão. Foi classificado como monumento de interesse público em 1954. Em 2024 estava muito degradado e à espera de restauro: confirme o acesso antes de ir.", "photos": [{"url": "photos/2015-reduto-de-sao-pedro-de-catumbela-provincia-benguela-angola-194937-960.jpg", "thumb": "photos/2015-reduto-de-sao-pedro-de-catumbela-provincia-benguela-angola-194937-330.jpg", "author": "David Stanley from Nanaimo, Canada", "license": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:2015_Reduto_de_S%C3%A3o_Pedro_de_Catumbela_prov%C3%ADncia_Benguela_Angola_19493712300.jpg"}], "phone": "", "highlight": {"pt": "Forte de 1846 sobre o rio Catumbela.", "en": "An 1846 fort above the Catumbela River.", "fr": "Un fort de 1846 dominant le fleuve Catumbela.", "es": "Un fuerte de 1846 sobre el río Catumbela."}, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (setembro de 2024)", "url": "https://www.verangola.net/va/pt/092024/Cultura/41643/Reduto-de-S-Pedro-da-Catumbela-sem-restauro-pode-ter-a-sua-hist%C3%B3ria-apagada.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Reduto_de_S%C3%A3o_Pedro_de_Catumbela"}]}},
            {"id": 77, "type": "culture", "name": "Farol do Lobito", "location": "Benguela - Lobito", "lat": -12.32076944, "lng": 13.59571667, "exact": true, "description": "Farol de 1915 no alto das escarpas, do lado leste da entrada do porto do Lobito, em frente à ponta da Restinga. É uma torre cilíndrica branca com uma larga faixa vermelha, restaurada entre 2004 e 2007. A torre não abre ao público e o acesso, a cerca de 14 km do centro do Lobito, é melhor de 4x4: confirme antes de ir.", "photos": [{"url": "photos/lobito-lighthouse-960.jpg", "thumb": "photos/lobito-lighthouse-330.jpg", "author": "Claus Bunks from Hamburg, Germany", "license": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Lobito_Lighthouse.jpg", "focus": "50% 0%"}], "phone": "", "highlight": {"pt": "Farol de 1915 à entrada da baía do Lobito.", "en": "A 1915 lighthouse at the entrance to Lobito Bay.", "fr": "Un phare de 1915 à l'entrée de la baie de Lobito.", "es": "Un faro de 1915 a la entrada de la bahía de Lobito."}, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (dezembro de 2020)", "url": "https://www.verangola.net/va/pt/122020/sugestoes/23382/Farol-do-Lobito-O-que-fazer.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Farol_do_Lobito"}]}},
            {"id": 78, "type": "beach", "name": "Praia da Hanha", "location": "Benguela - Hanha (Lobito)", "lat": -12.226, "lng": 13.657, "exact": false, "description": "Praia na foz do rio Cubal, a poucos quilómetros do Lobito, frequentada sobretudo por pescadores e por quem vive na zona. Boa para passeios a pé pela areia.", "phone": "", "highlight": {"pt": "Praia de pescadores na foz do rio Cubal.", "en": "A fishermen's beach at the mouth of the Cubal River.", "fr": "Une plage de pêcheurs à l'embouchure de la rivière Cubal.", "es": "Una playa de pescadores en la desembocadura del río Cubal."}, "family": true, "price": {"free": true}, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (novembro de 2025)", "url": "https://www.verangola.net/va/pt/112025/sugestoes/46606/Praia-da-Hanha-O-que-fazer.htm"}]}},
            {"id": 79, "type": "beach", "name": "Praia das Miragens", "location": "Namibe - Moçâmedes", "lat": -15.1899557, "lng": 12.1493494, "exact": true, "description": "Praia junto ao centro de Moçâmedes, com uma arcada de arcos ao longo da areia que dá sombra.", "photos": [{"url": "photos/praia-das-miragens-19467932025-960.jpg", "thumb": "photos/praia-das-miragens-19467932025-330.jpg", "author": "David Stanley from Nanaimo, Canada", "license": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:Praia_das_Miragens_(19467932025).jpg"}, {"url": "photos/parabolic-shelters-18861902633-960.jpg", "thumb": "photos/parabolic-shelters-18861902633-330.jpg", "author": "David Stanley from Nanaimo, Canada", "license": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:Parabolic_Shelters_(18861902633).jpg", "caption": {"pt": "Vendedores de artesanato sob a arcada (2015)", "en": "Handicraft sellers under the arcade (2015)", "fr": "Vendeurs d'artisanat sous l'arcade (2015)", "es": "Vendedores de artesanía bajo la arcada (2015)"}}], "phone": "", "highlight": {"pt": "Praia no centro de Moçâmedes, com arcos que dão sombra.", "en": "A beach in central Moçâmedes, with arches for shade.", "fr": "Une plage au centre de Moçâmedes, avec des arches pour l'ombre.", "es": "Una playa en el centro de Moçâmedes, con arcos que dan sombra."}, "family": true, "price": {"free": true}, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (setembro de 2021)", "url": "https://www.verangola.net/va/en/092021/Suggestions/27328/Miragens-Beach-Arcade-What-to-do.htm"}, {"label": "OpenStreetMap", "url": "https://www.openstreetmap.org/relation/10559980"}]}},
            {"id": 80, "type": "nature", "name": "Lagoa dos Arcos", "location": "Namibe - Tômbwa", "lat": -15.7699886, "lng": 12.0687902, "exact": true, "description": "Três lagoas na margem norte do rio Curoca, a cerca de 20 km da costa, no deserto a sul de Moçâmedes; também se conhece como Arco do Carvalhão. Na lagoa do meio há arcos naturais de arenito. O acesso é por areia, só de 4x4. A água depende da chuva: as lagoas estiveram secas durante seis anos, até 2018.", "photos": [{"url": "photos/stone-arch-19589801062-960.jpg", "thumb": "photos/stone-arch-19589801062-330.jpg", "author": "David Stanley from Nanaimo, Canada", "license": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:Stone_Arch_(19589801062).jpg", "caption": {"pt": "Um dos arcos de pedra em 2015, quando a lagoa estava seca", "en": "One of the stone arches in 2015, when the lagoon was dry", "fr": "L'une des arches de pierre en 2015, quand la lagune était sèche", "es": "Uno de los arcos de piedra en 2015, cuando la laguna estaba seca"}}, {"url": "photos/the-lost-oasis-19595989661-960.jpg", "thumb": "photos/the-lost-oasis-19595989661-330.jpg", "author": "David Stanley from Nanaimo, Canada", "license": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:The_Lost_Oasis_(19595989661).jpg", "caption": {"pt": "As rochas à volta das lagoas (2015)", "en": "The rocks around the lagoons (2015)", "fr": "Les rochers autour des lagunes (2015)", "es": "Las rocas alrededor de las lagunas (2015)"}}], "phone": "", "highlight": {"pt": "Lagoas no deserto com arcos naturais de pedra.", "en": "Desert lagoons with natural stone arches.", "fr": "Des lagunes dans le désert avec des arches naturelles en pierre.", "es": "Lagunas en el desierto con arcos naturales de piedra."}, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (julho de 2020)", "url": "https://www.verangola.net/va/pt/072020/sugestoes/21077/Lagoa-dos-Arcos-O-que-fazer.htm"}]}},
            {"id": 81, "type": "beach", "name": "Baía de Quicombo", "location": "Cuanza Sul - Quicombo", "lat": -11.3197, "lng": 13.8203, "exact": false, "description": "Baía com praia de areia a cerca de 15 km do Sumbe, junto a uma aldeia de pescadores. Ao lado fica o Fortim do Quicombo.", "phone": "", "highlight": {"pt": "Praia de areia e aldeia de pescadores perto do Sumbe.", "en": "A sandy beach and fishing village near Sumbe.", "fr": "Une plage de sable et un village de pêcheurs près de Sumbe.", "es": "Una playa de arena y un pueblo de pescadores cerca de Sumbe."}, "family": true, "price": {"free": true}, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (março de 2025)", "url": "https://www.verangola.net/va/pt/032025/sugestoes/43712/Ba%C3%ADa-de-Quicombo-O-que-fazer.htm"}]}},
            {"id": 82, "type": "culture", "name": "Fortim do Quicombo", "location": "Cuanza Sul - Quicombo", "lat": -11.3198, "lng": 13.8202, "exact": true, "description": "Pequeno forte de 1645–1646, onde o rio Quicombo chega ao mar, ligado à ocupação holandesa e à reconquista portuguesa: foi daqui que partiu, em 1648, a armada de Salvador Correia de Sá para retomar Luanda. Serviu também de depósito e ponto de embarque de escravos. É monumento nacional desde 1924 e está na lista indicativa da UNESCO desde 1996.", "phone": "", "highlight": {"pt": "Forte do século XVII onde o rio Quicombo encontra o mar.", "en": "A 17th-century fort where the Quicombo River meets the sea.", "fr": "Un fort du XVIIe siècle là où la rivière Quicombo rejoint la mer.", "es": "Un fuerte del siglo XVII donde el río Quicombo llega al mar."}, "family": true, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (outubro de 2021)", "url": "https://www.verangola.net/va/pt/102021/sugestoes/27902/Fortim-do-Quicombo-O-que-fazer.htm"}, {"label": "Wikipedia", "url": "https://en.wikipedia.org/wiki/Fort_of_Kikombo"}]}},
            {"id": 83, "type": "nature", "name": "Lagoas do Bengo", "location": "Bengo - Dande", "lat": -8.4714533, "lng": 13.3686966, "exact": false, "description": "Dezenas de lagoas entre plantações a norte de Luanda, sobretudo a caminho do Dande. Vai-se pela estrada de Caxito até ao desvio da Barra do Dande e depois por picadas. A Lagoa do Panguila é das mais conhecidas.", "phone": "", "highlight": {"pt": "Lagoas entre plantações, a norte de Luanda.", "en": "Lagoons among farmland, north of Luanda.", "fr": "Des lagunes au milieu des cultures, au nord de Luanda.", "es": "Lagunas entre plantaciones, al norte de Luanda."}, "verified": {"date": "2026-10-11", "sources": [{"label": "Ver Angola (fevereiro de 2025)", "url": "https://www.verangola.net/va/pt/022025/sugestoes/43540/Lagoas-do-Bengo-O-que-fazer.htm"}]}},
            {"id": 84, "type": "nature", "name": "Grutas do Nzenzo", "location": "Uíge - Ambuíla", "lat": -7.4428, "lng": 14.6465, "exact": false, "description": "Grutas no meio da floresta, no município de Ambuíla, a cerca de 300 km de Luanda. Em 2014 foram eleitas uma das 7 Maravilhas Naturais de Angola. Só se visitam com autorização das autoridades tradicionais: avise primeiro a administração municipal, que pede licença na aldeia do Bombo. O acesso é difícil por causa da vegetação; vá com um guia local.", "phone": "", "highlight": {"pt": "Grutas na floresta do Uíge, uma das 7 Maravilhas Naturais.", "en": "Forest caves in Uíge, one of the 7 Natural Wonders.", "fr": "Des grottes dans la forêt de l'Uíge, l'une des 7 Merveilles naturelles.", "es": "Grutas en la selva de Uíge, una de las 7 Maravillas Naturales."}, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (janeiro de 2019)", "url": "https://www.verangola.net/va/pt/012019/sugestoes/14182/Grutas-do-Nzenzo.htm"}, {"label": "Índico, revista da LAM (junho de 2025)", "url": "https://www.indico-lam.com/en/2025/06/03/8116/"}, {"label": "Embaixada de Angola na Hungria (7 Maravilhas Naturais)", "url": "https://angolaembassy.hu/en/tourism_17"}]}},
            {"id": 85, "type": "nature", "name": "Lagoa Carumbo", "location": "Lunda Norte - Carumbo", "lat": -7.8096434, "lng": 19.9499071, "exact": true, "description": "Lagoa atravessada pelo rio Luxico, também conhecida como Nakarumbo. Em 2014 foi eleita uma das 7 Maravilhas Naturais de Angola. Há registo de 338 espécies de plantas e 195 de aves. Diz a lenda que nasceu de uma aldeia amaldiçoada por uma velha a quem recusaram abrigo. Não encontrámos informação sobre estradas nem alojamento: informe-se no Dundo antes de ir.", "phone": "", "highlight": {"pt": "Lagoa da Lunda Norte, uma das 7 Maravilhas Naturais.", "en": "A lagoon in Lunda Norte, one of the 7 Natural Wonders.", "fr": "Une lagune de la Lunda Norte, l'une des 7 Merveilles naturelles.", "es": "Una laguna de Lunda Norte, una de las 7 Maravillas Naturales."}, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (julho de 2020)", "url": "https://www.verangola.net/va/pt/072020/sugestoes/20814/Lagoa-Carumbo-O-que-fazer.htm"}, {"label": "BirdLife International", "url": "https://datazone.birdlife.org/site/factsheet/lago-carumbo-iba-angola"}, {"label": "Embaixada de Angola na Hungria (7 Maravilhas Naturais)", "url": "https://angolaembassy.hu/en/tourism_17"}, {"label": "OpenStreetMap", "url": "https://www.openstreetmap.org/way/120569239"}]}},
            {"id": 86, "type": "nature", "name": "Quedas do Rio Chiumbe", "location": "Lunda Sul - Dala", "lat": -11.0242, "lng": 20.2054, "exact": false, "description": "Quedas de água no rio Chiumbe, perto da vila de Dala, junto à ponte da estrada que liga a Lunda Sul ao Moxico. Em 2014 foram eleitas uma das 7 Maravilhas Naturais de Angola. Perto fica a barragem hidroelétrica do Chiumbe-Dala. A estrada tem troços em mau estado; o aeroporto mais perto é o de Saurimo.", "phone": "", "highlight": {"pt": "Quedas de água na Lunda Sul, uma das 7 Maravilhas Naturais.", "en": "Waterfalls in Lunda Sul, one of the 7 Natural Wonders.", "fr": "Des chutes d'eau en Lunda Sul, l'une des 7 Merveilles naturelles.", "es": "Cataratas en Lunda Sul, una de las 7 Maravillas Naturales."}, "family": true, "price": {"free": true}, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (setembro de 2020)", "url": "https://www.verangola.net/va/pt/092020/sugestoes/22051/Quedas-do-Rio-Chiumbe-O-que-fazer.htm"}, {"label": "Embaixada de Angola na Hungria (7 Maravilhas Naturais)", "url": "https://angolaembassy.hu/en/tourism_17"}, {"label": "OpenStreetMap", "url": "https://www.openstreetmap.org/way/1080570464"}]}},
            {"id": 87, "type": "nature", "name": "Quedas do Cuemba", "location": "Bié - Cuemba", "lat": -12.1578809, "lng": 18.0973841, "exact": true, "description": "Quedas de água com cerca de 15 metros no rio Cuemba, rodeadas de verde. Uma ponte de betão dá acesso ao local.", "phone": "", "highlight": {"pt": "Quedas de água rodeadas de verde, no Bié.", "en": "Waterfalls surrounded by green, in Bié.", "fr": "Des chutes d'eau entourées de verdure, dans le Bié.", "es": "Cascadas rodeadas de verde, en Bié."}, "family": true, "price": {"free": true}, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (março de 2024)", "url": "https://www.verangola.net/va/pt/032024/sugestoes/39263/Quedas-do-Cuemba-O-que-fazer.htm"}, {"label": "OpenStreetMap", "url": "https://www.openstreetmap.org/node/6743825485"}]}},
            {"id": 88, "type": "culture", "name": "Monumento à Paz", "location": "Moxico - Luena", "lat": -11.7790355, "lng": 19.9122676, "exact": false, "description": "O Luena é conhecido como a cidade da paz: foi aqui que, a 4 de abril de 2002, se assinou o Memorando de Entendimento que pôs fim à guerra civil. O Monumento à Paz foi inaugurado a 4 de abril de 2012, nos dez anos da paz. Em 2024, o governo provincial dizia que a estrutura precisava de manutenção.", "phone": "", "highlight": {"pt": "O monumento da cidade onde se assinou a paz, em 2002.", "en": "The monument in the city where peace was signed in 2002.", "fr": "Le monument de la ville où la paix a été signée en 2002.", "es": "El monumento de la ciudad donde se firmó la paz en 2002."}, "family": true, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (novembro de 2023)", "url": "https://www.verangola.net/va/pt/112023/sugestoes/37875/Luena-a-cidade-da-paz-O-que-fazer.htm"}, {"label": "ANGOP (2024)", "url": "https://angop.ao/en/noticias/sociedade/governador-quer-criacao-do-estatuto-do-monumento-a-paz"}]}},
            {"id": 89, "type": "nature", "name": "Lago Dilolo", "location": "Moxico Leste - Lago-Dilolo", "lat": -11.5167, "lng": 22.05, "exact": false, "description": "O maior lago de Angola, com cerca de 200 km² e pouca profundidade (1,5 metros em média), na bacia do Zambeze. Tem muito peixe e aves aquáticas, e fica perto do Parque Nacional da Cameia. Ainda há pouco alojamento e as estradas são difíceis, sobretudo na época das chuvas.", "phone": "", "highlight": {"pt": "O maior lago de Angola, no Moxico Leste.", "en": "Angola's biggest lake, in Moxico Leste.", "fr": "Le plus grand lac de l'Angola, dans le Moxico Leste.", "es": "El mayor lago de Angola, en Moxico Leste."}, "price": {"free": true}, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (março de 2021)", "url": "https://www.verangola.net/va/pt/032021/sugestoes/24388/Lago-Dilolo-O-que-fazer.htm"}, {"label": "Ver Angola (setembro de 2023)", "url": "https://www.verangola.net/va/pt/092023/Turismo/37277/Lago-Dilolo-maior-lago-natural-de-%C3%A1gua-doce-da-%C3%81frica-Austral-com-%E2%80%9Cpotencial-tur%C3%ADstico%E2%80%9D-espera-por-investimento.htm"}, {"label": "Wikipedia", "url": "https://pt.wikipedia.org/wiki/Lago_Dilolo"}]}},
            {"id": 90, "type": "nature", "name": "Parque Nacional da Cameia", "location": "Moxico Leste - Cameia", "lat": -11.8833, "lng": 21.6667, "exact": false, "description": "Parque nacional com 14 450 km², criado como reserva de caça em 1935 e parque nacional em 1957. Grande parte são planícies que alagam na época das chuvas, na bacia do Zambeze, e florestas de miombo. Fica a cerca de 125 km do Luena. Confirme o acesso antes de ir.", "phone": "", "highlight": {"pt": "Planícies que alagam e florestas de miombo, no leste.", "en": "Flooding plains and miombo woodland in the east.", "fr": "Plaines inondables et forêts de miombo dans l'est.", "es": "Llanuras inundables y bosques de miombo en el este."}, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (agosto de 2020)", "url": "https://www.verangola.net/va/pt/082020/sugestoes/21316/Parque-Nacional-da-Cameia-O-que-fazer.htm"}, {"label": "Wikipedia", "url": "https://en.wikipedia.org/wiki/Cameia_National_Park"}]}},
            {"id": 91, "type": "culture", "name": "Memorial do Rei Mandume", "location": "Cunene - Oihole", "lat": -17.3321112, "lng": 15.9595352, "exact": true, "description": "Memorial em Oihole, no município de Namacunde, a cerca de 45 km de Ondjiva, onde estão sepultados restos mortais de Mandume ya Ndemufayo, o último rei dos Kwanyama, que enfrentou as tropas coloniais no início do século XX. Foi inaugurado em 2002. Cada «tronco» do monumento lembra um momento da luta dos Kwanyama. O Governo do Cunene anunciou a reabilitação do complexo.", "phone": "", "highlight": {"pt": "O memorial do último rei dos Kwanyama.", "en": "The memorial to the last Kwanyama king.", "fr": "Le mémorial du dernier roi des Kwanyama.", "es": "El memorial del último rey de los kwanyama."}, "family": true, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (dezembro de 2019)", "url": "https://www.verangola.net/va/pt/122019/sugestoes/17656/Memorial-do-Rei-Mandume-O-que-fazer.htm"}, {"label": "ANGOP", "url": "https://angop.ao/en/noticias/turismo/governadora-anuncia-reabilitacao-do-complexo-turistico-de-oihole/"}, {"label": "OpenStreetMap", "url": "https://www.openstreetmap.org/way/1050666270"}]}},
            {"id": 92, "type": "nature", "name": "Parque Nacional do Luengue-Luiana", "location": "Cuando - Luiana", "lat": -16.5833, "lng": 21.8333, "exact": false, "description": "Parque nacional com 22 610 km², criado em 2011 no sudeste de Angola. Em julho de 2026 abriu o Luiana Plains Safari, o primeiro acampamento turístico do parque, nas zonas húmidas do rio Cuando, com safaris e passeios a pé e de barco.", "phone": "", "highlight": {"pt": "Parque no sudeste, com o primeiro acampamento de safari.", "en": "A south-eastern park with its first safari camp.", "fr": "Un parc du sud-est avec son premier camp de safari.", "es": "Un parque del sureste con su primer campamento de safari."}, "verified": {"date": "2026-10-12", "sources": [{"label": "Ver Angola (março de 2020)", "url": "https://www.verangola.net/va/pt/032020/sugestoes/18822/Parque-Nacional-do-Luengue-Luiana-O-que-fazer.htm"}, {"label": "Ver Angola (julho de 2026)", "url": "https://www.verangola.net/va/pt/072026/Turismo/49537/Luiana-Plains-Safari-acampamento-tur%C3%ADstico-%C3%A9-nova-aposta-do-Parque-Nacional-do-Luengue-Luiana.htm"}, {"label": "Tourism Update", "url": "https://www.tourismupdate.com/article/first-tourist-camp-in-luengue-luiana-opens"}]}},

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANGOLIVE - Descubra onde ir em Angola</title>
    <meta name="description" content="Encontre restaurantes, praias, hotéis, vida noturna e experiências em Angola, perto de si. Com preços em Kwanza e indicações para chegar.">
    <meta property="og:title" content="ANGOLIVE - Descubra onde ir em Angola">
    <meta property="og:description" content="Restaurantes, praias, cultura, natureza, vida noturna e alojamento em Angola.">
    <meta name="theme-color" content="#CE1126">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ANGOLIVE">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            --primary: #CE1126;
            --primary-strong: #A50E1F;
            --primary-soft: rgba(206, 17, 38, 0.08);
            --accent: #FFD100;
            --accent-ink: #1a1a1a;
            --bg: #F6F6F7;
            --surface: #FFFFFF;
            --surface-2: #F1F1F3;
            --text: #161618;
            --muted: #55555D;
            --border: #DADADF;
            --ok: #127A3E;
            --overlay: rgba(0, 0, 0, 0.6);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #EF4458;
                --primary-strong: #F2606F;
                --primary-soft: rgba(239, 68, 88, 0.14);
                --bg: #0E0E10;
                --surface: #18181B;
                --surface-2: #222226;
                --text: #F2F2F4;
                --muted: #B4B4BC;
                --border: #34343A;
                --ok: #4ADE80;
                --overlay: rgba(0, 0, 0, 0.75);
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --primary: #EF4458;
            --primary-strong: #F2606F;
            --primary-soft: rgba(239, 68, 88, 0.14);
            --bg: #0E0E10;
            --surface: #18181B;
            --surface-2: #222226;
            --text: #F2F2F4;
            --muted: #B4B4BC;
            --border: #34343A;
            --ok: #4ADE80;
            --overlay: rgba(0, 0, 0, 0.75);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-size: 16px;
            line-height: 1.45;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body.no-scroll { overflow: hidden; }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }
        a { color: inherit; }
        [hidden] { display: none !important; }

        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        .icon {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-icon] { display: inline-flex; }

        /* Header */
        .topbar { background: var(--surface); padding: 12px 0 4px; }
        .topbar-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }

        .top-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .top-btn:hover { background: var(--primary-soft); }
        .top-btn.solid { background: var(--primary); color: #fff; }
        .top-btn.solid:hover { background: var(--primary-strong); }

        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px auto 0; text-decoration: none; width: fit-content; }
        .brand-logo { width: 96px; height: 45px; display: block; }
        .brand-logo .wave-red { stroke: var(--primary); }
        .brand-logo .wave-yellow { stroke: var(--accent); }
        .brand-logo .dot { fill: var(--text); }

        .brand-name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, var(--primary) 0%, var(--text) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hero and search */
        .hero { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 0 16px; }
        .hero h1 { font-size: 34px; line-height: 1.15; font-weight: 800; text-align: center; }
        .hero-sub { text-align: center; color: var(--muted); font-size: 17px; margin: 8px auto 0; max-width: 560px; }

        .search-card {
            display: grid;
            grid-template-columns: 1.4fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin: 18px auto 0;
            max-width: 880px;
            padding: 14px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 16px;
        }

        .search-field { display: grid; gap: 6px; }
        .field-label { font-size: 15px; font-weight: 700; }
        .input-wrap { position: relative; display: block; }
        .input-wrap [data-icon] { position: absolute; left: 14px; top: 0; bottom: 0; align-items: center; color: var(--muted); pointer-events: none; }
        .input-wrap .field { padding-left: 44px; }

        .field {
            display: block;
            width: 100%;
            min-height: 50px;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            font-size: 16px;
        }

        .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

        .submit-btn {
            min-height: 50px;
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .submit-btn:hover { background: var(--primary-strong); }
        .submit-btn.secondary { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--border); }

        .chips { display: flex; gap: 8px; margin: 14px auto 0; max-width: 880px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        .chips::-webkit-scrollbar { display: none; }

        .chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
        }

        .chip .icon { width: 18px; height: 18px; }
        .chip:hover { background: var(--primary-soft); }
        .chip.active { background: var(--primary); color: #fff; }

        .notice { font-size: 15px; color: var(--primary); font-weight: 600; margin: 10px auto 0; max-width: 880px; }
        .notice:empty { display: none; }

        /* Banners */
        .banner {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--primary);
            background: var(--primary-soft);
            font-size: 15px;
        }

        .banner p { flex: 1 1 240px; }
        .banner-actions { display: flex; gap: 8px; }

        /* Home sections */
        main { padding-bottom: 56px; }
        .home-section { margin-top: 30px; }
        .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .section-head h2 { font-size: 22px; line-height: 1.25; font-weight: 800; }
        .section-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }

        .link-btn {
            flex: none;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            min-height: 44px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .card-row {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(270px, 300px);
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 12px 2px 6px;
            scrollbar-width: thin;
        }

        .card-row > * { scroll-snap-align: start; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 12px; }

        .prompt-card {
            margin-top: 12px;
            padding: 18px;
            border-radius: 16px;
            border: 1.5px dashed var(--border);
            background: var(--surface);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .prompt-card p { flex: 1 1 260px; }
        .prompt-card .hint { margin-top: 4px; }

        .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            min-height: 96px;
            padding: 14px;
            text-align: left;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
        }

        .tile:hover { border-color: var(--primary); }
        .tile .icon { width: 26px; height: 26px; color: var(--primary); }
        .tile-label { font-size: 17px; font-weight: 700; }
        .tile-count { font-size: 14px; color: var(--muted); }

        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }

        .collection {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 150px;
            padding: 14px;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            text-align: left;
            color: #fff;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        }

        .collection img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .collection::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.75) 100%); }
        .collection > span { position: relative; z-index: 1; }
        .collection-title { font-size: 19px; font-weight: 800; line-height: 1.2; }
        .collection-desc { font-size: 14px; opacity: 0.95; margin-top: 4px; }

        /* Place cards */
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .card-media {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px;
            padding: 0;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: #fff;
            font-size: 30px;
            font-weight: 800;
        }

        .card-media img, .modal-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .saved-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .saved-tag .icon { width: 14px; height: 14px; fill: currentColor; }

        .card-body { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; flex: 1; }
        .card-type { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--primary); }
        .card-type .icon { width: 16px; height: 16px; }
        .card-name { font-size: 19px; font-weight: 800; line-height: 1.2; }
        .card-name button { background: none; border: none; padding: 0; text-align: left; font-weight: inherit; }
        .card-facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
        .card-facts strong { color: var(--text); }
        .card-highlight { font-size: 15px; }
        .card-reason { font-size: 15px; }
        .card-reason b { color: var(--primary); }
        .card-verified { font-size: 13px; color: var(--muted); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 6px; }
        .card-actions .action-btn { font-size: 14px; padding: 0 8px; white-space: nowrap; }

        .rating {
            display: inline-block;
            background: var(--accent);
            color: var(--accent-ink);
            padding: 1px 8px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 800;
        }

        .status-open { color: var(--ok); font-weight: 700; }
        .status-closed { color: var(--primary); font-weight: 700; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .action-btn:hover { background: var(--primary-soft); }
        .action-btn.solid { background: var(--primary); color: #fff; }
        .action-btn.solid:hover { background: var(--primary-strong); }
        .action-btn.wide { grid-column: 1 / -1; min-height: 56px; font-size: 17px; }
        .action-btn.saved .icon { fill: currentColor; }

        /* Results */
        .results-head { margin-top: 22px; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--primary); font-weight: 700; font-size: 16px; min-height: 44px; padding: 0; }
        .results-head h2 { font-size: 26px; line-height: 1.2; font-weight: 800; }
        .results-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
        .results-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .results-tools .field { width: auto; min-width: 220px; }
        .results-count { font-size: 15px; color: var(--muted); }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 16px;
            padding: 40px 16px;
            border: 1.5px dashed var(--border);
            border-radius: 16px;
        }

        .hint { font-size: 14px; color: var(--muted); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; z-index: 100; padding: 16px; background: var(--overlay); align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-panel { position: relative; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 18px; }
        .profile-panel { max-width: 440px; padding: 28px 22px 22px; }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--text);
            font-size: 26px;
            line-height: 1;
            box-shadow: var(--shadow);
        }

        .modal-hero {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 240px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: #fff;
            font-size: 52px;
            font-weight: 800;
        }

        .photo-badge { position: absolute; left: 12px; bottom: 12px; z-index: 1; background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
        .photo-meta { padding: 10px 20px 0; }
        .photo-credit { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
        .photo-credit a { color: inherit; }
        .photo-strip { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
        .photo-thumb { flex: 0 0 76px; height: 56px; padding: 0; border-radius: 10px; overflow: hidden; border: 3px solid transparent; background: var(--surface-2); }
        .photo-thumb.active { border-color: var(--primary); }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
        .modal-name { font-size: 26px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
        .modal-sub { display: flex; gap: 12px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }

        .rating-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .section-title { font-size: 18px; font-weight: 800; color: var(--primary); }
        .section-content { font-size: 16px; color: var(--muted); margin-top: 6px; }

        .facts { margin-top: 10px; border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; }
        .fact { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 12px 14px; font-size: 15px; }
        .fact + .fact { border-top: 1px solid var(--border); }
        .fact dt { font-weight: 700; }
        .fact dd { color: var(--muted); overflow-wrap: anywhere; }
        .fact dd a { color: var(--primary); font-weight: 600; }
        .week { list-style: none; margin-top: 6px; }
        .week li { display: flex; justify-content: space-between; gap: 12px; }
        .week li.today { color: var(--text); font-weight: 700; }

        .map-frame { display: block; width: 100%; height: 200px; border: 0; border-radius: 12px; margin-top: 8px; background: var(--surface-2); }
        .text-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--primary); font-weight: 700; min-height: 44px; }
        .coords { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted); }

        .highlight-box { background: var(--primary-soft); border-radius: 12px; padding: 12px 14px; font-weight: 600; margin-top: 8px; }

        .social { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

        .social a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1.5px solid var(--primary);
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .social a:hover { background: var(--primary-soft); }

        .panel { background: var(--surface-2); border-radius: 14px; padding: 14px; margin-top: 10px; }

        .menu-group + .menu-group { margin-top: 16px; }
        .menu-group-title { font-size: 15px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 12px; }
        .menu-item + .menu-item { margin-top: 6px; }
        .menu-item-name { font-size: 15px; font-weight: 700; }
        .menu-item-desc { font-size: 14px; color: var(--muted); }
        .menu-item-price { font-size: 15px; font-weight: 800; color: var(--primary); white-space: nowrap; }

        .avg { text-align: center; padding: 6px 0 14px; }
        .avg-number { font-size: 34px; font-weight: 800; color: var(--primary); }
        .stars { color: #E0A800; font-size: 18px; letter-spacing: 2px; }
        .avg-count { font-size: 14px; color: var(--muted); }
        .external-reviews { margin-bottom: 14px; }

        .review-form { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; }
        .review-form-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .review-form .field { margin-bottom: 10px; }
        .star-input { display: flex; gap: 2px; margin-bottom: 8px; }
        .star-btn { width: 48px; height: 48px; background: none; border: none; font-size: 34px; line-height: 1; color: var(--muted); }
        .star-btn.on { color: #E0A800; }
        textarea.field { min-height: 96px; resize: vertical; }
        .review-form .submit-btn { width: 100%; }

        .form-msg { font-size: 15px; font-weight: 600; color: var(--primary); min-height: 22px; margin: 4px 0 8px; }
        .form-msg.ok { color: var(--ok); }

        .review { background: var(--surface); border-left: 4px solid var(--primary); border-radius: 10px; padding: 12px; margin-top: 10px; }
        .review-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
        .review-name { font-weight: 700; }
        .review-date { color: var(--muted); }
        .review-text { font-size: 15px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .report-btn { background: none; border: none; color: var(--primary); font-size: 14px; font-weight: 600; min-height: 40px; padding: 0 10px; }

        .visitor-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
        .visitor-gallery > .hint { grid-column: 1 / -1; }
        .visitor-item { margin: 0; background: var(--surface-2); border-radius: 12px; overflow: hidden; font-size: 14px; }
        .visitor-item img { width: 100%; height: 130px; object-fit: cover; display: block; }
        .visitor-item .video-link { display: flex; align-items: center; justify-content: center; gap: 8px; height: 130px; color: var(--primary); font-weight: 700; text-decoration: none; text-align: center; padding: 8px; }

            plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'
        };

        const store = {
            get(key, fallback) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw === null ? fallback : JSON.parse(raw);
                } catch {
                    return fallback;
                }
            },
            set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
            },
            remove(key) {
                try { localStorage.removeItem(key); } catch {}
            }
        };

        const PUBLIC_URL = 'https://kingic17.github.io/ANGOLIVE/angolive-complete.html';
        // Public contact address. While empty, the contact link, the privacy link and the e-mail fallback stay hidden.
        const CONTACT_EMAIL = '';
        // Visitor content (Supabase). Fill in after creating the project; see supabase/setup.sql.
        // The publishable/anon key is meant to be public: access is limited by the row-level security rules.
        const SUPABASE_URL = '';
        const SUPABASE_KEY = '';
        // The iOS app loads this page from its bundle (file://).
        const inNativeApp = location.protocol === 'file:';

        let lang = store.get('angoliveLang', null) || 'pt';
        let favorites = store.get('favorites', []);
        let installPrompt = null;
        let ratingStats = {};
        let lastFocus = null;

        const DEFAULT_FILTERS = { q: '', where: '', quick: null, category: null, collection: null, saved: false };
        const state = { view: 'home', filters: { ...DEFAULT_FILTERS }, sort: 'relevance', rating: 0, openId: null, userPos: null };

        const $ = (id) => document.getElementById(id);
        const supabaseReady = () => Boolean(SUPABASE_URL && SUPABASE_KEY);
        const reviewsEnabled = supabaseReady;
        const canSuggestFix = () => supabaseReady() || Boolean(CONTACT_EMAIL);

        function t(key, vars = {}) {
            const text = I18N[lang][key] ?? I18N.pt[key] ?? key;
            return text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
        }

        function icon(name) {
            return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        const locale = () => (lang === 'en' ? 'en-GB' : 'pt-PT');
        const cityOf = (v) => v.location.split(' - ')[0];
        const areaOf = (v) => v.location.split(' - ')[1] || '';
        const placeLine = (v) => (areaOf(v) && areaOf(v) !== cityOf(v) ? `${areaOf(v)}, ${cityOf(v)}` : cityOf(v));
        const catLabel = (type, plural) => CATEGORY[type][lang][plural ? 0 : 1];
        const descOf = (v) => (lang === 'en' ? DESC_EN[v.id] || v.description : v.description);
        const highlightOf = (v) => v.highlight?.[lang] || '';
        const placesCount = (n) => (n === 1 ? t('placesCountOne') : t('placesCount', { n }));

        function formatDate(iso) {
            return new Date(`${iso}T12:00:00Z`).toLocaleDateString(locale(), { day: 'numeric', month: 'long', year: 'numeric' });
        }

        /* ---------- Prices ---------- */

        function kz(value) {
            return (value / 1000).toLocaleString(locale(), { maximumFractionDigits: 1 });
        }

        function priceText(v) {
            const p = v.price;
            if (!p) return t('priceTBC');
            if (p.free) return t('free');
            const amount = p.to ? t('kzThousandRange', { a: kz(p.from), b: kz(p.to) }) : t('kzThousand', { a: kz(p.from) });
            const unit = { person: t('perPerson'), night: t('perNight'), entry: t('perEntry') }[p.per];
            return `${amount} ${unit}`;
        }

        function priceValue(v) {
            if (!v.price) return Infinity;
            return v.price.free ? 0 : v.price.from;
        }

        function phoneDigits(v) {
            const digits = v.phone.replace(/\D/g, '');
            return digits.length >= 9 ? digits : '';
        }

        function initials(name) {
            return name.split(/\s+/).filter((w) => /^[A-Za-zÀ-ÿ]/.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
        }

        function stars(n) {
            const full = Math.round(n);
            return '★'.repeat(full) + '☆'.repeat(5 - full);
        }

        /* ---------- Search: accent-insensitive, plural-aware, tolerant of small typos ---------- */

        // Words people use that the place texts may phrase differently.
        const SYNONYMS = {
            cascata: ['queda'], cachoeira: ['queda'], waterfall: ['queda'],
            pousada: ['hotel', 'alojamento'], hospedagem: ['hotel', 'alojamento'], hostel: ['hotel', 'alojamento'],
            boate: ['discoteca'], balada: ['discoteca'], disco: ['discoteca'],
            dinheiro: ['cambio'], money: ['cambio'], exchange: ['cambio'],
            museum: ['museu'], church: ['igreja'], igreja: ['catedral']
        };

        const STOPWORDS = new Set(['a', 'o', 'as', 'os', 'e', 'em', 'no', 'na', 'nos', 'nas', 'de', 'da', 'do', 'das', 'dos', 'para', 'com', 'um', 'uma', 'the', 'of', 'in', 'and', 'to', 'at']);

        function normalize(text) {
            return String(text).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        }

        // Portuguese plurals: hotéis→hotel, locais→local, mares→mar, praias→praia.
        function stem(word) {
            if (word.length <= 3) return word;
            if (/(oe|ae)s$/.test(word)) return `${word.slice(0, -3)}ao`;
            if (word.endsWith('ais')) return `${word.slice(0, -3)}al`;
            if (word.endsWith('eis')) return `${word.slice(0, -3)}el`;
            if (word.endsWith('ois')) return `${word.slice(0, -3)}ol`;
            if (word.endsWith('ns')) return `${word.slice(0, -2)}m`;
            if (/[rzs]es$/.test(word)) return word.slice(0, -2);
            if (word.endsWith('s')) return word.slice(0, -1);
            return word;
        }

        function tokens(text) {
            return normalize(text).split(/[^a-z0-9]+/).filter((w) => w && !STOPWORDS.has(w)).map(stem);
        }

        function withinOneEdit(a, b) {
            if (Math.abs(a.length - b.length) > 1) return false;
            let i = 0;
            let j = 0;
            let edits = 0;
            while (i < a.length && j < b.length) {
                if (a[i] === b[j]) { i++; j++; continue; }
                if (++edits > 1) return false;
                if (a.length > b.length) i++;
                else if (a.length < b.length) j++;
                else { i++; j++; }
            }
            return edits + (a.length - i) + (b.length - j) <= 1;
        }

        const tokenMatches = (word, list) => list.some((tk) => tk.startsWith(word) || (word.length >= 5 && withinOneEdit(word, tk)));

        let searchIndex = null;
        function index() {
            if (searchIndex) return searchIndex;
            const fullText = (v) => [
                v.name, v.location, v.address || '', v.description, DESC_EN[v.id] || '', v.highlight?.pt || '', v.highlight?.en || '',
                CATEGORY[v.type].keywords, CATEGORY[v.type].pt.join(' '), CATEGORY[v.type].en.join(' '),
                v.family ? 'família famílias crianças family families kids' : '',
                v.price?.free ? 'grátis gratuito gratuita entrada free' : ''
            ].join(' ');
            searchIndex = {
                all: new Map(venues.map((v) => [v.id, tokens(fullText(v))])),
                name: new Map(venues.map((v) => [v.id, tokens(v.name)])),
                category: Object.fromEntries(Object.entries(CATEGORY).map(([key, c]) => [key, tokens(`${c.keywords} ${c.pt.join(' ')} ${c.en.join(' ')}`)]))
            };
            return searchIndex;
        }

        const alternatives = (word) => [word, ...(SYNONYMS[word] || [])];

        function matchesQuery(v, q) {
            const words = tokens(q);
            return words.every((w) => alternatives(w).some((alt) => tokenMatches(alt, index().all.get(v.id))));
        }

        // Name matches rank first, then places whose category fits the words, then any other text match.
        function queryScore(v, q) {
            const words = tokens(q);
            if (!words.length) return 0;
            const hits = (list) => (w) => alternatives(w).some((alt) => tokenMatches(alt, list));
            if (words.every(hits(index().name.get(v.id)))) return 3;
            if (words.some(hits(index().category[v.type]))) return 2;
            return 1;
        }

        /* ---------- Opening hours (Angola time, UTC+1, no daylight saving) ---------- */

        const toMinutes = (hhmm) => {
            const [h, m] = hhmm.split(':').map(Number);
            return h * 60 + m;
        };

        function luandaNow() {
            const d = new Date(Date.now() + 60 * 60 * 1000);
            return { day: d.getUTCDay(), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
        }

        function weekdayName(day) {
            return new Intl.DateTimeFormat(locale(), { weekday: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(2024, 0, 7 + day)));
        }

        function openStatus(v) {
            if (!v.hours) return null;
            const { day, minutes } = luandaNow();
            for (const [o, c] of v.hours[day] || []) {
                const open = toMinutes(o);
                const close = toMinutes(c) <= open ? toMinutes(c) + 1440 : toMinutes(c);
                if (minutes >= open && minutes < close) return { open: true, until: c };
            }
            for (const [o, c] of v.hours[(day + 6) % 7] || []) {
                if (toMinutes(c) <= toMinutes(o) && minutes < toMinutes(c)) return { open: true, until: c };
            }
            for (let i = 0; i < 7; i++) {
                const d = (day + i) % 7;
                const next = (v.hours[d] || []).find(([o]) => i > 0 || toMinutes(o) > minutes);
                if (next) return { open: false, at: next[0], day: i === 0 ? null : d };
            }
            return { open: false };
        }

        function statusText(status) {
            if (!status) return '';
            if (status.open) return t('openUntil', { time: status.until });
            if (!status.at) return t('closed');
            return status.day === null ? t('closedOpensAt', { time: status.at }) : t('closedOpensDay', { day: weekdayName(status.day), time: status.at });
        }

        function statusHTML(v) {
            const status = openStatus(v);
            return status ? `<span class="${status.open ? 'status-open' : 'status-closed'}">${statusText(status)}</span>` : '';
        }

        /* ---------- Location ---------- */

        function kmBetween(a, b) {
            const rad = (d) => (d * Math.PI) / 180;
            const dLat = rad(b.lat - a.lat);
            const dLng = rad(b.lng - a.lng);
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
        }

        const distanceKm = (v) => (state.userPos ? kmBetween(state.userPos, v) : null);
        const formatKm = (km) => km.toLocaleString(locale(), { maximumFractionDigits: km < 100 ? 1 : 0 });

        function distanceText(v) {
            const km = distanceKm(v);
            return km === null ? '' : t('distance', { d: formatKm(km) });
        }

        function setNotice(text) {
            $('notice').textContent = text;
        }

        function locate() {
            if (state.userPos) return;
            if (!navigator.geolocation) { setNotice(t('locError')); return; }
            setNotice(t('locating'));
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    setNotice('');
                    render();
                    if (state.openId) openVenue(state.openId, true);
                },
                () => setNotice(t('locError')),
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
            );
        }

        /* ---------- Images ---------- */

        function thumbSrc(v) {
            return v.photos ? v.photos[0].thumb : v.image.replace('w=800&h=400', 'w=600&h=300');
        }

        const fullSrc = (photo) => photo.url.replace('/1280px-', '/960px-');

        function creditHTML(photo) {
            return `${t('photoBy')}: <a href="${escapeHTML(photo.page)}" target="_blank" rel="noopener">${escapeHTML(photo.author)}</a> · ${escapeHTML(photo.license)} · Wikimedia Commons`;
        }

        // Show the small image the card already loaded straight away, then swap in the sharper one.
        function upgradeHero(src) {
            const img = $('heroImg');
            if (!img) return;
            const sharp = new Image();
            sharp.crossOrigin = 'anonymous';
            sharp.onload = () => { if ($('heroImg') === img) img.src = src; };
            sharp.src = src;
        }

        function heroHTML(v) {
            const photos = v.photos || [];
            const hero = `
                <div class="modal-hero">
                    <span>${escapeHTML(initials(v.name))}</span>
                    <img id="heroImg" src="${escapeHTML(thumbSrc(v))}" alt="${escapeHTML(v.name)}" crossorigin="anonymous" onerror="this.remove()">
                    ${photos.length ? '' : `<span class="photo-badge">${t('illustrative')}</span>`}
                </div>`;
            if (!photos.length) return hero;
            return `${hero}
                <div class="photo-meta">
                    <p class="photo-credit" id="heroCredit">${creditHTML(photos[0])}</p>
                    ${photos.length > 1 ? `<div class="photo-strip">${photos.map((p, i) => `
                        <button type="button" class="photo-thumb${i === 0 ? ' active' : ''}" data-photo="${i}" aria-label="${t('photoN', { n: i + 1 })}">
                            <img src="${escapeHTML(p.thumb)}" alt="" crossorigin="anonymous" loading="lazy">
                        </button>`).join('')}</div>` : ''}
                </div>`;
        }

        function showPhoto(index) {
            const v = venues.find((x) => x.id === state.openId);
            const photo = v?.photos?.[index];
            if (!photo) return;
            const img = $('heroImg');
            if (img) img.src = photo.thumb;
            upgradeHero(fullSrc(photo));
            $('heroCredit').innerHTML = creditHTML(photo);
            document.querySelectorAll('.photo-thumb').forEach((b) => b.classList.toggle('active', Number(b.dataset.photo) === index));
        }

        // Without verified coordinates, let Google Maps find the place by name.
        function mapsURL(v, mode) {
            const target = v.exact ? `${v.lat},${v.lng}` : encodeURIComponent(`${v.name}, ${v.location}, Angola`);
            return mode === 'directions'
                ? `https://www.google.com/maps/dir/?api=1&destination=${target}`
                : `https://www.google.com/maps/search/?api=1&query=${target}`;
        }

        function mapEmbedURL(v) {
            const dLat = 0.006;
            const dLng = 0.01;
            return `https://www.openstreetmap.org/export/embed.html?bbox=${v.lng - dLng},${v.lat - dLat},${v.lng + dLng},${v.lat + dLat}&layer=mapnik&marker=${v.lat},${v.lng}`;
        }

        /* ---------- Ratings (only real, approved reviews) ---------- */

        const statsOf = (v) => ratingStats[v.id];
        const reviewCountText = (n) => (n === 1 ? t('reviewOne') : t('reviewMany', { n }));

        function ratingLinkHTML(stats) {
            return stats ? `<span class="rating">★ ${stats.avg.toFixed(1)}</span>${reviewCountText(stats.count)}` : t('opinionsLink');
        }

        function avgHTML(stats) {
            return `
                <div class="avg-number">${stats ? stats.avg.toFixed(1) : '—'}</div>
                ${stats ? `<div class="stars" aria-hidden="true">${stars(stats.avg)}</div>` : ''}
                <div class="avg-count">${reviewCountText(stats?.count || 0)}</div>`;
        }

        // Stats arrive after the first render; update an already open place in place.
        function refreshOpenRating() {
            const v = venues.find((x) => x.id === state.openId);
            if (!v) return;
            const link = document.querySelector('#venuePanel .rating-link');
            const avg = document.querySelector('#reviewsSection .avg');
            const note = $('ratingNote');
            if (link) link.innerHTML = ratingLinkHTML(statsOf(v));
            if (avg) avg.innerHTML = avgHTML(statsOf(v));
            if (note) note.hidden = !statsOf(v);
        }

        async function loadRatingStats() {
            if (!reviewsEnabled()) return;
            try {
                const res = await sbRequest('/rest/v1/review_stats?select=venue_id,avg_rating,review_count', { headers: sbHeaders() });
                ratingStats = Object.fromEntries((await res.json()).map((r) => [r.venue_id, { avg: Number(r.avg_rating), count: r.review_count }]));
                render();
                refreshOpenRating();
            } catch {
                ratingStats = {};
            }
        }

        /* ---------- Filters and URL ---------- */

        const slug = (text) => normalize(text).replace(/[^a-z0-9]+/g, '-');
        const hasFilters = (f) => Boolean(f.q || f.where || f.quick || f.category || f.collection || f.saved);

        function filtersToQuery(f) {
            const params = new URLSearchParams();
            if (f.q) params.set('q', f.q);
            if (f.where) params.set('where', f.where === 'near' ? 'near' : slug(f.where));
            if (f.quick) params.set('filter', f.quick);
            if (f.category) params.set('category', f.category);
            if (f.collection) params.set('collection', f.collection);
            if (f.saved) params.set('saved', '1');
            return params.toString();
        }

        function filtersFromQuery(search) {
            const params = new URLSearchParams(search);
            const where = params.get('where');
            const has = (obj, key) => Boolean(key && Object.prototype.hasOwnProperty.call(obj, key));
            return {
                q: (params.get('q') || '').slice(0, 80),
                where: where === 'near' ? 'near' : CITIES.find((c) => slug(c) === where) || '',
                quick: has(QUICK, params.get('filter')) ? params.get('filter') : null,
                category: has(CATEGORY, params.get('category')) ? params.get('category') : null,
                collection: has(COLLECTIONS, params.get('collection')) ? params.get('collection') : null,
                saved: params.get('saved') === '1'
            };
        }

        function collectionMatch(key, v) {
            const c = COLLECTIONS[key];
            return c.ids ? c.ids.includes(v.id) : c.match(v);
        }

        function filteredVenues() {
            const f = state.filters;
            const list = venues.filter((v) =>
                (!f.saved || favorites.includes(v.id)) &&
                (!f.category || v.type === f.category) &&
                (!f.collection || collectionMatch(f.collection, v)) &&
                (!f.quick || QUICK[f.quick].match(v)) &&
                (!f.where || f.where === 'near' || cityOf(v) === f.where) &&
                matchesQuery(v, f.q)
            );
            const useDistance = state.userPos && (state.sort === 'distance' || (state.sort === 'relevance' && (f.where === 'near' || f.quick === 'near')));
            const byRating = (a, b) => (statsOf(b)?.avg || 0) - (statsOf(a)?.avg || 0) || (statsOf(b)?.count || 0) - (statsOf(a)?.count || 0);
            const recRank = (v) => {
                if (f.collection && COLLECTIONS[f.collection].ids) return COLLECTIONS[f.collection].ids.indexOf(v.id);
                const i = RECOMMENDED.indexOf(v.id);
                return i === -1 ? 99 : i;
            };
            const sorters = {
                relevance: (a, b) => queryScore(b, f.q) - queryScore(a, f.q) || recRank(a) - recRank(b) || byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                rating: (a, b) => byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                price: (a, b) => priceValue(a) - priceValue(b) || a.name.localeCompare(b.name, 'pt'),
                name: (a, b) => a.name.localeCompare(b.name, 'pt'),
                distance: (a, b) => distanceKm(a) - distanceKm(b)
            };
            const key = state.sort === 'distance' || (state.sort === 'rating' && !reviewsEnabled()) ? 'relevance' : state.sort;
            return list.sort(useDistance ? sorters.distance : sorters[key]);
        }

        function syncSearchForm() {
            $('qInput').value = state.filters.q;
            $('whereSelect').value = state.filters.where;
        }

        function showResults(filters, { push = true, scroll = true } = {}) {
            state.filters = { ...DEFAULT_FILTERS, ...filters };
            state.view = 'results';
            state.sort = 'relevance';
            renderSortOptions();
            syncSearchForm();
            if (push) history.pushState(null, '', `${location.pathname}?${filtersToQuery(state.filters)}`);
            if (state.filters.where === 'near' || state.filters.quick === 'near') locate();
            render();
            if (scroll) $('resultsView').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function goHome({ push = true } = {}) {
            state.view = 'home';
            state.filters = { ...DEFAULT_FILTERS };
            syncSearchForm();
            if (push) history.pushState(null, '', location.pathname);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function applyURL() {
            const filters = filtersFromQuery(location.search);
            if (hasFilters(filters)) showResults(filters, { push: false, scroll: false });
            else if (state.view !== 'home') goHome({ push: false });
            const deepLink = location.hash.match(/^#local-(\d+)$/);
            if (deepLink) openVenue(Number(deepLink[1]));
            else if (state.openId) closeModal('venueModal', { updateURL: false });
        }

        /* ---------- Cards and rows ---------- */

        function cardHTML(v, options = {}) {
            const stats = statsOf(v);
            const dist = distanceText(v);
            const saved = favorites.includes(v.id);
            const highlight = options.reason
                ? `<p class="card-reason"><b>${t('why')}</b> ${escapeHTML(highlightOf(v))}</p>`
                : `<p class="card-highlight">${escapeHTML(highlightOf(v))}</p>`;
            return `
                <article class="card">
                    <button class="card-media" type="button" data-open="${v.id}" aria-label="${t('viewPlace')}: ${escapeHTML(v.name)}">
                        <span aria-hidden="true">${escapeHTML(initials(v.name))}</span>
                        <img src="${escapeHTML(thumbSrc(v))}" alt="" crossorigin="anonymous" loading="lazy" onerror="this.remove()">
                        ${saved ? `<span class="saved-tag">${icon('heart')}${t('saved')}</span>` : ''}
                    </button>
                    <div class="card-body">
                        <span class="card-type">${icon(CATEGORY[v.type].icon)}${catLabel(v.type, false)} · ${escapeHTML(placeLine(v))}</span>
                        <h3 class="card-name"><button type="button" data-open="${v.id}">${escapeHTML(v.name)}</button></h3>
                        <div class="card-facts">
                            ${stats ? `<span><span class="rating">★ ${stats.avg.toFixed(1)}</span> ${reviewCountText(stats.count)}</span>` : ''}
                            <span><strong>${escapeHTML(priceText(v))}</strong></span>
                            ${options.fromLuanda ? `<span>${t('fromLuanda', { d: formatKm(kmBetween(LUANDA_CENTRE, v)) })}</span>` : dist ? `<span>${dist}</span>` : ''}
                            ${statusHTML(v)}
                        </div>
                        ${highlight}
                        <div class="card-actions">
                            <button class="action-btn" type="button" data-open="${v.id}">${t('viewPlace')}</button>
                            <a class="action-btn solid" href="${mapsURL(v, 'directions')}" target="_blank" rel="noopener">${t('directions')}</a>
                        </div>
                    </div>
                </article>
            `;
        }

        function rowHTML(list, options) {
            return `
                <div class="row-wrap">
                    <button class="row-nav prev" type="button" data-scroll="-1" aria-label="${t('prevRow')}" disabled>${icon('back')}</button>
                    <div class="card-row">${list.map((v) => cardHTML(v, options)).join('')}</div>
                    <button class="row-nav next" type="button" data-scroll="1" aria-label="${t('nextRow')}">${icon('next')}</button>
                </div>`;
        }

        // Arrows and the fade only show while there is more to scroll.
        function updateRowControls(row) {
            const wrap = row.closest('.row-wrap');
            if (!wrap) return;
            const atStart = row.scrollLeft <= 4;
            const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
            wrap.querySelector('.prev').disabled = atStart;
            wrap.querySelector('.next').disabled = atEnd;
            row.classList.toggle('fade-end', !atEnd);
        }

        function sectionHTML(id, title, sub, body, more) {
            return `
                <section class="home-section" aria-labelledby="${id}">
                    <div class="section-head">
                        <h2 id="${id}">${title}</h2>
                        ${more ? `<button class="link-btn" type="button" data-more='${escapeHTML(JSON.stringify(more))}'>${t('seeAll')}</button>` : ''}
                    </div>
                    ${sub ? `<p class="section-sub">${sub}</p>` : ''}
                    ${body}
                </section>
            `;
        }

        function categoryTilesHTML() {
            return `<div class="tile-grid">${Object.entries(CATEGORY).map(([key, c]) => {
                const count = venues.filter((v) => v.type === key).length;
                return `<button class="tile" type="button" data-category="${key}">${icon(c.icon)}<span class="tile-label">${c[lang][0]}</span><span class="tile-count">${placesCount(count)}</span></button>`;
            }).join('')}</div>`;
        }

        const recommendedList = () => RECOMMENDED.map((id) => venues.find((v) => v.id === id)).filter(Boolean);

        /* ---------- Home ---------- */

        function renderHome() {
            const parts = [];
            const savedList = venues.filter((v) => favorites.includes(v.id));
            if (savedList.length) parts.push(sectionHTML('secSaved', t('savedTitle'), '', rowHTML(savedList), { saved: true }));

            parts.push(sectionHTML('secRecommended', t('recommendedTitle'), t('recommendedSub'), rowHTML(recommendedList(), { reason: true })));
            parts.push(sectionHTML('secCategories', t('categoriesTitle'), '', categoryTilesHTML()));

            const collections = Object.entries(COLLECTIONS).map(([key, c]) => {
                const count = venues.filter((v) => collectionMatch(key, v)).length;
                const cover = venues.find((v) => v.id === c.cover);
                return `
                    <button class="collection" type="button" data-collection="${key}">
                        ${cover?.photos ? `<img src="${escapeHTML(cover.photos[0].thumb)}" alt="" crossorigin="anonymous" loading="lazy">` : ''}
                        <span class="collection-title">${t(c.title)}</span>
                        <span class="collection-desc">${t(c.desc)} · ${placesCount(count)}</span>
                    </button>`;
            }).join('');
            parts.push(sectionHTML('secCollections', t('collectionsTitle'), t('collectionsSub'), `<div class="collection-grid">${collections}</div>`));

            const dayTrips = venues
                .filter((v) => v.exact && kmBetween(LUANDA_CENTRE, v) >= 25 && kmBetween(LUANDA_CENTRE, v) <= 160)
                .sort((a, b) => kmBetween(LUANDA_CENTRE, a) - kmBetween(LUANDA_CENTRE, b));
            if (dayTrips.length) parts.push(sectionHTML('secDayTrips', t('dayTripsTitle'), t('dayTripsSub'), rowHTML(dayTrips, { fromLuanda: true })));

            $('homeView').innerHTML = parts.join('');
            document.querySelectorAll('#homeView .card-row').forEach(updateRowControls);
        }

        /* ---------- Results ---------- */

        function resultsTitle() {
            const f = state.filters;
            if (f.saved) return t('savedTitle');
            if (f.collection) return t(COLLECTIONS[f.collection].title);
            if (f.category) return catLabel(f.category, true);
            if (f.quick) return t(QUICK[f.quick].label);
            if (f.q) return t('resultsFor', { q: f.q });
            if (f.where === 'near') return t('nearYou');
            if (f.where) return t('inCity', { city: f.where });
            return t('allPlaces');
        }

        function resultsSub() {
            const f = state.filters;
            const parts = [];
            if (f.collection) parts.push(t(COLLECTIONS[f.collection].desc));
            if (f.quick && QUICK[f.quick].note) parts.push(t(QUICK[f.quick].note));
            if (f.q && (f.category || f.collection || f.quick)) parts.push(t('resultsFor', { q: f.q }));
            if (f.where && f.where !== 'near' && resultsTitle() !== t('inCity', { city: f.where })) parts.push(t('inCity', { city: f.where }));
            return parts.join(' · ');
        }

        function emptyHTML() {
            return `
                <div class="empty-block">
                    <p>${state.filters.saved ? t('emptySaved') : t('emptyFilter')}</p>
                    <button class="submit-btn" type="button" data-action="clear">${t('clearSearch')}</button>
                    <p class="hint">${t('emptyTry')}</p>
                    ${categoryTilesHTML()}
                </div>
                ${sectionHTML('secEmptyRecommended', t('recommendedTitle'), '', rowHTML(recommendedList(), { reason: true }))}`;
        }

        function renderResults() {
            const list = filteredVenues();
            $('resultsTitle').textContent = resultsTitle();
            $('resultsSub').textContent = resultsSub();
            $('resultsCount').textContent = placesCount(list.length);
            $('resultsTools').hidden = list.length === 0;
            if (list.length) {
                $('resultsList').className = 'card-grid';
                $('resultsList').innerHTML = list.map((v) => cardHTML(v)).join('');
            } else {
                $('resultsList').className = '';
                $('resultsList').innerHTML = emptyHTML();
                document.querySelectorAll('#resultsList .card-row').forEach(updateRowControls);

        function renderQuickFilters() {
            $('quickFilters').innerHTML = Object.entries(QUICK)
                .filter(([, q]) => !q.show || q.show())
                .map(([key, q]) => {
                    const active = state.view === 'results' && state.filters.quick === key;
                    return `<button type="button" class="chip${active ? ' active' : ''}" data-quick="${key}" aria-pressed="${active}">${icon(q.icon)}${t(q.label)}</button>`;
                }).join('');

        function renderWhereOptions() {
            $('whereSelect').innerHTML = [
                `<option value="">${t('whereAll')}</option>`,
                `<option value="near">${t('nearMe')}</option>`,
                ...CITIES.map((c) => `<option value="${c}">${c}</option>`)
            ].join('');
            $('whereSelect').value = state.filters.where;
        }

        function renderSortOptions() {
            const options = ['relevance', 'distance', ...(reviewsEnabled() ? ['rating'] : []), 'price', 'name'];
            const labels = { relevance: 'sortRelevance', distance: 'sortDistance', rating: 'sortRating', price: 'sortPrice', name: 'sortName' };
            $('sortSelect').innerHTML = options.map((o) => `<option value="${o}">${t(labels[o])}</option>`).join('');

            $('savedCount').textContent = favorites.length;

            renderQuickFilters();

            $('homeView').hidden = state.view !== 'home';

        /* ---------- Place details ---------- */

        function socialLinks(v) {
            const q = `${v.name} ${cityOf(v)} Angola`;
            const enc = encodeURIComponent(q);
            return [
                ['YouTube', `https://www.youtube.com/results?search_query=${enc}`],
                ['Instagram', `https://www.google.com/search?q=${encodeURIComponent(q + ' site:instagram.com')}`],

        }

        function hoursHTML(v) {
            if (!v.hours) return t('toConfirm');
            const today = luandaNow().day;
            const order = [1, 2, 3, 4, 5, 6, 0];
            return `${statusHTML(v)}<ul class="week">${order.map((d) => {
                const slots = v.hours[d];
                const text = slots ? slots.map(([o, c]) => `${o}–${c}`).join(', ') : t('closed');
                return `<li class="${d === today ? 'today' : ''}"><span>${weekdayName(d)}</span><span>${text}</span></li>`;
            }).join('')}</ul>`;

        function verifiedRowHTML(v) {
            if (!v.verified) return `<div class="fact"><dt>${t('notVerifiedLabel')}</dt><dd>${t('notVerified')}</dd></div>`;
            const date = formatDate(v.verified.date);
            const sources = v.verified.sources.length
                ? `<br>${t('sourcesLabel')}: ${v.verified.sources.map((s) => `<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener">${escapeHTML(s.label)}</a>`).join(', ')}`

                        <div class="fact"><dt>${t('addressLabel')}</dt><dd>${escapeHTML(address)}</dd></div>
                        <div class="fact"><dt>${t('mapLabel')}</dt><dd>${map}<a class="text-link" href="${mapsURL(v, 'search')}" target="_blank" rel="noopener">${icon('pin')}${t('viewMap')}</a></dd></div>
                        <div class="fact"><dt>${t('priceLabel')}</dt><dd>${escapeHTML(priceText(v))}${v.price?.estimate ? `<br>${t('priceEstimate')}` : ''}</dd></div>

                        <div class="menu-item">

                    `).join('')}

            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${v.name}, ${v.location}, Angola`)}`;
        }

            return `https://www.tripadvisor.com/Search?q=${encodeURIComponent(`${v.name} ${cityOf(v)} Angola`)}`;
        }

        function externalReviewsHTML(v) {
            return `
                <div class="external-reviews">
                    <p class="hint">${t('externalReviews')}</p>
                    <div class="social">
                        <a href="${googleReviewsURL(v)}" target="_blank" rel="noopener">Google Maps</a>
                        <a href="${tripadvisorURL(v)}" target="_blank" rel="noopener">TripAdvisor</a>
                    </div>

        }

        function reviewItemHTML(r) {
            return `
                <div class="review">
                    <div class="review-head">
                        <span class="review-name">${escapeHTML(r.author)}</span>
                        <span class="review-date">${escapeHTML(new Date(r.created_at).toLocaleDateString(locale()))}</span>
                    </div>
                    <div class="stars" aria-label="${t('stars', { n: r.rating })}">${stars(r.rating)}</div>
                    <div class="review-text">${escapeHTML(r.comment)}</div>
                    <button type="button" class="report-btn" data-report-review="${escapeHTML(r.id)}">${t('report')}</button>
                </div>
            `;
        }

        // Without the shared backend there are no real visitor reviews, so only link to public ones.
        function reviewsHTML(v) {
            if (!reviewsEnabled()) {
                return `
                    <section id="reviewsSection">
                        <h3 class="section-title">${t('opinions')}</h3>
                        <div class="panel">${externalReviewsHTML(v)}</div>
                    </section>`;
            }
            const savedName = store.get('angoliveReviewerName', '');
            return `
                <section id="reviewsSection">
                    <h3 class="section-title">${t('reviews')}</h3>
                    <div class="panel">
                        <div class="avg">${avgHTML(statsOf(v))}</div>
                        ${externalReviewsHTML(v)}
                        <form class="review-form" id="reviewForm" novalidate>
                            <div class="review-form-title">${t('yourReview')}</div>
                            <div class="star-input" id="starInput" role="group" aria-label="${t('yourReview')}">
                                ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star-btn" data-star="${n}" aria-label="${t('stars', { n })}" aria-pressed="false">☆</button>`).join('')}
                            </div>
                            <input class="field" id="reviewName" type="text" maxlength="60" autocomplete="name" placeholder="${t('yourName')}" aria-label="${t('yourName')}" value="${escapeHTML(savedName)}">

                            <div class="form-msg" id="reviewMsg" role="status" aria-live="polite"></div>

                            <p class="hint">${t('moderationNote')}</p>
                        </form>
                        <div id="reviewList"><p class="hint">${t('loading')}</p></div>
                    </div>
                </section>
            `;

        async function loadReviews(venueId) {
            if (!reviewsEnabled()) return;
            try {
                const res = await sbRequest(`/rest/v1/reviews?select=id,author,rating,comment,created_at&venue_id=eq.${venueId}&status=eq.approved&order=created_at.desc&limit=50`, { headers: sbHeaders() });
                const items = await res.json();
                const list = $('reviewList');
                if (state.openId !== venueId || !list) return;
                list.innerHTML = items.length
                    ? items.map(reviewItemHTML).join('')
                    : `<p class="hint" style="text-align:center;">${t('noReviews')}</p>`;
            } catch {
                const list = $('reviewList');
                if (list && state.openId === venueId) list.innerHTML = `<p class="hint">${t('reviewsError')}</p>`;
            }
        }

        function favButtonHTML(id) {
            return `${icon('heart')}<span>${favorites.includes(id) ? t('saved') : t('save')}</span>`;
        }

        function openVenue(id, keepScroll = false) {
            const v = venues.find((x) => x.id === id);
            if (!v) return;
            const panel = $('venuePanel');
            const scroll = panel.scrollTop;
            state.openId = id;
            state.rating = 0;

            const digits = phoneDigits(v);
            const isFav = favorites.includes(v.id);
            const dist = distanceText(v);
            const stats = statsOf(v);

            panel.innerHTML = `
                <button class="close-btn" type="button" data-close="venueModal" aria-label="${t('close')}">×</button>
                ${heroHTML(v)}
                <div class="modal-body">
                    <div>
                        <div class="card-type">${icon(CATEGORY[v.type].icon)}${catLabel(v.type, false)} · ${escapeHTML(placeLine(v))}</div>
                        <h2 class="modal-name" id="venueTitle">${escapeHTML(v.name)}</h2>
                        <div class="modal-sub">
                            <button type="button" class="rating-link" data-action="reviews" aria-label="${stats ? t('seeReviews') : t('opinionsLink')}">${ratingLinkHTML(stats)}</button>
                            <span>${escapeHTML(priceText(v))}</span>
                            ${dist ? `<span>${dist}</span>` : ''}
                            ${statusHTML(v)}
                        </div>
                        <p class="hint" id="ratingNote" ${stats ? '' : 'hidden'}>${t('aboutRatings')}</p>
                    </div>

                    <div class="actions">
                        <a class="action-btn solid wide" href="${mapsURL(v, 'directions')}" target="_blank" rel="noopener">${icon('directions')}${t('directions')}</a>
                        ${digits ? `
                            <a class="action-btn" href="tel:+${digits}">${icon('phone')}${t('call')}</a>
                            <a class="action-btn" href="https://wa.me/${digits}" target="_blank" rel="noopener">${icon('chat')}${t('whatsapp')}</a>
                        ` : ''}
                        <button class="action-btn${isFav ? ' saved' : ''}" type="button" id="favBtn" aria-pressed="${isFav}">${favButtonHTML(v.id)}</button>
                        <button class="action-btn" type="button" id="shareBtn">${icon('share')}${t('share')}</button>
                    </div>

                    ${practicalHTML(v)}

                        <p class="section-content">${escapeHTML(descOf(v))}</p>
                    </section>

                    <section>
                        <h3 class="section-title">${t('media')}</h3>
                        <div class="social">${socialLinks(v)}</div>
                        <p class="hint" style="margin-top:8px;">${t('mediaHint')}</p>
                    </section>

            `;

            $('venueModal').setAttribute('aria-labelledby', 'venueTitle');
            openModal('venueModal');
            if (keepScroll) panel.scrollTop = scroll;
            history.replaceState(null, '', `${location.pathname}${location.search}#local-${id}`);
            upgradeHero(v.photos ? fullSrc(v.photos[0]) : v.image);
            loadSubmissions(id);
            loadReviews(id);
        }

        function updateStars() {
            document.querySelectorAll('#starInput .star-btn').forEach((btn) => {
                const on = Number(btn.dataset.star) <= state.rating;
                btn.textContent = on ? '★' : '☆';
                btn.classList.toggle('on', on);
                btn.setAttribute('aria-pressed', String(Number(btn.dataset.star) === state.rating));
            });
        }

        async function submitReview(event) {
            event.preventDefault();
            const name = $('reviewName').value.trim();
            const comment = $('reviewText').value.trim();
            const msg = $('reviewMsg');
            const button = $('reviewSubmit');
            msg.classList.remove('ok');
            if (!state.rating) { msg.textContent = t('errStars'); return; }
            if (!name) { msg.textContent = t('errName'); $('reviewName').focus(); return; }
            if (!comment) { msg.textContent = t('errComment'); $('reviewText').focus(); return; }
            store.set('angoliveReviewerName', name);

            button.disabled = true;
            button.textContent = t('sending');
            try {
                await sbRequest('/rest/v1/reviews', {
                    method: 'POST',
                    headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify({ venue_id: state.openId, author: name, rating: state.rating, comment })
                });
                $('reviewText').value = '';
                state.rating = 0;
                updateStars();
                msg.textContent = t('reviewPending');
                msg.classList.add('ok');
            } catch {
                msg.textContent = t('errSend');
            } finally {
                button.disabled = false;
                button.textContent = t('send');
            }
        }

        function toggleFavorite() {
            const id = state.openId;
            favorites = favorites.includes(id) ? favorites.filter((f) => f !== id) : [...favorites, id];
            store.set('favorites', favorites);
            const btn = $('favBtn');
            const isFav = favorites.includes(id);
            btn.innerHTML = favButtonHTML(id);
            btn.classList.toggle('saved', isFav);
            btn.setAttribute('aria-pressed', String(isFav));
            render();
        }

        function shareVenue() {
            const v = venues.find((x) => x.id === state.openId);
            const base = inNativeApp ? PUBLIC_URL : `${location.origin}${location.pathname}`;
            const url = `${base}#local-${v.id}`;
            const text = t('shareText', { name: v.name, location: v.location });
            if (navigator.share) {
                navigator.share({ title: v.name, text, url }).catch(() => {});
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(`${text}: ${url}`)}`, '_blank', 'noopener');
            }
        }

        /* ---------- Visitor photos and videos (Supabase) ---------- */

        const VIDEO_URL = /^https:\/\/(www\.|m\.|vm\.)?(youtube\.com|youtu\.be|tiktok\.com|instagram\.com)\//i;
        const photoBase = () => `${SUPABASE_URL}/storage/v1/object/public/submissions/`;

        function sbHeaders(extra = {}) {
            const headers = { apikey: SUPABASE_KEY, ...extra };
            if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = `Bearer ${SUPABASE_KEY}`;
            return headers;
        }

        async function sbRequest(path, options = {}) {
            const res = await fetch(`${SUPABASE_URL}${path}`, options);
            if (!res.ok) throw new Error(`Supabase ${res.status}`);
            return res;
        }

        async function compressPhoto(file) {
            const bitmap = await createImageBitmap(file);
            const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(bitmap.width * scale);
            canvas.height = Math.round(bitmap.height * scale);
            canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            bitmap.close?.();
            return new Promise((resolve, reject) => canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('encode'))), 'image/jpeg', 0.82));
        }

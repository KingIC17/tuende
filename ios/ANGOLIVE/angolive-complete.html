        async function loadSubmissions(venueId) {
            if (!supabaseReady()) return;
            try {
                const res = await sbRequest(`/rest/v1/submissions?select=id,kind,url,author,caption&venue_id=eq.${venueId}&status=eq.approved&order=created_at.desc&limit=30`, { headers: sbHeaders() });
                const items = await res.json();
                const gallery = $('visitorGallery');
                if (state.openId !== venueId || !gallery) return;
                const v = venues.find((x) => x.id === venueId);
                const html = items.map((s) => submissionHTML(s, v)).join('');
                gallery.innerHTML = html || `<p class="hint">${t('visitorEmpty')}</p>`;
            } catch {
                const gallery = $('visitorGallery');
                if (gallery && state.openId === venueId) gallery.innerHTML = `<p class="hint">${t('visitorError')}</p>`;
            }
        }

        async function submitMedia(event) {
            event.preventDefault();
            const venueId = state.openId;
            const kind = document.querySelector('input[name="mediaKind"]:checked').value;
            const caption = $('mediaCaption').value.trim();
            const msg = $('mediaMsg');
            const button = $('mediaSubmit');
            msg.classList.remove('ok');

            const file = $('mediaFile').files[0];
            const videoUrl = $('mediaUrl').value.trim();
            if (kind === 'photo' && !file) { msg.textContent = t('errFile'); return; }
            if (kind === 'photo' && !file.type.startsWith('image/')) { msg.textContent = t('errFileType'); return; }
            if (kind === 'video' && !VIDEO_URL.test(videoUrl)) { msg.textContent = t('errVideo'); $('mediaUrl').focus(); return; }
            if (!$('mediaConsent').checked) { msg.textContent = t('errConsent'); return; }

            button.disabled = true;
            button.textContent = t('sending');
            msg.textContent = '';
            try {
                let url = videoUrl;
                if (kind === 'photo') {
                    const blob = await compressPhoto(file);
                    // Each account uploads into its own folder, so the files can be removed with the account.
                    const path = `${session.user.id}/${venueId}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}.jpg`;
                    await sbRequest(`/storage/v1/object/submissions/${path}`, {
                        method: 'POST',
                        headers: await userHeaders({ 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }),
                        body: blob
                    });
                    url = photoBase() + path;
                }
                await sbRequest('/rest/v1/submissions', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify({ venue_id: venueId, kind, url, caption: caption || null })
                });
                if (state.openId !== venueId) return;
                $('mediaForm').reset();
                $('photoField').hidden = false;
                $('videoField').hidden = true;
                msg.textContent = t('mediaThanks');
                msg.classList.add('ok');
            } catch (err) {
                if (needsSignIn(err, msg)) return;
                msg.textContent = t('errSend');
            } finally {
                button.disabled = false;
                button.textContent = t('sendMedia');
            }
        }

        async function reportSubmission(button) {
            if (!signedIn()) { openAuth('signin', { reason: t('authNeedReport') }); return; }
            if (!confirm(t('reportConfirm'))) return;
            button.disabled = true;
            try {
                await sbRequest('/rest/v1/reports', {
                    method: 'POST',
                    headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                    body: JSON.stringify(button.dataset.report ? { submission_id: button.dataset.report } : { review_id: button.dataset.reportReview })
                });
                button.textContent = t('reported');
            } catch (err) {
                if (err.status === 409) { button.textContent = t('alreadyReported'); return; }
                button.disabled = false;
                button.textContent = needsSignIn(err) ? t('signIn') : t('errSend');
            }
        }

        /* ---------- Accounts (Supabase Auth: email and password) ---------- */

        let session = store.get('angoliveSession', null);
        let authView = 'signin';
        let afterAuth = null;
        let refreshing = null;
        const accountsEnabled = supabaseReady;
        const signedIn = () => accountsEnabled() && Boolean(session?.access_token);
        const accountName = () => session?.user?.user_metadata?.display_name || session?.user?.email?.split('@')[0] || '';
        const authRedirect = () => (inNativeApp ? PUBLIC_URL : `${location.origin}${location.pathname}`);
        const validEmail = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        const STATUS_LABELS = { pending: 'statusPending', approved: 'statusApproved', rejected: 'statusRejected', hidden: 'statusHidden', new: 'statusNew', done: 'statusDone' };

        function saveSession(data) {
            if (!data) {
                session = null;
                store.remove('angoliveSession');
            } else {
                session = {
                    access_token: data.access_token,
                    refresh_token: data.refresh_token || session?.refresh_token,
                    expires_at: Number(data.expires_at) || Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600),
                    user: data.user ? { id: data.user.id, email: data.user.email, user_metadata: data.user.user_metadata || {} } : session?.user || null
                };
                store.set('angoliveSession', session);
            }
            renderAccountButton();
        }

        async function authRequest(path, body, { method = 'POST', token } = {}) {
            const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            const res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw Object.assign(new Error('auth'), { status: res.status, code: data.error_code || data.code || data.error || '', text: data.msg || data.error_description || data.message || '' });
            }
            return data;
        }

        // Access tokens last about an hour; renew them a minute before they run out.
        async function accessToken() {
            if (!signedIn()) return null;
            if (session.expires_at - 60 > Date.now() / 1000) return session.access_token;
            refreshing ||= authRequest('/token?grant_type=refresh_token', { refresh_token: session.refresh_token })
                .then((data) => {
                    saveSession(data);
                    return session.access_token;
                })
                .catch((err) => {
                    if (err.status && err.status < 500) signOutLocally();
                    return null;
                })
                .finally(() => { refreshing = null; });
            return refreshing;
        }

        // Requests made as the signed-in person; the database's row-level security checks who they are.
        async function userHeaders(extra = {}) {
            const token = await accessToken();
            if (!token) throw Object.assign(new Error('signin'), { status: 401 });
            return { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, ...extra };
        }

        function needsSignIn(err, msg) {
            if (err?.status !== 401) return false;
            if (msg) msg.textContent = t('authExpired');
            openAuth('signin', { reason: t('authExpired') });
            return true;
        }

        function authErrorText(err) {
            const code = String(err.code || '');
            const text = String(err.text || '').toLowerCase();
            if (err.status === 429 || code.includes('rate_limit')) return t('authErrRate');
            if (code === 'invalid_credentials' || text.includes('invalid login')) return t('authErrCredentials');
            if (code === 'email_not_confirmed' || text.includes('not confirmed')) return t('authErrNotConfirmed');
            if (code === 'user_already_exists' || code === 'email_exists' || text.includes('already registered')) return t('authErrExists');
            if (code === 'weak_password' || text.includes('password should')) return t('authErrWeak');
            if (code === 'otp_expired' || code === 'flow_state_expired') return t('authErrLink');
            return t('errSend');
        }

        function renderAccountButton() {
            const btn = $('accountBtn');
            btn.hidden = !accountsEnabled();
            $('accountLabel').textContent = signedIn() ? t('account') : t('signIn');
            btn.setAttribute('aria-label', signedIn() ? t('accountAria', { name: accountName() }) : t('signIn'));
        }

        function signInPromptHTML(reasonKey) {
            return `
                <div class="signin-prompt">
                    <p>${t(reasonKey)}</p>
                    <div class="banner-actions">
                        <button class="submit-btn" type="button" data-auth-open="signin">${t('signIn')}</button>
                        <button class="submit-btn secondary" type="button" data-auth-open="signup">${t('createAccount')}</button>
                    </div>
                </div>`;
        }

        function passwordFieldHTML(labelKey, autocomplete) {
            return `
                <div class="form-group">
                    <label for="authPassword">${t(labelKey)}</label>
                    <div class="password-wrap">
                        <input class="field" id="authPassword" type="password" autocomplete="${autocomplete}" minlength="8" maxlength="72">
                        <button type="button" class="link-btn" data-toggle-password aria-pressed="false">${t('authShow')}</button>
                    </div>
                    ${autocomplete === 'new-password' ? `<span class="hint">${t('authPasswordHint')}</span>` : ''}
                </div>`;
        }

        const emailFieldHTML = (value) => `
            <div class="form-group"><label for="authEmail">${t('authEmail')}</label><input class="field" id="authEmail" type="email" autocomplete="email" maxlength="254" value="${escapeHTML(value)}"></div>`;
        const authSubmitHTML = (key) => `
            <div class="form-msg" id="authMsg" role="status" aria-live="polite"></div>
            <button class="submit-btn" type="submit" id="authSubmit" style="width:100%">${t(key)}</button>`;

        function renderAuth(view, { reason = '', notice = '', email = '' } = {}) {
            authView = view;
            const top = `${reason ? `<p class="auth-reason">${escapeHTML(reason)}</p>` : ''}${notice ? `<p class="form-msg ok auth-notice">${escapeHTML(notice)}</p>` : ''}`;
            const views = {
                signin: () => `
                    <h2 class="info-title" id="authTitle">${t('signIn')}</h2>
                    ${top || `<p class="hint">${t('authIntro')}</p>`}
                    <form id="authForm" novalidate>
                        ${emailFieldHTML(email)}
                        ${passwordFieldHTML('authPassword', 'current-password')}
                        ${authSubmitHTML('signIn')}
                    </form>
                    <p class="auth-switch"><button type="button" class="link-btn" data-auth-view="forgot">${t('authForgot')}</button></p>
                    <p class="auth-switch">${t('authNoAccount')} <button type="button" class="link-btn" data-auth-view="signup">${t('createAccount')}</button></p>`,
                signup: () => `
                    <h2 class="info-title" id="authTitle">${t('createAccount')}</h2>
                    ${top || `<p class="hint">${t('authIntro')}</p>`}
                    <form id="authForm" novalidate>
                        <div class="form-group"><label for="authName">${t('authName')}</label><input class="field" id="authName" type="text" maxlength="60" autocomplete="name"></div>
                        ${emailFieldHTML(email)}
                        ${passwordFieldHTML('authPassword', 'new-password')}
                        <label class="consent"><input type="checkbox" id="authConsent"><span>${t('authConsent')}</span></label>
                        ${authSubmitHTML('createAccount')}
                    </form>
                    <p class="auth-switch">${t('authHaveAccount')} <button type="button" class="link-btn" data-auth-view="signin">${t('signIn')}</button></p>`,
                forgot: () => `
                    <h2 class="info-title" id="authTitle">${t('authForgotTitle')}</h2>
                    ${top || `<p class="hint">${t('authForgotIntro')}</p>`}
                    <form id="authForm" novalidate>
                        ${emailFieldHTML(email)}
                        ${authSubmitHTML('authSendLink')}
                    </form>
                    <p class="auth-switch"><button type="button" class="link-btn" data-auth-view="signin">${t('signIn')}</button></p>`,
                reset: () => `
                    <h2 class="info-title" id="authTitle">${t('authResetTitle')}</h2>
                    ${top}
                    <form id="authForm" novalidate>
                        ${passwordFieldHTML('authNewPassword', 'new-password')}
                        ${authSubmitHTML('authSavePassword')}
                    </form>`,
                account: () => `
                    <h2 class="info-title" id="authTitle">${t('authHello', { name: escapeHTML(accountName()) })}</h2>
                    <p class="hint">${escapeHTML(session?.user?.email || '')}</p>
                    ${top}
                    <dl class="facts account-facts">
                        <div class="fact"><dt>${t('authSavedCount')}</dt><dd>${favorites.length} ${favorites.length ? `<button type="button" class="link-btn" data-action="show-saved">${t('seeAll')}</button>` : ''}</dd></div>
                    </dl>
                    <p class="hint">${t('authSyncNote')}</p>
                    <h3 class="section-title">${t('authContrib')}</h3>
                    <div id="myContrib"><p class="hint">${t('loading')}</p></div>
                    <form id="authForm" class="account-name-form" novalidate>
                        <div class="form-group"><label for="authName">${t('authChangeName')}</label><input class="field" id="authName" type="text" maxlength="60" autocomplete="nickname" value="${escapeHTML(accountName())}"></div>
                        ${authSubmitHTML('authSaveName')}
                    </form>
                    <button class="submit-btn secondary" type="button" data-action="signout" style="width:100%;margin-top:12px">${t('authSignOut')}</button>
                    <details class="danger-zone">
                        <summary>${t('authDeleteTitle')}</summary>
                        <p>${t('authDeleteText')}</p>
                        <div class="form-msg" id="deleteMsg" role="status" aria-live="polite"></div>
                        <button class="submit-btn danger" type="button" data-action="delete-account">${t('authDeleteBtn')}</button>
                    </details>`
            };
            $('authContent').innerHTML = (views[view] || views.signin)();
            if (view === 'account') loadContributions();
        }

        function openAuth(view, { reason = '', notice = '', after = null } = {}) {
            if (!accountsEnabled()) return;
            afterAuth = after;
            renderAuth(view || (signedIn() ? 'account' : 'signin'), { reason, notice });
            openModal('authModal');
            $('authContent').querySelector('input:not([type="checkbox"])')?.focus();
        }

        async function afterSignIn() {
            const next = afterAuth;
            afterAuth = null;
            closeModal('authModal');
            await syncFavorites();
            render();
            if (state.openId) openVenue(state.openId, true);
            if (next) next();
        }

        async function submitAuth(event) {
            event.preventDefault();
            const msg = $('authMsg');
            const button = $('authSubmit');
            msg.classList.remove('ok');
            msg.textContent = '';
            const email = $('authEmail')?.value.trim() || '';
            const password = $('authPassword')?.value || '';
            const name = $('authName')?.value.trim().slice(0, 60) || '';
            const fail = (key, field) => {
                msg.textContent = t(key);
                field?.focus();
            };
            if (['signup', 'account'].includes(authView) && !name) return fail('authErrName', $('authName'));
            if (['signin', 'signup', 'forgot'].includes(authView) && !validEmail(email)) return fail('authErrEmail', $('authEmail'));
            if (['signin', 'signup', 'reset'].includes(authView) && password.length < 8) return fail('authErrPassword', $('authPassword'));
            if (authView === 'signup' && !$('authConsent').checked) return fail('authErrConsent', $('authConsent'));

            const label = button.textContent;
            button.disabled = true;
            button.textContent = t('authWait');
            try {
                if (authView === 'signin') {
                    saveSession(await authRequest('/token?grant_type=password', { email, password }));
                    await afterSignIn();
                } else if (authView === 'signup') {
                    const data = await authRequest(`/signup?redirect_to=${encodeURIComponent(authRedirect())}`, { email, password, data: { display_name: name } });
                    if (data.access_token) {
                        saveSession(data);
                        await afterSignIn();
                    } else {
                        renderAuth('signin', { notice: t('authCheckEmail', { email }), email });
                    }
                } else if (authView === 'forgot') {
                    await authRequest(`/recover?redirect_to=${encodeURIComponent(authRedirect())}`, { email });
                    renderAuth('signin', { notice: t('authLinkSent', { email }), email });
                } else if (authView === 'reset') {
                    const user = await authRequest('/user', { password }, { method: 'PUT', token: await accessToken() });
                    saveSession({ ...session, user });
                    renderAuth('account', { notice: t('authPasswordSaved') });
                } else if (authView === 'account') {
                    const user = await authRequest('/user', { data: { display_name: name } }, { method: 'PUT', token: await accessToken() });
                    saveSession({ ...session, user });
                    renderAuth('account', { notice: t('authNameSaved') });
                }
            } catch (err) {
                if ($('authMsg')) $('authMsg').textContent = authErrorText(err);
            } finally {
                if (document.contains(button)) {
                    button.disabled = false;
                    button.textContent = label;
                }
            }
        }

        function signOutLocally() {
            saveSession(null);
            render();
            if (state.openId) openVenue(state.openId, true);
        }

        function signOut() {
            const token = session?.access_token;
            signOutLocally();
            closeModal('authModal');
            if (token) authRequest('/logout', null, { token }).catch(() => {});
        }

        async function loadContributions() {
            try {
                const headers = await userHeaders();
                const uid = session.user.id;
                const get = (path) => sbRequest(path, { headers }).then((res) => res.json());
                const [reviews, media, fixes] = await Promise.all([
                    get(`/rest/v1/reviews?select=venue_id,rating,status,created_at&user_id=eq.${uid}&order=created_at.desc&limit=30`),
                    get(`/rest/v1/submissions?select=venue_id,kind,status,created_at&user_id=eq.${uid}&order=created_at.desc&limit=30`),
                    get(`/rest/v1/corrections?select=venue_id,status,created_at&user_id=eq.${uid}&order=created_at.desc&limit=30`)
                ]);
                const items = [
                    ...reviews.map((r) => ({ ...r, label: t(r.rating ? 'contribReview' : 'contribComment') })),
                    ...media.map((m) => ({ ...m, label: t(m.kind === 'photo' ? 'contribPhoto' : 'contribVideo') })),
                    ...fixes.map((f) => ({ ...f, label: t('contribFix') }))
                ].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
                const box = $('myContrib');
                if (!box) return;
                box.innerHTML = items.length
                    ? `<ul class="contrib-list">${items.map((item) => {
                        const place = venues.find((v) => v.id === item.venue_id)?.name;
                        return `<li><span><b>${escapeHTML(item.label)}</b>${place ? ` · ${escapeHTML(place)}` : ''}</span><span class="contrib-status ${escapeHTML(item.status)}">${t(STATUS_LABELS[item.status] || 'statusPending')}</span></li>`;
                    }).join('')}</ul>`
                    : `<p class="hint">${t('authContribEmpty')}</p>`;
            } catch {
                if ($('myContrib')) $('myContrib').innerHTML = `<p class="hint">${t('errSend')}</p>`;
            }
        }

        // Photos are removed through the storage API first; the database then deletes the account and, in cascade, everything linked to it.
        async function deleteAccount(button) {
            if (!confirm(t('authDeleteConfirm'))) return;
            const msg = $('deleteMsg');
            button.disabled = true;
            try {
                const headers = await userHeaders({ 'Content-Type': 'application/json' });
                const folder = `${session.user.id}/`;
                const files = await sbRequest('/storage/v1/object/list/submissions', { method: 'POST', headers, body: JSON.stringify({ prefix: folder, limit: 1000 }) }).then((res) => res.json());
                const paths = files.filter((f) => f.name).map((f) => folder + f.name);
                if (paths.length) await sbRequest('/storage/v1/object/submissions', { method: 'DELETE', headers, body: JSON.stringify({ prefixes: paths }) });
                await sbRequest('/rest/v1/rpc/delete_my_account', { method: 'POST', headers, body: '{}' });
                favorites = [];
                store.set('favorites', favorites);
                saveSession(null);
                render();
                if (state.openId) openVenue(state.openId, true);
                renderAuth('signin', { notice: t('authDeleted') });
            } catch (err) {
                button.disabled = false;
                if (!needsSignIn(err, msg)) msg.textContent = t('errSend');
            }
        }

        // Saved places stay on the device; with an account they are also kept in the database and merged on sign-in.
        async function syncFavorites() {
            if (!signedIn()) return;
            try {
                const headers = await userHeaders();
                const remote = (await sbRequest('/rest/v1/favorites?select=venue_id', { headers }).then((res) => res.json())).map((r) => r.venue_id);
                const missing = favorites.filter((id) => !remote.includes(id));
                if (missing.length) {
                    await sbRequest('/rest/v1/favorites', {
                        method: 'POST',
                        headers: { ...headers, 'Content-Type': 'application/json', Prefer: 'return=minimal,resolution=ignore-duplicates' },
                        body: JSON.stringify(missing.map((venue_id) => ({ venue_id })))
                    });
                }
                favorites = [...new Set([...remote, ...favorites])].filter((id) => venues.some((v) => v.id === id));
                store.set('favorites', favorites);
                render();
            } catch {}
        }

        function pushFavorite(id, add) {
            if (!signedIn()) return;
            userHeaders(add ? { 'Content-Type': 'application/json', Prefer: 'return=minimal,resolution=ignore-duplicates' } : {})
                .then((headers) => sbRequest(add ? '/rest/v1/favorites' : `/rest/v1/favorites?venue_id=eq.${id}`, add
                    ? { method: 'POST', headers, body: JSON.stringify({ venue_id: id }) }
                    : { method: 'DELETE', headers }))
                .catch(() => {});
        }

        // The confirmation and password emails link back here with the session in the address (#access_token=...).
        async function consumeAuthRedirect() {
            if (!accountsEnabled()) return;
            const params = new URLSearchParams(location.hash.slice(1));
            const error = params.get('error_description') || params.get('error');
            if (!params.get('access_token') && !error) return;
            history.replaceState(null, '', location.pathname + location.search);
            if (error) {
                openAuth('signin', { reason: t('authErrLink') });
                return;
            }
            saveSession({ access_token: params.get('access_token'), refresh_token: params.get('refresh_token'), expires_in: params.get('expires_in'), expires_at: params.get('expires_at') });
            try {
                saveSession({ ...session, user: await authRequest('/user', null, { method: 'GET', token: session.access_token }) });
            } catch {}
            await syncFavorites();
            render();
            if (params.get('type') === 'recovery') openAuth('reset');
            else openAuth('account', { notice: t('authWelcome') });
        }

        /* ---------- About, verification and corrections ---------- */

        function openInfo(kind) {
            $('infoContent').innerHTML = kind === 'about'
                ? `<h2 class="info-title" id="infoTitle">${t('aboutTitle')}</h2><p>${t('aboutP1')}</p><p>${t('aboutP2')}</p>`
                : `<h2 class="info-title" id="infoTitle">${t('verifyTitle')}</h2>
                   <ul class="info-list">
                       <li>${t('verifyExists')}</li>
                       <li>${t('verifyLocation')}</li>
                       <li>${t('verifyHours')}</li>
                       <li>${t('verifyPhotos')}</li>
                       <li>${reviewsEnabled() ? t('verifyReviewsOn') : t('verifyReviewsOff')}</li>
                   </ul>
                   ${canSuggestFix() ? `<p style="margin-top:14px;">${t('verifyFix')}</p>` : ''}`;
            openModal('infoModal');
        }

        function openFix(venueId) {
            if (supabaseReady() && !signedIn()) {
                openAuth('signin', { reason: t('authNeedFix'), after: () => openFix(venueId) });
                return;
            }
            $('fixContactGroup').hidden = signedIn();
            $('fixPlace').innerHTML = [...venues]
                .sort((a, b) => a.name.localeCompare(b.name, 'pt'))
                .map((v) => `<option value="${v.id}">${escapeHTML(v.name)} (${escapeHTML(cityOf(v))})</option>`)
                .join('');
            $('fixForm').reset();
            if (venues.some((v) => v.id === venueId)) $('fixPlace').value = String(venueId);
            $('fixMsg').textContent = '';
            $('fixMsg').classList.remove('ok');
            openModal('fixModal');
        }

        async function submitFix(event) {
            event.preventDefault();
            const message = $('fixMessage').value.trim();
            const contact = $('fixContact').value.trim();
            const msg = $('fixMsg');
            msg.classList.remove('ok');
            if (!message) { msg.textContent = t('errFixMessage'); $('fixMessage').focus(); return; }
            const venue = venues.find((v) => v.id === Number($('fixPlace').value));

            if (supabaseReady()) {
                const button = $('fixSubmit');
                button.disabled = true;
                button.textContent = t('sending');
                try {
                    await sbRequest('/rest/v1/corrections', {
                        method: 'POST',
                        headers: await userHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                        body: JSON.stringify({ kind: 'fix', venue_id: venue?.id ?? null, place_name: null, message })
                    });
                    $('fixForm').reset();
                    if (venue) $('fixPlace').value = String(venue.id);
                    msg.textContent = t('fixThanks');
                    msg.classList.add('ok');
                } catch (err) {
                    if (needsSignIn(err, msg)) return;
                    msg.textContent = t('errSend');
                } finally {
                    button.disabled = false;
                    button.textContent = t('fixSend');
                }
                return;
            }

            const body = [venue ? `${venue.name} (#${venue.id})` : '', '', message, contact ? `\n${contact}` : ''].join('\n');
            window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(t('fixEmailSubject'))}&body=${encodeURIComponent(body)}`;
            msg.textContent = t('fixEmailOpened');
            msg.classList.add('ok');
        }

        /* ---------- Agenda ---------- */

        const isoDay = (iso) => new Date(`${iso}T00:00:00Z`);
        const toISO = (date) => date.toISOString().slice(0, 10);
        const addDays = (iso, n) => toISO(new Date(isoDay(iso).getTime() + n * 86400000));
        const luandaToday = () => toISO(new Date(Date.now() + 60 * 60 * 1000));
        const eventEnd = (e) => e.end || e.start;
        const eventTitle = (e) => e.title[lang] || e.title.pt;
        const eventTypeLabel = (type) => EVENT_TYPES[type][lang];
        const eventsCount = (n) => (n === 1 ? t('eventsCountOne') : t('eventsCount', { n }));

        function fmtDay(iso, options) {
            return new Intl.DateTimeFormat(locale(), { timeZone: 'UTC', ...options }).format(isoDay(iso));
        }

        // Weeks run Monday to Sunday.
        function whenRange(when) {
            const today = luandaToday();
            const weekday = isoDay(today).getUTCDay();
            const sunday = addDays(today, (7 - weekday) % 7);
            const d = isoDay(today);
            const monthEnd = (offset) => toISO(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + offset, 0)));
            switch (when) {
                case 'today': return [today, today];
                case 'weekend': return weekday === 0 ? [today, today] : [addDays(today, 6 - weekday), sunday];
                case 'week': return [today, sunday];
                case 'nextweek': return [addDays(sunday, 1), addDays(sunday, 7)];
                case 'month': return [today, monthEnd(1)];
                case 'nextmonth': return [addDays(monthEnd(1), 1), monthEnd(2)];
                default: return [today, eventEnd({ start: '9999-12-31' })];
            }
        }

        // The days in [from, to] when the event actually happens. With a programme, only its dates count.
        function eventDaysBetween(e, from, to) {
            if (e.programme) {
                const days = e.programme.flatMap((item) => eventDaysBetween({ start: item.date, end: item.end }, from, to));
                return [...new Set(days)].sort();
            }
            const first = e.start > from ? e.start : from;
            const last = eventEnd(e) < to ? eventEnd(e) : to;
            const days = [];
            for (let day = first; day <= last && days.length < 400; day = addDays(day, 1)) {
                if (!e.days || e.days.includes(isoDay(day).getUTCDay())) days.push(day);
            }
            return days;
        }

        function upcomingEvents({ when = 'all', type = '', where = '' } = {}) {
            const [from, to] = whenRange(when);
            return EVENTS
                .filter((e) => (!type || e.type === type) && (!where || e.city === where))
                .map((e) => ({ e, days: eventDaysBetween(e, from, to) }))
                .filter(({ days }) => days.length)
                .sort((a, b) => a.days[0].localeCompare(b.days[0]) || a.e.start.localeCompare(b.e.start))
                .map(({ e, days }) => ({ ...e, next: days[0] }));
        }

        function eventDateText(e) {
            const end = eventEnd(e);
            if (end === e.start) return fmtDay(e.start, { weekday: 'long', day: 'numeric', month: 'long' });
            const sameMonth = e.start.slice(0, 7) === end.slice(0, 7);
            const from = fmtDay(e.start, sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'long' });
            return t('dateRange', { from, to: fmtDay(end, { day: 'numeric', month: 'long' }) });
        }

        function eventPriceText(e) {
            const p = e.price;
            if (!p) return t('priceTBC');
            if (p.free) return t('free');
            if (p.text) return p.text[lang];
            return p.to ? t('kzThousandRange', { a: kz(p.from), b: kz(p.to) }) : t('kzThousand', { a: kz(p.from) });
        }

        function eventVenueText(e) {
            if (!e.venue) return t('eventVenueTbc');
            return e.venueTbc ? `${e.venue} (${t('eventVenueTbc').toLowerCase()})` : e.venue;
        }

        function eventBadgesHTML(e) {
            const today = luandaToday();
            const end = eventEnd(e);
            const badges = [];
            if (e.confirmed === false) badges.push(['tbc', t('eventTbc')]);
            else if (e.start <= today && end > today) badges.push(['live', t('eventOngoing', { date: fmtDay(end, { day: 'numeric', month: 'long' }) })]);
            else if (e.start <= today && end === today) badges.push(['live', t('eventToday')]);
            else if (e.start === addDays(today, 1)) badges.push(['', t('eventTomorrow')]);
            if (e.price?.free) badges.push(['', t('free')]);
            return badges.map(([cls, text]) => `<span class="event-badge ${cls}">${escapeHTML(text)}</span>`).join('');
        }

        function dateBlockHTML(e) {
            const end = eventEnd(e);
            const month = (iso) => fmtDay(iso, { month: 'short' }).replace('.', '');
            const day = (iso) => Number(iso.slice(8));
            let to = '';
            if (end !== e.start) to = end.slice(0, 7) === e.start.slice(0, 7) ? `– ${day(end)}` : `– ${day(end)} ${month(end)}`;
            return `<span class="date-block" aria-hidden="true"><span class="db-month">${month(e.start)}</span><span class="db-day">${day(e.start)}</span>${to ? `<span class="db-to">${to}</span>` : ''}</span>`;
        }

        function eventCardHTML(e) {
            const when = [eventDateText(e), e.when?.[lang]].filter(Boolean).join(' · ');
            const programme = e.programme?.length
                ? `<p><b>${t('eventProgramme')}</b></p><ul>${e.programme.map((item) => `<li><b>${escapeHTML(eventDateText({ start: item.date, end: item.end }))}:</b> ${escapeHTML(item[lang])}</li>`).join('')}</ul>`
                : '';
            const phones = e.phones?.length
                ? `<p><b>${t('eventInfoPhone')}:</b> ${e.phones.map((n) => `<a href="tel:+244${n.replace(/\D/g, '')}">${escapeHTML(n)}</a>`).join(', ')}</p>`
                : '';
            const source = `<a href="${escapeHTML(e.source.url)}" target="_blank" rel="noopener">${escapeHTML(e.source.name)}</a>`;
            const link = e.link
                ? `<a class="action-btn solid" href="${escapeHTML(e.link)}" target="_blank" rel="noopener">${icon(e.tickets ? 'ticket' : 'external')}${t(e.tickets ? 'eventTickets' : 'eventOfficial')}</a>`
                : '';
            const directions = e.venue && !e.venueTbc
                ? `<a class="action-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.mapsQuery || `${e.venue}, ${e.city}, Angola`)}" target="_blank" rel="noopener">${icon('directions')}${t('directions')}</a>`
                : '';
            // The iPhone app cannot save downloaded files yet.
            const calendar = inNativeApp || e.confirmed === false
                ? ''
                : `<button class="action-btn" type="button" data-event-ics="${e.id}" aria-label="${escapeHTML(t('eventCalendarAria', { name: eventTitle(e) }))}">${icon('calendar')}${t('eventCalendar')}</button>`;
            return `
                <article class="event-card" id="evento-${e.id}" aria-labelledby="evt-${e.id}">
                    ${e.photo ? `
                        <figure class="event-photo">
                            <img src="${escapeHTML(fullSrc(e.photo))}" alt="${escapeHTML(e.photo.caption[lang])}" loading="lazy" crossorigin="anonymous" onerror="this.closest('figure').remove()">
                            <figcaption>${t('venuePhoto', { place: escapeHTML(e.photo.caption[lang]) })} · ${creditHTML(e.photo)}</figcaption>
                        </figure>` : ''}
                    ${dateBlockHTML(e)}
                    <div class="event-body">
                        <span class="card-type">${icon(EVENT_TYPES[e.type].icon)}${eventTypeLabel(e.type)} · ${escapeHTML(e.city)}</span>
                        <h3 class="event-title" id="evt-${e.id}" tabindex="-1">${escapeHTML(eventTitle(e))}</h3>
                        <div class="event-badges">${eventBadgesHTML(e)}</div>
                        <ul class="event-meta">
                            <li>${icon('calendar')}<span>${escapeHTML(when)}</span></li>
                            <li>${icon('pin')}<span>${escapeHTML(eventVenueText(e))}</span></li>
                            <li>${icon('tag')}<span>${escapeHTML(eventPriceText(e))}</span></li>
                        </ul>
                        ${e.tags ? `<p class="event-tags">${e.tags[lang].map((tag) => `#${escapeHTML(tag.replace(/\s+/g, ''))}`).join(' ')}</p>` : ''}
                        <details class="event-details">
                            <summary>${t('eventMore')}</summary>
                            <p>${escapeHTML(e.desc[lang])}</p>
                            ${e.price?.note ? `<p>${escapeHTML(e.price.note[lang])}</p>` : ''}
                            ${programme}
                            ${e.host ? `<p><b>${t('eventHost')}:</b> ${escapeHTML(e.host)}</p>` : ''}
                            ${phones}
                            <p class="event-source">${t('eventSource', { source, date: formatDate(e.checked) })}</p>
                        </details>
                        <div class="event-actions">
                            ${link}${directions}${calendar}
                            <button class="action-btn" type="button" data-event-share="${e.id}">${icon('share')}${t('share')}</button>
                        </div>
                    </div>
                </article>`;
        }

        function eventMiniHTML(e) {
            return `
                <button class="event-mini" type="button" data-event-open="${e.id}">
                    ${dateBlockHTML(e)}
                    <span>
                        <span class="card-type">${icon(EVENT_TYPES[e.type].icon)}${eventTypeLabel(e.type)}</span>
                        <span class="event-mini-title">${escapeHTML(eventTitle(e))}</span>
                        <span class="event-mini-meta">${escapeHTML(eventDateText(e))} · ${escapeHTML(e.city)}</span>
                    </span>
                </button>`;
        }

        function renderEvents() {
            const f = state.events;
            const upcoming = upcomingEvents();
            const cities = [...new Set(upcoming.map((e) => e.city))].sort((a, b) => a.localeCompare(b, 'pt'));
            $('eventsWhereWrap').hidden = cities.length < 2 && !f.where;
            $('eventsWhere').innerHTML = [`<option value="">${t('whereAll')}</option>`, ...cities.map((c) => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`)].join('');
            $('eventsWhere').value = cities.includes(f.where) ? f.where : '';

            $('eventsWhen').innerHTML = Object.entries(WHEN_LABELS).map(([key, label]) => {
                const active = f.when === key;
                return `<button type="button" class="chip${active ? ' active' : ''}" data-events-when="${key}" aria-pressed="${active}">${t(label)}</button>`;
            }).join('');

            const scoped = upcomingEvents({ when: f.when, where: f.where });
            const types = Object.keys(EVENT_TYPES).filter((type) => upcoming.some((e) => e.type === type));
            $('eventsType').innerHTML = [['', t('typeAll'), scoped.length], ...types.map((type) => [type, eventTypeLabel(type), scoped.filter((e) => e.type === type).length])]
                .map(([key, label, n]) => {
                    const active = f.type === key;
                    return `<button type="button" class="chip${active ? ' active' : ''}" data-events-type="${key}" aria-pressed="${active}">${key ? icon(EVENT_TYPES[key].icon) : ''}${escapeHTML(label)} <span class="chip-count">(${n})</span></button>`;
                }).join('');

            const list = f.type ? scoped.filter((e) => e.type === f.type) : scoped;
            $('eventsCount').textContent = eventsCount(list.length);
            $('eventsCta').hidden = !canRecommend();
            if (!list.length) {
                $('eventsList').innerHTML = `
                    <div class="empty-block">
                        <p>${t(upcoming.length ? 'eventsEmpty' : 'eventsNone')}</p>
                        ${upcoming.length ? `<button class="submit-btn" type="button" data-events-reset style="margin-top:12px">${t('eventsShowAll')}</button>` : ''}
                    </div>`;
                return;
            }
            const months = [];
            for (const e of list) {
                const key = e.next.slice(0, 7);
                if (months.at(-1)?.key !== key) months.push({ key, items: [] });
                months.at(-1).items.push(e);
            }
            $('eventsList').innerHTML = months.map(({ key, items }) => {
                const title = fmtDay(`${key}-01`, { month: 'long', year: 'numeric' });
                return `
                    <section class="event-month" aria-labelledby="mes-${key}">
                        <h2 id="mes-${key}">${escapeHTML(title.charAt(0).toUpperCase() + title.slice(1))}</h2>
                        <div class="event-list">${items.map(eventCardHTML).join('')}</div>
                    </section>`;
            }).join('');
        }

        function eventsQuery() {
            const params = new URLSearchParams({ page: 'events' });
            if (state.events.when !== 'all') params.set('when', state.events.when);
            if (state.events.type) params.set('type', state.events.type);
            if (state.events.where) params.set('where', state.events.where);
            return params.toString();
        }

        function eventFiltersFromQuery(params) {
            const when = params.get('when');
            const type = params.get('type');
            return {
                when: Object.hasOwn(WHEN_LABELS, when ?? '') ? when : 'all',
                type: Object.hasOwn(EVENT_TYPES, type ?? '') ? type : '',
                where: (params.get('where') || '').slice(0, 60)
            };
        }

        function showEvents({ push = true, filters = {} } = {}) {
            state.view = 'events';
            state.events = { ...DEFAULT_EVENT_FILTERS, ...filters };
            if (push) history.pushState(null, '', `${location.pathname}?${eventsQuery()}`);
            render();
            window.scrollTo({ top: 0 });
        }

        // Filter changes replace the address instead of adding to the history, so "back" leaves the agenda.
        function setEventFilters(changes, focusSelector) {
            state.events = { ...state.events, ...changes };
            history.replaceState(null, '', `${location.pathname}?${eventsQuery()}`);
            renderEvents();
            if (focusSelector) document.querySelector(focusSelector)?.focus();
        }

        function focusEvent(id) {
            let card = $(`evento-${id}`);
            if (!card && EVENTS.some((e) => e.id === id)) {
                state.events = { ...DEFAULT_EVENT_FILTERS };
                renderEvents();
                card = $(`evento-${id}`);
            }
            if (!card) {
                $('eventsCount').textContent = t('eventsGone');
                return;
            }
            history.replaceState(null, '', `${location.pathname}?${eventsQuery()}#evento-${id}`);
            card.querySelector('details').open = true;
            card.classList.add('highlight');
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            card.querySelector('.event-title').focus({ preventScroll: true });
        }

        function icsText(e) {
            const esc = (s) => String(s).replace(/\\/g, '\\\\').replace(/[;,]/g, (c) => `\\${c}`).replace(/\n/g, '\\n');
            const fold = (line) => line.match(/.{1,60}/gu).join('\r\n ');
            const stamp = (date) => date.toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
            const place = [e.venue && !e.venueTbc ? e.venue : '', e.city, 'Angola'].filter(Boolean).join(', ');
            let when;
            if (e.time && eventEnd(e) === e.start) {
                // Angola is UTC+1 all year round.
                const start = new Date(`${e.start}T${e.time}:00+01:00`);
                const end = new Date(start.getTime() + (e.hours || 3) * 3600000);
                when = [`DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`];
            } else {
                when = [`DTSTART;VALUE=DATE:${e.start.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(eventEnd(e), 1).replace(/-/g, '')}`];
            }
            const url = e.link || e.source.url;
            return [
                'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ANGOLIVE//Agenda//PT', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
                `UID:${e.id}@angolive`, `DTSTAMP:${stamp(new Date())}`, ...when,
                `SUMMARY:${esc(eventTitle(e))}`, `LOCATION:${esc(place)}`, `DESCRIPTION:${esc(`${e.desc[lang]}\n\n${url}`)}`, `URL:${url}`,
                'END:VEVENT', 'END:VCALENDAR'
            ].map(fold).join('\r\n') + '\r\n';
        }

        function downloadICS(e) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([icsText(e)], { type: 'text/calendar;charset=utf-8' }));
            link.download = `${e.id}.ics`;
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        function shareEvent(e) {
            const base = inNativeApp ? PUBLIC_URL : `${location.origin}${location.pathname}`;
            const url = `${base}?page=events#evento-${e.id}`;
            const text = `${eventTitle(e)} · ${eventDateText(e)} · ${e.city}`;
            if (navigator.share) {
                navigator.share({ title: eventTitle(e), text, url }).catch(() => {});
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(`${text}: ${url}`)}`, '_blank', 'noopener');
            }
        }

        /* ---------- Suggest an event ---------- */

        function openEventSuggest() {
            $('eventForm').reset();
            $('evCities').innerHTML = CITIES.map((c) => `<option value="${c}"></option>`).join('');
            $('evStart').min = luandaToday();
            $('evEnd').min = luandaToday();
            $('evMsg').textContent = '';
            $('evMsg').classList.remove('ok');
            openModal('eventModal');
        }

        async function submitEventSuggestion(event) {
            event.preventDefault();
            const msg = $('evMsg');
            msg.classList.remove('ok');
            const fail = (text, field) => {
                msg.textContent = text;
                field.focus();
            };
            const name = $('evName').value.trim();
            const start = $('evStart').value;
            const end = $('evEnd').value;
            const city = $('evCity').value.trim();
            const link = normalizeUrl($('evLink').value);
            if (!name) return fail(t('evErrName'), $('evName'));
            if (!start) return fail(t('evErrStart'), $('evStart'));
            if (end && end < start) return fail(t('evErrEnd'), $('evEnd'));
            if ((end || start) < luandaToday()) return fail(t('evErrPast'), $(end ? 'evEnd' : 'evStart'));
            if (!city) return fail(t('evErrCity'), $('evCity'));
            if (link === null) return fail(t('recErrUrl', { field: t('evLink') }), $('evLink'));
            const suggestion = {
                name,
                start_date: start,
                end_date: end || null,
                city,
                venue: $('evVenue').value.trim() || null,
                link: link || null,
                details: $('evDetails').value.trim() || null,
                contact: $('evContact').value.trim() || null
            };

            if (supabaseReady()) {
                const button = $('evSubmit');
                button.disabled = true;
                button.textContent = t('sending');
                try {
                    await sbRequest('/rest/v1/event_suggestions', {
                        method: 'POST',
                        headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                        body: JSON.stringify(suggestion)
                    });
                    $('eventForm').reset();
                    msg.textContent = t('evThanks');
                    msg.classList.add('ok');
                } catch {
                    msg.textContent = t('errSend');
                } finally {
                    button.disabled = false;
                    button.textContent = t('evSend');
                }
                return;
            }

            const body = [
                name,
                end ? `${start} – ${end}` : start,
                [suggestion.venue, city].filter(Boolean).join(', '),
                suggestion.link || '',
                '',
                suggestion.details || '',
                suggestion.contact ? `\n${suggestion.contact}` : ''
            ].join('\n');
            window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(t('evEmailSubject'))}&body=${encodeURIComponent(body)}`;
            msg.textContent = t('fixEmailOpened');
            msg.classList.add('ok');
        }

        /* ---------- Recommend a place ---------- */

        function socialRowHTML() {
            return `
                <div class="social-row">
                    <select class="field" aria-label="${t('recSocialNetwork')}">${SOCIAL_NETWORKS.map((n) => `<option>${n}</option>`).join('')}</select>
                    <input class="field" type="url" inputmode="url" maxlength="300" placeholder="https://" aria-label="${t('recSocialLink')}">
                    <button class="remove-btn" type="button" data-remove-social aria-label="${t('recRemove')}">×</button>
                </div>`;
        }

        // Rebuilt on language change, so keep what the person already picked.
        function prepareRecommendForm() {
            const category = $('recCategory').value;
            const city = $('recCity').value;
            $('recCategory').innerHTML = `<option value="">${t('recChoose')}</option>`
                + Object.entries(CATEGORY).map(([key, c]) => `<option value="${key}">${c[lang][0]}</option>`).join('')
                + `<option value="other">${t('recOtherCategory')}</option>`;
            $('recCity').innerHTML = `<option value="">${t('recChoose')}</option>`
                + CITIES.map((c) => `<option value="${c}">${c}</option>`).join('')
                + `<option value="other">${t('recOtherCity')}</option>`;
            $('recCategory').value = category;
            $('recCity').value = city;
            if (!$('recSocialRows').children.length) $('recSocialRows').innerHTML = socialRowHTML();
            $('recUnavailable').hidden = canRecommend();
            $('recSubmit').disabled = !canRecommend();
            const emailOnly = !supabaseReady() && Boolean(CONTACT_EMAIL);
            $('recPhotoUpload').hidden = emailOnly;
            $('recPhotosEmail').hidden = !emailOnly;
            $('recPhotoMsg').textContent = '';
            renderRecPhotos();
        }

        // Photos are shrunk on the phone as soon as they are picked, so sending is quick and problems show up early.
        async function addRecPhotos(files) {
            const msg = $('recPhotoMsg');
            msg.textContent = t('recPhotosPreparing');
            let problem = '';
            for (const file of files) {
                if (recPhotos.length >= MAX_REC_PHOTOS) { problem = t('recErrPhotoMax'); break; }
                if (!file.type.startsWith('image/')) { problem = t('recErrPhotoType', { name: file.name }); continue; }
                try {
                    const blob = await compressPhoto(file);
                    recPhotos.push({ blob, url: URL.createObjectURL(blob) });
                } catch {
                    problem = t('recErrPhotoRead', { name: file.name });
                }
            }
            msg.textContent = problem;
            renderRecPhotos();
        }

        function renderRecPhotos() {
            $('recPhotoList').innerHTML = recPhotos.map((photo, i) => `
                <div class="rec-photo">
                    <img src="${photo.url}" alt="${t('recPhotoN', { n: i + 1 })}">
                    <button type="button" data-remove-photo="${i}" aria-label="${t('recPhotoRemove', { n: i + 1 })}">×</button>
                </div>`).join('');
            $('recPhotoCount').textContent = recPhotos.length ? t('recPhotosCount', { n: recPhotos.length, max: MAX_REC_PHOTOS }) : '';
            $('recPhotoPicker').hidden = recPhotos.length >= MAX_REC_PHOTOS;
            $('recPhotoRightsLabel').hidden = recPhotos.length === 0;
        }

        function clearRecPhotos() {
            recPhotos.forEach((photo) => URL.revokeObjectURL(photo.url));
            recPhotos = [];
            $('recPhotoMsg').textContent = '';
            renderRecPhotos();
        }

        async function uploadRecPhotos(button) {
            const folder = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
            const paths = [];
            for (let i = 0; i < recPhotos.length; i++) {
                button.textContent = t('recUploading', { n: i + 1, total: recPhotos.length });
                const path = `${folder}/${i + 1}.jpg`;
                await sbRequest(`/storage/v1/object/recommendations/${path}`, {
                    method: 'POST',
                    headers: sbHeaders({ 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }),
                    body: recPhotos[i].blob
                });
                paths.push(path);
            }
            return paths;
        }

        // Accepts "instagram.com/x" as well as full links; returns '' when empty and null when invalid.
        function normalizeUrl(raw) {
            const value = raw.trim();
            if (!value) return '';
            try {
                const url = new URL(/^https?:\/\//i.test(value) ? value : `https://${value}`);
                return /^https?:$/.test(url.protocol) && url.hostname.includes('.') ? url.href : null;
            } catch {
                return null;
            }
        }

        function recFail(text, field) {
            $('recMsg').textContent = text;
            field?.focus();
            return null;
        }

        function collectRecommendation() {
            const name = $('recName').value.trim();
            const category = $('recCategory').value;
            const cityChoice = $('recCity').value;
            const city = cityChoice === 'other' ? $('recCityOther').value.trim() : cityChoice;
            const email = $('recEmail').value.trim();
            if (!name) return recFail(t('recErrName'), $('recName'));
            if (!category) return recFail(t('recErrCategory'), $('recCategory'));
            if (!city) return recFail(t('recErrCity'), cityChoice === 'other' ? $('recCityOther') : $('recCity'));
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return recFail(t('recErrEmail'), $('recEmail'));

            const links = {};
            for (const [id, label] of [['recWebsite', 'recWebsite'], ['recPress', 'recPress'], ['recOtherUrl', 'recOtherLink']]) {
                const url = normalizeUrl($(id).value);
                if (url === null) return recFail(t('recErrUrl', { field: t(label) }), $(id));
                links[id] = url;
            }
            const social = [];
            for (const row of $('recSocialRows').querySelectorAll('.social-row')) {
                const input = row.querySelector('input');
                const network = row.querySelector('select').value;
                const url = normalizeUrl(input.value);
                if (url === null) return recFail(t('recErrUrl', { field: network }), input);
                if (url) social.push({ network, url });
            }
            if (recPhotos.length && !$('recPhotoRights').checked) return recFail(t('recErrPhotoRights'), $('recPhotoRights'));
            if (!$('recConsent').checked) return recFail(t('recErrConsent'), $('recConsent'));

            const optional = (id) => $(id).value.trim() || null;
            return {
                name,
                category,
                city,
                address: optional('recAddress'),
                phone: optional('recPhone'),
                email: email || null,
                website: links.recWebsite || null,
                press_link: links.recPress || null,
                social_links: social,
                other_link: links.recOtherUrl ? { name: optional('recOtherName'), url: links.recOtherUrl } : null,
                reason: optional('recReason'),
                relationship: document.querySelector('input[name="recRelation"]:checked').value,
                contact: optional('recContact')
            };
        }

        function recommendationText(rec) {
            const categoryLabel = CATEGORY[rec.category] ? CATEGORY[rec.category].pt[0] : 'Outra';
            return [
                `Nome: ${rec.name}`,
                `Categoria: ${categoryLabel}`,
                `Cidade: ${rec.city}`,
                rec.address && `Morada: ${rec.address}`,
                rec.phone && `Telefone: ${rec.phone}`,
                rec.email && `Email: ${rec.email}`,
                rec.website && `Website: ${rec.website}`,
                rec.press_link && `Artigo: ${rec.press_link}`,
                ...rec.social_links.map((s) => `${s.network}: ${s.url}`),
                rec.other_link && `${rec.other_link.name || 'Link'}: ${rec.other_link.url}`,
                rec.reason && `\nPorquê: ${rec.reason}`,
                `\nQuem recomenda: ${rec.relationship === 'owner' ? 'dono ou funcionário' : 'cliente ou visitante'}`,
                rec.contact && `Contacto: ${rec.contact}`
            ].filter(Boolean).join('\n');
        }

        function showRecommendThanks(key, name) {
            $('recForm').hidden = true;
            $('recSuccess').hidden = false;
            $('recThanksText').textContent = t(key, { name });
            $('recSuccess').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function submitRecommend(event) {
            event.preventDefault();
            $('recMsg').textContent = '';
            if (!canRecommend()) return;
            const rec = collectRecommendation();
            if (!rec) return;

            if (supabaseReady()) {
                const button = $('recSubmit');
                button.disabled = true;
                button.textContent = t('sending');
                try {
                    rec.photos = await uploadRecPhotos(button);
                    button.textContent = t('sending');
                    await sbRequest('/rest/v1/recommendations', {
                        method: 'POST',
                        headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
                        body: JSON.stringify(rec)
                    });
                    clearRecPhotos();
                    showRecommendThanks('recThanksSent', rec.name);
                } catch {
                    $('recMsg').textContent = t('errSend');
                } finally {
                    button.disabled = false;
                    button.textContent = t('recSubmit');
                }
                return;
            }

            window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(t('recEmailSubject'))}&body=${encodeURIComponent(recommendationText(rec))}`;
            showRecommendThanks('recThanksEmail', rec.name);
        }

        function resetRecommendForm() {
            $('recForm').reset();
            clearRecPhotos();
            $('recSocialRows').innerHTML = socialRowHTML();
            $('recCityOtherGroup').hidden = true;
            $('recMsg').textContent = '';
            $('recForm').hidden = false;
            $('recSuccess').hidden = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            $('recName').focus();
        }

        function renderFooter() {
            $('footerPrivacy').hidden = !CONTACT_EMAIL;
            $('footerContact').hidden = !CONTACT_EMAIL;
            if (CONTACT_EMAIL) $('footerContact').href = `mailto:${CONTACT_EMAIL}`;
            $('footerFix').hidden = !canSuggestFix();
            $('footerRecommend').hidden = !canRecommend();
        }

        /* ---------- Modals ---------- */

        function openModal(id) {
            const modal = $(id);
            if (modal.classList.contains('open')) return;
            lastFocus = document.activeElement;
            modal.classList.add('open');
            document.body.classList.add('no-scroll');
            modal.querySelector('.modal-panel').scrollTop = 0;
            modal.querySelector('.close-btn')?.focus();
        }

        function closeModal(id, { updateURL = true } = {}) {
            $(id).classList.remove('open');
            if (!document.querySelector('.modal.open')) document.body.classList.remove('no-scroll');
            if (id === 'venueModal') {
                state.openId = null;
                if (updateURL) history.replaceState(null, '', location.pathname + location.search);
            }
            if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
        }

        /* ---------- Theme and language ---------- */

        function effectiveTheme() {
            return document.documentElement.dataset.theme
                || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function applyTheme(theme) {
            if (theme) document.documentElement.dataset.theme = theme;
            const dark = effectiveTheme() === 'dark';
            $('themeIcon').innerHTML = icon(dark ? 'sun' : 'moon');
            $('themeLabel').textContent = dark ? t('light') : t('dark');
            $('themeBtn').setAttribute('aria-label', dark ? t('lightAria') : t('darkAria'));
        }

        function applyLanguage() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
            document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
            $('langLabel').textContent = t('langOther');
            $('langBtn').setAttribute('aria-label', t('langAria'));
            $('venueModal').setAttribute('aria-label', t('detailsAria'));
            renderWhereOptions();
            renderSortOptions();
            renderFooter();
            renderAccountButton();
            prepareRecommendForm();
            applyTheme();
            render();
            renderInstallBanner();
            if ($('notice').textContent) setNotice('');
            if (state.openId) openVenue(state.openId, true);
        }

        /* ---------- Install and offline ---------- */

        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

        function renderInstallBanner() {
            const banner = $('installBanner');
            const show = !inNativeApp && !isStandalone() && !store.get('angoliveInstallDismissed', false) && (installPrompt || isIOS);
            banner.hidden = !show;
            if (!show) return;
            banner.innerHTML = `
                <p>${installPrompt ? t('installText') : t('iosText')}</p>
                <div class="banner-actions">
                    ${installPrompt ? `<button class="top-btn solid" type="button" id="installBtn">${icon('download')}${t('install')}</button>` : ''}
                    <button class="top-btn" type="button" id="dismissInstallBtn">${installPrompt ? t('notNow') : t('ok')}</button>
                </div>
            `;
        }

        function updateOnline() {
            $('offlineBanner').hidden = navigator.onLine;
        }

        /* ---------- Wiring ---------- */

        $('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            showResults({ q: $('qInput').value.trim().slice(0, 80), where: $('whereSelect').value });
        });

        $('sortSelect').addEventListener('change', (e) => {
            state.sort = e.target.value;
            if (state.sort === 'distance' && !state.userPos) locate();
            renderResults();
        });

        $('savedBtn').addEventListener('click', () => showResults({ saved: true }));
        $('accountBtn').addEventListener('click', () => openAuth());
        $('authContent').addEventListener('submit', submitAuth);
        $('authContent').addEventListener('click', (e) => {
            const toggle = e.target.closest('[data-toggle-password]');
            if (toggle) {
                const input = $('authPassword');
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                toggle.textContent = show ? t('authHide') : t('authShow');
                toggle.setAttribute('aria-pressed', String(show));
                return;
            }
            const view = e.target.closest('[data-auth-view]');
            if (view) {
                renderAuth(view.dataset.authView, { email: $('authEmail')?.value.trim() || '' });
                $('authContent').querySelector('input:not([type="checkbox"])')?.focus();
            }
        });

        document.addEventListener('click', (e) => {
            const target = e.target;
            const open = target.closest('[data-open]');
            if (open) { openVenue(Number(open.dataset.open)); return; }
            const quick = target.closest('[data-quick]');
            if (quick) {
                const key = quick.dataset.quick;
                if (state.view === 'results' && state.filters.quick === key) goHome();
                else showResults({ quick: key, q: $('qInput').value.trim(), where: $('whereSelect').value === 'near' ? '' : $('whereSelect').value });
                return;
            }
            const category = target.closest('[data-category]');
            if (category) { showResults({ category: category.dataset.category }); return; }
            const collection = target.closest('[data-collection]');
            if (collection) { showResults({ collection: collection.dataset.collection }); return; }
            const more = target.closest('[data-more]');
            if (more) { showResults(JSON.parse(more.dataset.more)); return; }
            const scroller = target.closest('[data-scroll]');
            if (scroller) {
                const row = scroller.parentElement.querySelector('.card-row');
                row.scrollBy({ left: Number(scroller.dataset.scroll) * row.clientWidth * 0.9, behavior: 'smooth' });
                return;
            }
            const info = target.closest('[data-info]');
            if (info) { openInfo(info.dataset.info); return; }
            const fix = target.closest('[data-fix]');
            if (fix) { openFix(Number(fix.dataset.fix)); return; }
            const eventOpen = target.closest('[data-event-open]');
            if (eventOpen) { showEvents(); focusEvent(eventOpen.dataset.eventOpen); return; }
            const whenChip = target.closest('[data-events-when]');
            if (whenChip) { setEventFilters({ when: whenChip.dataset.eventsWhen }, `[data-events-when="${whenChip.dataset.eventsWhen}"]`); return; }
            const typeChip = target.closest('[data-events-type]');
            if (typeChip) { setEventFilters({ type: typeChip.dataset.eventsType }, `[data-events-type="${typeChip.dataset.eventsType}"]`); return; }
            if (target.closest('[data-events-reset]')) { setEventFilters({ ...DEFAULT_EVENT_FILTERS }, '[data-events-when="all"]'); return; }
            const ics = target.closest('[data-event-ics]');
            if (ics) { downloadICS(EVENTS.find((e) => e.id === ics.dataset.eventIcs)); return; }
            const shareBtn = target.closest('[data-event-share]');
            if (shareBtn) { shareEvent(EVENTS.find((e) => e.id === shareBtn.dataset.eventShare)); return; }
            const action = target.closest('[data-action]');
            if (action?.dataset.action === 'home') { goHome(); return; }
            if (action?.dataset.action === 'events') {
                document.querySelectorAll('.modal.open').forEach((m) => closeModal(m.id));
                showEvents();
                return;
            }
            if (action?.dataset.action === 'suggest-event') { openEventSuggest(); return; }
            const authOpen = target.closest('[data-auth-open]');
            if (authOpen) {
                const reason = target.closest('.signin-prompt')?.querySelector('p')?.textContent || '';
                openAuth(authOpen.dataset.authOpen, { reason });
                return;
            }
            if (action?.dataset.action === 'signout') { signOut(); return; }
            if (action?.dataset.action === 'delete-account') { deleteAccount(action); return; }
            if (action?.dataset.action === 'show-saved') { closeModal('authModal'); showResults({ saved: true }); return; }
            if (action?.dataset.action === 'clear') { goHome(); $('qInput').focus(); return; }
            if (action?.dataset.action === 'recommend') {
                document.querySelectorAll('.modal.open').forEach((m) => closeModal(m.id));
                showRecommend();
                return;
            }
            const closer = target.closest('[data-close]');
            if (closer) { closeModal(closer.dataset.close); return; }
            if (target.classList.contains('modal')) closeModal(target.id);
        });

        // Scroll events do not bubble, so listen in the capture phase for every card row.
        document.addEventListener('scroll', (e) => {
            if (e.target.classList?.contains('card-row')) updateRowControls(e.target);
        }, { capture: true, passive: true });

        window.addEventListener('resize', () => document.querySelectorAll('.card-row').forEach(updateRowControls));

        $('brandLink').addEventListener('click', (e) => { e.preventDefault(); goHome(); });

        $('venuePanel').addEventListener('click', (e) => {
            const star = e.target.closest('.star-btn');
            if (star) { state.rating = Number(star.dataset.star); updateStars(); return; }
            const thumb = e.target.closest('.photo-thumb');
            if (thumb) { showPhoto(Number(thumb.dataset.photo)); return; }
            const report = e.target.closest('[data-report], [data-report-review]');
            if (report) { reportSubmission(report); return; }
            if (e.target.closest('[data-action="reviews"]')) { $('reviewsSection').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
            if (e.target.closest('#favBtn')) toggleFavorite();
            else if (e.target.closest('#shareBtn')) shareVenue();
        });

        $('venuePanel').addEventListener('change', (e) => {
            if (e.target.name !== 'mediaKind') return;
            const isPhoto = e.target.value === 'photo';
            $('photoField').hidden = !isPhoto;
            $('videoField').hidden = isPhoto;
            $('mediaMsg').textContent = '';
        });

        $('venuePanel').addEventListener('submit', (e) => {
            if (e.target.id === 'reviewForm') submitReview(e);
            else if (e.target.id === 'mediaForm') submitMedia(e);
        });

        $('fixForm').addEventListener('submit', submitFix);
        $('eventForm').addEventListener('submit', submitEventSuggestion);
        $('eventsWhere').addEventListener('change', (e) => setEventFilters({ where: e.target.value }, '#eventsWhere'));

        $('recForm').addEventListener('submit', submitRecommend);
        $('recCity').addEventListener('change', (e) => { $('recCityOtherGroup').hidden = e.target.value !== 'other'; });
        $('recAnother').addEventListener('click', resetRecommendForm);
        $('recSocialAdd').addEventListener('click', () => {
            const rows = $('recSocialRows');
            if (rows.children.length >= MAX_SOCIAL_LINKS) return;
            rows.insertAdjacentHTML('beforeend', socialRowHTML());
            rows.lastElementChild.querySelector('select').focus();
        });
        $('recPhotoInput').addEventListener('change', async (e) => {
            const files = [...e.target.files];
            e.target.value = '';
            await addRecPhotos(files);
        });
        $('recPhotoList').addEventListener('click', (e) => {
            const remove = e.target.closest('[data-remove-photo]');
            if (!remove) return;
            const [photo] = recPhotos.splice(Number(remove.dataset.removePhoto), 1);
            URL.revokeObjectURL(photo.url);
            renderRecPhotos();
        });
        $('recSocialRows').addEventListener('click', (e) => {
            const remove = e.target.closest('[data-remove-social]');
            if (!remove) return;
            const rows = $('recSocialRows');
            if (rows.children.length > 1) remove.closest('.social-row').remove();
            else remove.closest('.social-row').querySelector('input').value = '';
        });

        $('installBanner').addEventListener('click', async (e) => {
            if (e.target.closest('#installBtn') && installPrompt) {
                installPrompt.prompt();
                await installPrompt.userChoice.catch(() => {});
                installPrompt = null;
                renderInstallBanner();
            } else if (e.target.closest('#dismissInstallBtn')) {
                store.set('angoliveInstallDismissed', true);
                renderInstallBanner();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            const open = [...document.querySelectorAll('.modal.open')].pop();
            if (open) closeModal(open.id);
        });

        $('themeBtn').addEventListener('click', () => {
            const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
            store.set('angoliveTheme', next);
            applyTheme(next);
        });

        $('langBtn').addEventListener('click', () => {
            lang = lang === 'pt' ? 'en' : 'pt';
            store.set('angoliveLang', lang);
            applyLanguage();
        });

        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());
        window.addEventListener('popstate', applyURL);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            installPrompt = e;
            renderInstallBanner();
        });

        window.addEventListener('appinstalled', () => {
            installPrompt = null;
            store.set('angoliveInstallDismissed', true);
            renderInstallBanner();
        });

        window.addEventListener('online', updateOnline);
        window.addEventListener('offline', updateOnline);

        // Earlier versions kept a profile (with email) and device-only reviews; neither is used any more.
        store.remove('angoliveUser');
        store.remove('reviews');

        document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon); });
        const storedTheme = store.get('angoliveTheme', null);
        if (storedTheme) document.documentElement.dataset.theme = storedTheme;
        applyLanguage();
        updateOnline();
        loadRatingStats();
        consumeAuthRedirect().then(() => {
            if (signedIn()) accessToken().then(syncFavorites);
        });
        applyURL();

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('sw.js')
                .then(() => navigator.serviceWorker.ready)
                .then((reg) => reg.active?.postMessage({ type: 'warm-images', urls: venues.map(thumbSrc).filter(Boolean) }))
                .catch(() => {});
        }
    </script>
</body>
</html>

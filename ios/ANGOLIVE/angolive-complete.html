    <style>
        :root {
            --primary: #CE1126;
            --primary-strong: #A50E1F;
            --primary-soft: rgba(206, 17, 38, 0.08);
            --accent: #FFD100;
            --accent-ink: #1a1a1a;
            --bg: #F6F6F7;
            --surface: #FFFFFF;
            --surface-2: #F1F1F3;
            --text: #161618;
            --muted: #55555D;
            --border: #DADADF;
            --ok: #127A3E;
            --overlay: rgba(0, 0, 0, 0.6);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary: #EF4458;
                --primary-strong: #F2606F;
                --primary-soft: rgba(239, 68, 88, 0.14);
                --bg: #0E0E10;
                --surface: #18181B;
                --surface-2: #222226;
                --text: #F2F2F4;
                --muted: #B4B4BC;
                --border: #34343A;
                --ok: #4ADE80;
                --overlay: rgba(0, 0, 0, 0.75);
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --primary: #EF4458;
            --primary-strong: #F2606F;
            --primary-soft: rgba(239, 68, 88, 0.14);
            --bg: #0E0E10;
            --surface: #18181B;
            --surface-2: #222226;
            --text: #F2F2F4;
            --muted: #B4B4BC;
            --border: #34343A;
            --ok: #4ADE80;
            --overlay: rgba(0, 0, 0, 0.75);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-size: 16px;
            line-height: 1.45;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body.no-scroll { overflow: hidden; }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }
        a { color: inherit; }
        [hidden] { display: none !important; }

        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        .icon {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-icon] { display: inline-flex; }

        /* Header */
        .topbar { background: var(--surface); padding: 12px 0 4px; }
        .topbar-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }

        .top-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .top-btn:hover { background: var(--primary-soft); }
        .top-btn.solid { background: var(--primary); color: #fff; }
        .top-btn.solid:hover { background: var(--primary-strong); }

        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px auto 0; text-decoration: none; width: fit-content; }
        .brand-logo { width: 96px; height: 45px; display: block; }
        .brand-logo .wave-red { stroke: var(--primary); }
        .brand-logo .wave-yellow { stroke: var(--accent); }
        .brand-logo .dot { fill: var(--text); }

        .brand-name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, var(--primary) 0%, var(--text) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hero and search */
        .hero { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 0 16px; }
        .hero h1 { font-size: 34px; line-height: 1.15; font-weight: 800; text-align: center; }
        .hero-sub { text-align: center; color: var(--muted); font-size: 17px; margin: 8px auto 0; max-width: 560px; }

        .search-card {
            display: grid;
            grid-template-columns: 1.4fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin: 18px auto 0;
            max-width: 880px;
            padding: 14px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 16px;
        }

        .search-field { display: grid; gap: 6px; }
        .field-label { font-size: 15px; font-weight: 700; }
        .input-wrap { position: relative; display: block; }
        .input-wrap [data-icon] { position: absolute; left: 14px; top: 0; bottom: 0; align-items: center; color: var(--muted); pointer-events: none; }
        .input-wrap .field { padding-left: 44px; }

        .field {
            display: block;
            width: 100%;
            min-height: 50px;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            font-size: 16px;
        }

        .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

        .submit-btn {
            min-height: 50px;
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .submit-btn:hover { background: var(--primary-strong); }
        .submit-btn.secondary { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--border); }

        .chips { display: flex; gap: 8px; margin: 14px auto 0; max-width: 880px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        .chips::-webkit-scrollbar { display: none; }

        .chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
        }

        .chip .icon { width: 18px; height: 18px; }
        .chip:hover { background: var(--primary-soft); }
        .chip.active { background: var(--primary); color: #fff; }

        .notice { font-size: 15px; color: var(--primary); font-weight: 600; margin: 10px auto 0; max-width: 880px; }
        .notice:empty { display: none; }

        /* Banners */
        .banner {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--primary);
            background: var(--primary-soft);
            font-size: 15px;
        }

        .banner p { flex: 1 1 240px; }
        .banner-actions { display: flex; gap: 8px; }

        /* Home sections */
        main { padding-bottom: 56px; }
        .home-section { margin-top: 30px; }
        .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .section-head h2 { font-size: 22px; line-height: 1.25; font-weight: 800; }
        .section-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }

        .link-btn {
            flex: none;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            min-height: 44px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .card-row {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(270px, 300px);
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 12px 2px 6px;
            scrollbar-width: thin;
        }

        .card-row > * { scroll-snap-align: start; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 12px; }

        .prompt-card {
            margin-top: 12px;
            padding: 18px;
            border-radius: 16px;
            border: 1.5px dashed var(--border);
            background: var(--surface);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .prompt-card p { flex: 1 1 260px; }
        .prompt-card .hint { margin-top: 4px; }

        .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            min-height: 96px;
            padding: 14px;
            text-align: left;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
        }

        .tile:hover { border-color: var(--primary); }
        .tile .icon { width: 26px; height: 26px; color: var(--primary); }
        .tile-label { font-size: 17px; font-weight: 700; }
        .tile-count { font-size: 14px; color: var(--muted); }

        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }

        .collection {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 150px;
            padding: 14px;
            border: none;
            border-radius: 16px;
            overflow: hidden;
            text-align: left;
            color: #fff;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        }

        .collection img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .collection::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.75) 100%); }
        .collection > span { position: relative; z-index: 1; }
        .collection-title { font-size: 19px; font-weight: 800; line-height: 1.2; }
        .collection-desc { font-size: 14px; opacity: 0.95; margin-top: 4px; }

        /* Place cards */
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .card-media {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px;
            padding: 0;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: #fff;
            font-size: 30px;
            font-weight: 800;
        }

        .card-media img, .modal-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .saved-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .saved-tag .icon { width: 14px; height: 14px; fill: currentColor; }

        .card-body { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; flex: 1; }
        .card-type { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--primary); }
        .card-type .icon { width: 16px; height: 16px; }
        .card-name { font-size: 19px; font-weight: 800; line-height: 1.2; }
        .card-name button { background: none; border: none; padding: 0; text-align: left; font-weight: inherit; }
        .card-facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
        .card-facts strong { color: var(--text); }
        .card-highlight { font-size: 15px; }
        .card-reason { font-size: 15px; }
        .card-reason b { color: var(--primary); }
        .card-verified { font-size: 13px; color: var(--muted); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 6px; }
        .card-actions .action-btn { font-size: 14px; padding: 0 8px; white-space: nowrap; }
        .card-actions .action-btn:only-child { grid-column: 1 / -1; }
        .price-note { display: inline-block; margin-top: 4px; font-size: 14px; color: var(--muted); }

        .rating {
            display: inline-block;
            background: var(--accent);
            color: var(--accent-ink);
            padding: 1px 8px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 800;
        }

        .status-open { color: var(--ok); font-weight: 700; }
        .status-closed { color: var(--primary); font-weight: 700; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1.5px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .action-btn:hover { background: var(--primary-soft); }
        .action-btn.solid { background: var(--primary); color: #fff; }
        .action-btn.solid:hover { background: var(--primary-strong); }
        .action-btn.wide { grid-column: 1 / -1; min-height: 56px; font-size: 17px; }
        .action-btn.saved .icon { fill: currentColor; }

        /* Results */
        .results-head { margin-top: 22px; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--primary); font-weight: 700; font-size: 16px; min-height: 44px; padding: 0; }
        .results-head h2 { font-size: 26px; line-height: 1.2; font-weight: 800; }
        .results-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
        .results-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .results-tools .field { width: auto; min-width: 220px; }
        .results-count { font-size: 15px; color: var(--muted); }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 16px;
            padding: 40px 16px;
            border: 1.5px dashed var(--border);
            border-radius: 16px;
        }

        .hint { font-size: 14px; color: var(--muted); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; z-index: 100; padding: 16px; background: var(--overlay); align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-panel { position: relative; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 18px; }
        .profile-panel { max-width: 440px; padding: 28px 22px 22px; }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--text);
            font-size: 26px;
            line-height: 1;
            box-shadow: var(--shadow);
        }

        .modal-hero {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 240px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: #fff;
            font-size: 52px;
            font-weight: 800;
        }

        .photo-badge { position: absolute; left: 12px; bottom: 12px; z-index: 1; background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
        .photo-meta { padding: 10px 20px 0; }
        .photo-credit { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
        .photo-credit a { color: inherit; }
        .photo-strip { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
        .photo-thumb { flex: 0 0 76px; height: 56px; padding: 0; border-radius: 10px; overflow: hidden; border: 3px solid transparent; background: var(--surface-2); }
        .photo-thumb.active { border-color: var(--primary); }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
        .modal-name { font-size: 26px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
        .modal-sub { display: flex; gap: 12px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 15px; font-weight: 600; }

        .rating-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .section-title { font-size: 18px; font-weight: 800; color: var(--primary); }
        .section-content { font-size: 16px; color: var(--muted); margin-top: 6px; }

        .facts { margin-top: 10px; border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; }
        .fact { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 12px 14px; font-size: 15px; }
        .fact + .fact { border-top: 1px solid var(--border); }
        .fact dt { font-weight: 700; }
        .fact dd { color: var(--muted); overflow-wrap: anywhere; }
        .fact dd a { color: var(--primary); font-weight: 600; }
        .week { list-style: none; margin-top: 6px; }
        .week li { display: flex; justify-content: space-between; gap: 12px; }
        .week li.today { color: var(--text); font-weight: 700; }

        .map-frame { display: block; width: 100%; height: 200px; border: 0; border-radius: 12px; margin-top: 8px; background: var(--surface-2); }
        .text-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--primary); font-weight: 700; min-height: 44px; }
        .coords { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: var(--muted); }

        .highlight-box { background: var(--primary-soft); border-radius: 12px; padding: 12px 14px; font-weight: 600; margin-top: 8px; }

        .social { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

        .social a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1.5px solid var(--primary);
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .social a:hover { background: var(--primary-soft); }

        .panel { background: var(--surface-2); border-radius: 14px; padding: 14px; margin-top: 10px; }

        .menu-group + .menu-group { margin-top: 16px; }
        .menu-group-title { font-size: 15px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 12px; }
        .menu-item + .menu-item { margin-top: 6px; }
        .menu-item-name { font-size: 15px; font-weight: 700; }
        .menu-item-desc { font-size: 14px; color: var(--muted); }
        .menu-item-price { font-size: 15px; font-weight: 800; color: var(--primary); white-space: nowrap; }

        .avg { text-align: center; padding: 6px 0 14px; }
        .avg-number { font-size: 34px; font-weight: 800; color: var(--primary); }
        .stars { color: #E0A800; font-size: 18px; letter-spacing: 2px; }
        .avg-count { font-size: 14px; color: var(--muted); }
        .external-reviews { margin-bottom: 14px; }

        .review-form { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; }
        .review-form-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .review-form .field { margin-bottom: 10px; }
        .star-input { display: flex; gap: 2px; margin-bottom: 8px; }
        .star-btn { width: 48px; height: 48px; background: none; border: none; font-size: 34px; line-height: 1; color: var(--muted); }
        .star-btn.on { color: #E0A800; }
        textarea.field { min-height: 96px; resize: vertical; }
        .review-form .submit-btn { width: 100%; }

        .form-msg { font-size: 15px; font-weight: 600; color: var(--primary); min-height: 22px; margin: 4px 0 8px; }
        .form-msg.ok { color: var(--ok); }

        .review { background: var(--surface); border-left: 4px solid var(--primary); border-radius: 10px; padding: 12px; margin-top: 10px; }
        .review-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
        .review-name { font-weight: 700; }
        .review-date { color: var(--muted); }
        .review-text { font-size: 15px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .report-btn { background: none; border: none; color: var(--primary); font-size: 14px; font-weight: 600; min-height: 40px; padding: 0 10px; }

        .visitor-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }

        .media-kind { display: flex; gap: 18px; margin-bottom: 8px; font-size: 16px; }

        .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--muted); margin: 4px 0 6px; }
        .consent input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--primary); }

        .count-pill { display: inline-block; min-width: 24px; padding: 0 7px; border-radius: 999px; background: #fff; color: var(--primary); font-size: 13px; line-height: 22px; text-align: center; }

        .row-wrap { position: relative; }
        .row-nav { display: none; }
        .card-row.fade-end { -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }

        .empty-block { margin-top: 12px; padding: 22px 16px; border: 1.5px dashed var(--border); border-radius: 16px; background: var(--surface); }
        .empty-block > p { font-size: 17px; font-weight: 700; }
        .empty-block .hint { margin-top: 14px; font-weight: 400; }
        .empty-block .submit-btn { margin-top: 12px; }

        .fix-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: none; border: none; padding: 0; min-height: 44px; color: var(--primary); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

        .site-footer { margin-top: 48px; padding: 24px 0 36px; background: var(--surface); border-top: 1px solid var(--border); }
        .footer-links { display: flex; flex-wrap: wrap; gap: 4px 18px; }
        .footer-link { background: none; border: none; padding: 0; min-height: 44px; display: inline-flex; align-items: center; color: var(--text); font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
        .footer-note { margin-top: 10px; font-size: 13px; color: var(--muted); }

        .info-panel { max-width: 560px; padding: 28px 22px 22px; }
        .info-title { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 10px; padding-right: 44px; }
        .info-panel p + p { margin-top: 10px; }
        .info-list { margin: 12px 0 0 20px; display: grid; gap: 10px; color: var(--muted); }
        .info-list strong { color: var(--text); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        #fixForm { margin-top: 14px; }

        .rec-page { max-width: 760px; margin: 0 auto; padding-top: 12px; }
        .rec-title { font-size: 32px; line-height: 1.15; font-weight: 800; margin-top: 6px; }
        .rec-intro { font-size: 17px; margin-top: 8px; }
        .rec-page > .hint { margin-top: 6px; }
        .rec-form { margin-top: 18px; display: grid; gap: 16px; }
        .rec-group { border: 1.5px solid var(--border); border-radius: 16px; padding: 14px 16px 6px; background: var(--surface); }
        .rec-group legend { padding: 0 6px; font-size: 18px; font-weight: 800; color: var(--primary); }
        .rec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
        .rec-wide { grid-column: 1 / -1; }
        .rec-group .form-group .hint { display: block; margin-top: 4px; }
        .rec-group > .form-group:first-of-type { margin-top: 6px; }
        .rec-relation { flex-wrap: wrap; }
        .rec-sub { margin: 10px 0 8px; }
        .social-row { display: grid; grid-template-columns: 170px 1fr 50px; gap: 8px; margin-bottom: 8px; }
        .social-row.other-row { grid-template-columns: 170px 1fr; margin-bottom: 12px; }
        .remove-btn { min-height: 50px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 22px; line-height: 1; }
        #recSocialAdd { display: inline-flex; align-items: center; gap: 6px; }
        .rec-form .submit-btn { width: 100%; }
        .rec-photos-hint { margin: 6px 0 12px; }
        .photo-picker {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 50px;
            padding: 0 18px;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .photo-picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .photo-picker:focus-within { outline: 3px solid var(--primary); outline-offset: 2px; }
        .rec-photo-count { margin-left: 10px; }
        .photo-picker[hidden] + .rec-photo-count { margin-left: 0; }
        .rec-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
        .rec-photos:empty { display: none; }
        .rec-photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
        .rec-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .rec-photo button { position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 22px; line-height: 1; }
        .rec-form .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .rec-success { margin-top: 18px; padding: 22px; border-radius: 16px; border: 1.5px solid var(--ok); background: var(--surface); }
        .rec-success h2 { font-size: 24px; font-weight: 800; color: var(--ok); }
        .rec-success p { margin: 8px 0 16px; font-size: 16px; }
        .rec-success .banner-actions { flex-wrap: wrap; }

        .home-cta { margin-top: 30px; padding: 20px; border-radius: 16px; background: var(--primary-soft); border: 1.5px solid var(--primary); display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
        .home-cta h2 { font-size: 20px; font-weight: 800; }
        .home-cta p { color: var(--muted); margin-top: 4px; }

        /* Accounts */
        .password-wrap { position: relative; }
        .password-wrap .field { padding-right: 104px; }
        .password-wrap .link-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
        .auth-switch { margin-top: 10px; text-align: center; font-size: 15px; }
        .auth-reason { margin: 10px 0 4px; padding: 12px 14px; border-radius: 12px; background: var(--primary-soft); font-weight: 600; }
        .auth-notice { margin: 10px 0 0; }
        .signin-prompt { margin-top: 14px; padding: 16px; border-radius: 14px; border: 1.5px dashed var(--primary); background: var(--primary-soft); }
        .signin-prompt p { font-weight: 600; margin-bottom: 10px; }
        .signin-prompt .banner-actions { flex-wrap: wrap; }
        .account-facts { margin-top: 12px; }
        .contrib-list { list-style: none; display: grid; gap: 8px; margin-top: 8px; }
        .contrib-list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; }
        .contrib-status { font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--muted); }
        .contrib-status.approved, .contrib-status.done { color: var(--ok); }
        .contrib-status.rejected, .contrib-status.hidden { color: var(--primary); }
        .account-name-form { margin-top: 18px; }
        .danger-zone { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--border); }
        .danger-zone summary { display: flex; align-items: center; min-height: 44px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .danger-zone p { font-size: 15px; margin: 6px 0 10px; }
        .submit-btn.danger { width: 100%; background: #8B0B19; }

        /* Agenda */
        .events-page { max-width: 900px; margin: 0 auto; padding-top: 12px; }
        .events-filters { display: grid; gap: 14px; margin-top: 18px; padding: 16px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface); }
        .events-filters .field { max-width: 320px; margin-top: 6px; }
        .events-filters .chips { margin: 8px 0 0; max-width: none; flex-wrap: wrap; overflow: visible; }
        .chip-count { font-weight: 600; opacity: 0.85; }
        .events-count { margin-top: 18px; font-size: 15px; font-weight: 700; color: var(--muted); }
        .event-month { margin-top: 18px; }
        .event-month h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .event-list { display: grid; gap: 12px; }
        .event-card { display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding: 14px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); scroll-margin-top: 16px; }
        .event-photo { grid-column: 1 / -1; margin: -14px -14px 0; }
        .event-photo img { display: block; width: 100%; aspect-ratio: 16 / 7; object-fit: cover; border-radius: 15px 15px 0 0; background: var(--surface-2); }
        .event-photo figcaption { padding: 6px 14px 0; font-size: 12px; color: var(--muted); }
        .event-card.highlight { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        .date-block { display: flex; flex-direction: column; align-items: center; height: fit-content; padding: 8px 4px; border-radius: 12px; background: var(--primary); color: #fff; text-align: center; line-height: 1.1; }
        .db-month { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
        .db-day { font-size: 30px; font-weight: 800; }
        .db-to { font-size: 12px; font-weight: 700; margin-top: 2px; }
        .event-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .event-title { font-size: 19px; font-weight: 800; line-height: 1.25; }
        .event-title:focus { outline: none; }
        .event-badges { display: flex; flex-wrap: wrap; gap: 6px; }
        .event-badges:empty { display: none; }
        .event-badge { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--surface-2); }
        .event-badge.live { background: var(--accent); color: var(--accent-ink); }
        .event-badge.tbc { color: var(--primary); border: 1px solid var(--primary); }
        .event-meta { display: grid; gap: 4px; list-style: none; font-size: 15px; }
        .event-meta li { display: flex; gap: 8px; align-items: flex-start; }
        .event-meta .icon { width: 18px; height: 18px; margin-top: 2px; color: var(--muted); }
        .event-tags { font-size: 14px; color: var(--muted); }
        .event-details summary { display: flex; align-items: center; min-height: 44px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .event-details p, .event-details ul { font-size: 15px; margin-top: 6px; }
        .event-details ul { padding-left: 20px; }
        .event-source { color: var(--muted); }
        .event-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 4px; }
        .event-actions .action-btn { min-height: 44px; padding: 0 10px; font-size: 14px; white-space: nowrap; }
        .events-note { margin-top: 18px; }
        .event-mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
        .event-mini { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-align: left; }
        .event-mini:hover { border-color: var(--primary); }
        .event-mini .db-day { font-size: 24px; }
        .event-mini-title { display: block; margin-top: 2px; font-size: 17px; font-weight: 800; line-height: 1.25; }
        .event-mini-meta { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }

        @media (max-width: 720px) {
            .rec-title { font-size: 27px; }
            .rec-grid, .social-row.other-row { grid-template-columns: 1fr; }
            .social-row { grid-template-columns: 1fr 50px; }
            .social-row select { grid-column: 1 / -1; }
            .event-card { grid-template-columns: 62px 1fr; gap: 10px; padding: 12px; }
            .event-photo { margin: -12px -12px 0; }
            .event-card .db-day { font-size: 24px; }
        }

        @media (min-width: 721px) {
            .row-nav {
                position: absolute;
                top: 70px;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 1.5px solid var(--border);
                background: var(--surface);
                color: var(--primary);
                box-shadow: var(--shadow);
            }
            .row-nav.prev { left: -16px; }
            .row-nav.next { right: -16px; }
            .row-nav:disabled { opacity: 0; pointer-events: none; }
        }

        @media (max-width: 720px) {
            .search-card { grid-template-columns: 1fr; }
            .hero h1 { font-size: 29px; }
            .brand-name { font-size: 26px; }
            .brand-logo { width: 80px; height: 38px; }
            .modal { padding: 0; align-items: flex-end; }
            .modal-panel { max-height: 94vh; border-radius: 18px 18px 0 0; }
            .modal-hero { height: 200px; }
            .fact { grid-template-columns: 1fr; gap: 2px; }
            .results-tools .field { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container">
            <div class="topbar-actions">
                <button class="top-btn" id="langBtn" type="button"><span data-icon="globe"></span><span id="langLabel">EN</span></button>
                <button class="top-btn" id="themeBtn" type="button"><span id="themeIcon"></span><span id="themeLabel"></span></button>
                <button class="top-btn" id="accountBtn" type="button" hidden><span data-icon="user"></span><span id="accountLabel"></span></button>
                <button class="top-btn solid" id="savedBtn" type="button"><span data-icon="heart"></span><span data-i18n="savedBtn"></span><span class="count-pill" id="savedCount" hidden>0</span></button>
            </div>
            <a class="brand" href="./" id="brandLink" aria-label="ANGOLIVE">
                <svg class="brand-logo" viewBox="20 45 160 75" aria-hidden="true">
                    <path class="wave-red" d="M 30 90 Q 40 80 50 90 T 70 90 T 90 90 T 110 90 T 130 90 T 150 90 T 170 90" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                    <path class="wave-yellow" d="M 30 110 Q 40 100 50 110 T 70 110 T 90 110 T 110 110 T 130 110 T 150 110 T 170 110" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                    <circle class="dot" cx="100" cy="60" r="6"/>
                </svg>
                <span class="brand-name">ANGOLIVE</span>
            </a>
        </div>
    </header>

    <section class="hero" id="hero">
        <div class="container">
            <h1 data-i18n="heroTitle"></h1>
            <p class="hero-sub" data-i18n="heroSub"></p>
            <form class="search-card" id="searchForm" role="search">
                <label class="search-field">
                    <span class="field-label" data-i18n="whatLabel"></span>
                    <span class="input-wrap"><span data-icon="search"></span><input class="field" id="qInput" type="search" autocomplete="off" data-i18n-placeholder="whatPlaceholder"></span>
                </label>
                <label class="search-field">
                    <span class="field-label" data-i18n="whereLabel"></span>
                    <select class="field" id="whereSelect"></select>
                </label>
                <button class="submit-btn" type="submit" data-i18n="explore"></button>
            </form>
            <div class="chips" id="quickFilters" role="group"></div>
            <div class="notice" id="notice" role="status" aria-live="polite"></div>
        </div>
    </section>

    <main class="container">
        <div class="banner" id="offlineBanner" hidden><p data-i18n="offline"></p></div>
        <div class="banner" id="installBanner" hidden></div>
        <div id="homeView"></div>
        <section id="resultsView" hidden aria-labelledby="resultsTitle">
            <div class="results-head">
                <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
                <h2 id="resultsTitle"></h2>
                <p class="results-sub" id="resultsSub"></p>
                <div class="results-tools" id="resultsTools">
                    <span class="results-count" id="resultsCount" aria-live="polite"></span>
                    <select class="field" id="sortSelect" data-i18n-aria="sortLabel"></select>
                </div>
            </div>
            <div class="card-grid" id="resultsList"></div>
        </section>

        <section id="recommendView" class="rec-page" hidden aria-labelledby="recTitle">
            <button class="back-btn" type="button" data-action="home"><span data-icon="back"></span><span data-i18n="backHome"></span></button>
            <h1 class="rec-title" id="recTitle" data-i18n="recTitle"></h1>
            <p class="rec-intro" data-i18n="recIntro"></p>
            <p class="hint" data-i18n="recOwnerNote"></p>
            <div class="banner" id="recUnavailable" hidden><p data-i18n="recUnavailable"></p></div>
            <form class="rec-form" id="recForm" novalidate>
                <fieldset class="rec-group">
                    <legend data-i18n="recAboutPlace"></legend>
                    <div class="rec-grid">
                        <div class="form-group"><label for="recName"><span data-i18n="recName"></span> *</label><input class="field" id="recName" type="text" maxlength="120"></div>
                        <div class="form-group"><label for="recCategory"><span data-i18n="recCategory"></span> *</label><select class="field" id="recCategory"></select></div>
                        <div class="form-group"><label for="recCity"><span data-i18n="recCity"></span> *</label><select class="field" id="recCity"></select></div>
                        <div class="form-group" id="recCityOtherGroup" hidden><label for="recCityOther" data-i18n="recCityOtherLabel"></label><input class="field" id="recCityOther" type="text" maxlength="80"></div>
                        <div class="form-group rec-wide"><label for="recAddress" data-i18n="recAddress"></label><input class="field" id="recAddress" type="text" maxlength="200"></div>
                    </div>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recContacts"></legend>
                    <div class="rec-grid">
                        <div class="form-group"><label for="recPhone" data-i18n="recPhone"></label><input class="field" id="recPhone" type="tel" maxlength="40" autocomplete="off"></div>
                        <div class="form-group"><label for="recEmail" data-i18n="recEmail"></label><input class="field" id="recEmail" type="email" maxlength="120" autocomplete="off"></div>
                        <div class="form-group"><label for="recWebsite" data-i18n="recWebsite"></label><input class="field" id="recWebsite" type="url" inputmode="url" maxlength="300" placeholder="https://"></div>
                        <div class="form-group"><label for="recPress" data-i18n="recPress"></label><input class="field" id="recPress" type="url" inputmode="url" maxlength="300" placeholder="https://"><span class="hint" data-i18n="recPressHint"></span></div>
                    </div>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recSocial"></legend>
                    <div id="recSocialRows"></div>
                    <button class="link-btn" type="button" id="recSocialAdd"><span data-icon="plus"></span><span data-i18n="recSocialAdd"></span></button>
                    <p class="field-label rec-sub" data-i18n="recOtherLink"></p>
                    <div class="social-row other-row">
                        <input class="field" id="recOtherName" type="text" maxlength="60" data-i18n-placeholder="recOtherName" data-i18n-aria="recOtherName">
                        <input class="field" id="recOtherUrl" type="url" inputmode="url" maxlength="300" placeholder="https://" data-i18n-aria="recOtherUrl">
                    </div>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recPhotos"></legend>
                    <p class="hint rec-photos-hint" data-i18n="recPhotosHint"></p>
                    <div id="recPhotoUpload">
                        <label class="photo-picker" id="recPhotoPicker">
                            <span data-icon="camera"></span><span data-i18n="recPhotosAdd"></span>
                            <input id="recPhotoInput" type="file" accept="image/*" multiple>
                        </label>
                        <span class="hint rec-photo-count" id="recPhotoCount" aria-live="polite"></span>
                        <div class="rec-photos" id="recPhotoList"></div>
                        <div class="form-msg" id="recPhotoMsg" role="status" aria-live="polite"></div>
                        <label class="consent" id="recPhotoRightsLabel" hidden><input type="checkbox" id="recPhotoRights"><span data-i18n="recPhotoRights"></span></label>
                    </div>
                    <p class="hint" id="recPhotosEmail" hidden data-i18n="recPhotosEmail"></p>
                </fieldset>
                <fieldset class="rec-group">
                    <legend data-i18n="recAboutYou"></legend>
                    <div class="form-group"><label for="recReason" data-i18n="recReason"></label><textarea class="field" id="recReason" maxlength="500" data-i18n-placeholder="recReasonPlaceholder"></textarea></div>
                    <div class="media-kind rec-relation" role="radiogroup">
                        <label><input type="radio" name="recRelation" value="visitor" checked><span data-i18n="recRelVisitor"></span></label>
                        <label><input type="radio" name="recRelation" value="owner"><span data-i18n="recRelOwner"></span></label>
                    </div>
                    <div class="form-group"><label for="recContact" data-i18n="recContact"></label><input class="field" id="recContact" type="text" maxlength="120" autocomplete="email"></div>
                    <label class="consent"><input type="checkbox" id="recConsent"><span data-i18n="recConsent"></span></label>
                </fieldset>
                <div class="form-msg" id="recMsg" role="alert"></div>
                <button class="submit-btn" type="submit" id="recSubmit" data-i18n="recSubmit"></button>
            </form>
            <div class="rec-success" id="recSuccess" hidden>
                <h2 data-i18n="recThanksTitle"></h2>
                <p id="recThanksText"></p>
                <div class="banner-actions">
                    <button class="submit-btn" type="button" id="recAnother" data-i18n="recAnother"></button>
                    <button class="submit-btn secondary" type="button" data-action="home" data-i18n="backHome"></button>

            taxi: ['candongueiro', 'yango'], uber: ['yango'], onibus: ['autocarro'], bus: ['autocarro'], train: ['comboio'],
            voo: ['aeroporto'], flight: ['aeroporto'], airport: ['aeroporto'], ferry: ['travessia'], boat: ['barco', 'travessia'],
            gym: ['ginasio'], academia: ['ginasio'], pool: ['piscina'], swimming: ['piscina'], natacao: ['piscina'],
            mall: ['shopping'], compras: ['shopping'], square: ['largo'], praca: ['largo'], pub: ['bar'], cocktail: ['bar']
        };

        const STOPWORDS = new Set(['a', 'o', 'as', 'os', 'e', 'em', 'no', 'na', 'nos', 'nas', 'de', 'da', 'do', 'das', 'dos', 'para', 'com', 'um', 'uma', 'the', 'of', 'in', 'and', 'to', 'at']);

        function normalize(text) {
            return String(text).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        }

        // Portuguese plurals: hotéis→hotel, locais→local, mares→mar, praias→praia.
        function stem(word) {
            if (word.length <= 3) return word;
            if (/(oe|ae)s$/.test(word)) return `${word.slice(0, -3)}ao`;
            if (word.endsWith('ais')) return `${word.slice(0, -3)}al`;
            if (word.endsWith('eis')) return `${word.slice(0, -3)}el`;
            if (word.endsWith('ois')) return `${word.slice(0, -3)}ol`;
            if (word.endsWith('ns')) return `${word.slice(0, -2)}m`;
            if (/[rzs]es$/.test(word)) return word.slice(0, -2);
            if (word.endsWith('s')) return word.slice(0, -1);
            return word;
        }

        function tokens(text) {
            return normalize(text).split(/[^a-z0-9]+/).filter((w) => w && !STOPWORDS.has(w)).map(stem);
        }

        function withinOneEdit(a, b) {
            if (Math.abs(a.length - b.length) > 1) return false;
            let i = 0;
            let j = 0;
            let edits = 0;
            while (i < a.length && j < b.length) {
                if (a[i] === b[j]) { i++; j++; continue; }
                if (++edits > 1) return false;
                if (a.length > b.length) i++;
                else if (a.length < b.length) j++;
                else { i++; j++; }
            }
            return edits + (a.length - i) + (b.length - j) <= 1;
        }

        const tokenMatches = (word, list) => list.some((tk) => tk.startsWith(word) || (word.length >= 5 && withinOneEdit(word, tk)));

        let searchIndex = null;
        function index() {
            if (searchIndex) return searchIndex;
            const fullText = (v) => [
                v.name, v.location, v.address || '', v.description, DESC_EN[v.id] || '', v.highlight?.pt || '', v.highlight?.en || '',
                CATEGORY[v.type].keywords, CATEGORY[v.type].pt.join(' '), CATEGORY[v.type].en.join(' '),
                v.family ? 'família famílias crianças family families kids' : '',
                v.price?.free ? 'grátis gratuito gratuita entrada free' : ''
            ].join(' ');
            searchIndex = {
                all: new Map(venues.map((v) => [v.id, tokens(fullText(v))])),
                name: new Map(venues.map((v) => [v.id, tokens(v.name)])),
                category: Object.fromEntries(Object.entries(CATEGORY).map(([key, c]) => [key, tokens(`${c.keywords} ${c.pt.join(' ')} ${c.en.join(' ')}`)]))
            };
            return searchIndex;
        }

        const alternatives = (word) => [word, ...(SYNONYMS[word] || [])];

        function matchesQuery(v, q) {
            const words = tokens(q);
            return words.every((w) => alternatives(w).some((alt) => tokenMatches(alt, index().all.get(v.id))));
        }

        // Name matches rank first, then places whose category fits the words, then any other text match.
        function queryScore(v, q) {
            const words = tokens(q);
            if (!words.length) return 0;
            const hits = (list) => (w) => alternatives(w).some((alt) => tokenMatches(alt, list));
            if (words.every(hits(index().name.get(v.id)))) return 3;
            if (words.some(hits(index().category[v.type]))) return 2;
            return 1;
        }

        /* ---------- Opening hours (Angola time, UTC+1, no daylight saving) ---------- */

        const toMinutes = (hhmm) => {
            const [h, m] = hhmm.split(':').map(Number);
            return h * 60 + m;
        };

        function luandaNow() {
            const d = new Date(Date.now() + 60 * 60 * 1000);
            return { day: d.getUTCDay(), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
        }

        function weekdayName(day) {
            return new Intl.DateTimeFormat(locale(), { weekday: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(2024, 0, 7 + day)));
        }

        function openStatus(v) {
            if (!v.hours) return null;
            const { day, minutes } = luandaNow();
            for (const [o, c] of v.hours[day] || []) {
                const open = toMinutes(o);
                const close = toMinutes(c) <= open ? toMinutes(c) + 1440 : toMinutes(c);
                if (minutes >= open && minutes < close) return { open: true, until: c };
            }
            for (const [o, c] of v.hours[(day + 6) % 7] || []) {
                if (toMinutes(c) <= toMinutes(o) && minutes < toMinutes(c)) return { open: true, until: c };
            }
            for (let i = 0; i < 7; i++) {
                const d = (day + i) % 7;
                const next = (v.hours[d] || []).find(([o]) => i > 0 || toMinutes(o) > minutes);
                if (next) return { open: false, at: next[0], day: i === 0 ? null : d };
            }
            return { open: false };
        }

        function statusText(status) {
            if (!status) return '';
            if (status.open) return t('openUntil', { time: status.until });
            if (!status.at) return t('closed');
            return status.day === null ? t('closedOpensAt', { time: status.at }) : t('closedOpensDay', { day: weekdayName(status.day), time: status.at });
        }

        function statusHTML(v) {
            const status = openStatus(v);
            return status ? `<span class="${status.open ? 'status-open' : 'status-closed'}">${statusText(status)}</span>` : '';
        }

        /* ---------- Location ---------- */

        function kmBetween(a, b) {
            const rad = (d) => (d * Math.PI) / 180;
            const dLat = rad(b.lat - a.lat);
            const dLng = rad(b.lng - a.lng);
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
        }

        const distanceKm = (v) => (state.userPos ? kmBetween(state.userPos, v) : null);
        const formatKm = (km) => km.toLocaleString(locale(), { maximumFractionDigits: km < 100 ? 1 : 0 });

        function distanceText(v) {
            const km = distanceKm(v);
            return km === null ? '' : t('distance', { d: formatKm(km) });
        }

        function setNotice(text) {
            $('notice').textContent = text;
        }

        function locate() {
            if (state.userPos) return;
            if (!navigator.geolocation) { setNotice(t('locError')); return; }
            setNotice(t('locating'));
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    setNotice('');
                    render();
                    if (state.openId) openVenue(state.openId, true);
                },
                () => setNotice(t('locError')),
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
            );
        }

        /* ---------- Images ---------- */

        // Photos are stored with the site (photos/), so they load wherever the site loads, also offline.
        // The iPhone app only bundles the page, so it fetches them from the public site.
        const asset = (src) => (src && inNativeApp && !/^(https?:|blob:|data:)/.test(src) ? new URL(src, PUBLIC_URL).href : src);

        function thumbSrc(v) {
            if (v.photos) return asset(v.photos[0].thumb);
            return v.image ? asset(v.image.replace('-800.jpg', '-600.jpg')) : '';
        }

        const fullSrc = (photo) => asset(photo.url.replace('/1280px-', '/960px-'));

        function creditHTML(photo) {
            return `${t('photoBy')}: <a href="${escapeHTML(photo.page)}" target="_blank" rel="noopener">${escapeHTML(photo.author)}</a> · ${escapeHTML(photo.license)} · Wikimedia Commons`;
        }

        // A venue photo carries a caption when it shows something next to the place, such as the building it is in.
        const placePhotoMeta = (photo) => `${photo.caption ? `${escapeHTML(photo.caption[lang])} · ` : ''}${creditHTML(photo)}`;

        // Show the small image the card already loaded straight away, then swap in the sharper one.
        function upgradeHero(src) {
            const img = $('heroImg');
            if (!img) return;
            const sharp = new Image();
            sharp.crossOrigin = 'anonymous';
            sharp.onload = () => { if ($('heroImg') === img) img.src = src; };
            sharp.src = src;
        }

        function heroHTML(v) {
            const photos = v.photos || [];
            const hero = `
                <div class="modal-hero">
                    <span>${escapeHTML(initials(v.name))}</span>
                    ${thumbSrc(v) ? `<img id="heroImg" src="${escapeHTML(thumbSrc(v))}" alt="${escapeHTML(v.name)}" crossorigin="anonymous" onerror="this.remove()">` : ''}
                    ${!photos.length && v.image ? `<span class="photo-badge">${t('illustrative')}</span>` : ''}
                </div>`;
            if (!photos.length) return hero;
            return `${hero}
                <div class="photo-meta">
                    <p class="photo-credit" id="heroCredit">${placePhotoMeta(photos[0])}</p>
                    ${photos.length > 1 ? `<div class="photo-strip">${photos.map((p, i) => `
                        <button type="button" class="photo-thumb${i === 0 ? ' active' : ''}" data-photo="${i}" aria-label="${t('photoN', { n: i + 1 })}">
                            <img src="${escapeHTML(asset(p.thumb))}" alt="" crossorigin="anonymous" loading="lazy">
                        </button>`).join('')}</div>` : ''}
                </div>`;
        }

        function showPhoto(index) {
            const v = venues.find((x) => x.id === state.openId);
            const photo = v?.photos?.[index];
            if (!photo) return;
            const img = $('heroImg');
            if (img) img.src = asset(photo.thumb);
            upgradeHero(fullSrc(photo));
            $('heroCredit').innerHTML = placePhotoMeta(photo);
            document.querySelectorAll('.photo-thumb').forEach((b) => b.classList.toggle('active', Number(b.dataset.photo) === index));
        }

        // Without verified coordinates, let Google Maps find the place by name.
        function mapsURL(v, mode) {
            const target = v.exact ? `${v.lat},${v.lng}` : encodeURIComponent(`${v.name}, ${v.location}, Angola`);
            return mode === 'directions'
                ? `https://www.google.com/maps/dir/?api=1&destination=${target}`
                : `https://www.google.com/maps/search/?api=1&query=${target}`;
        }

        function mapEmbedURL(v) {
            const dLat = 0.006;
            const dLng = 0.01;
            return `https://www.openstreetmap.org/export/embed.html?bbox=${v.lng - dLng},${v.lat - dLat},${v.lng + dLng},${v.lat + dLat}&layer=mapnik&marker=${v.lat},${v.lng}`;
        }

        /* ---------- Ratings (only real, approved reviews) ---------- */

        const statsOf = (v) => ratingStats[v.id];
        const reviewCountText = (n) => (n === 1 ? t('reviewOne') : t('reviewMany', { n }));

        function ratingLinkHTML(stats) {
            return stats ? `<span class="rating">★ ${stats.avg.toFixed(1)}</span>${reviewCountText(stats.count)}` : t('opinionsLink');
        }

        function avgHTML(stats) {
            return `
                <div class="avg-number">${stats ? stats.avg.toFixed(1) : '—'}</div>
                ${stats ? `<div class="stars" aria-hidden="true">${stars(stats.avg)}</div>` : ''}
                <div class="avg-count">${reviewCountText(stats?.count || 0)}</div>`;
        }

        // Stats arrive after the first render; update an already open place in place.
        function refreshOpenRating() {
            const v = venues.find((x) => x.id === state.openId);
            if (!v) return;
            const link = document.querySelector('#venuePanel .rating-link');
            const avg = document.querySelector('#reviewsSection .avg');
            const note = $('ratingNote');
            if (link) link.innerHTML = ratingLinkHTML(statsOf(v));
            if (avg) avg.innerHTML = avgHTML(statsOf(v));
            if (note) note.hidden = !statsOf(v);
        }

        async function loadRatingStats() {
            if (!reviewsEnabled()) return;
            try {
                const res = await sbRequest('/rest/v1/review_stats?select=venue_id,avg_rating,review_count', { headers: sbHeaders() });
                ratingStats = Object.fromEntries((await res.json()).map((r) => [r.venue_id, { avg: Number(r.avg_rating), count: r.review_count }]));
                render();
                refreshOpenRating();
            } catch {
                ratingStats = {};
            }
        }

        /* ---------- Filters and URL ---------- */

        const slug = (text) => normalize(text).replace(/[^a-z0-9]+/g, '-');
        const hasFilters = (f) => Boolean(f.q || f.where || f.quick || f.category || f.collection || f.saved);

        function filtersToQuery(f) {
            const params = new URLSearchParams();
            if (f.q) params.set('q', f.q);
            if (f.where) params.set('where', f.where === 'near' ? 'near' : slug(f.where));
            if (f.quick) params.set('filter', f.quick);
            if (f.category) params.set('category', f.category);
            if (f.collection) params.set('collection', f.collection);
            if (f.saved) params.set('saved', '1');
            return params.toString();
        }

        function filtersFromQuery(search) {
            const params = new URLSearchParams(search);
            const where = params.get('where');
            const has = (obj, key) => Boolean(key && Object.prototype.hasOwnProperty.call(obj, key));
            return {
                q: (params.get('q') || '').slice(0, 80),
                where: where === 'near' ? 'near' : CITIES.find((c) => slug(c) === where) || '',
                quick: has(QUICK, params.get('filter')) ? params.get('filter') : null,
                category: has(CATEGORY, params.get('category')) ? params.get('category') : null,
                collection: has(COLLECTIONS, params.get('collection')) ? params.get('collection') : null,
                saved: params.get('saved') === '1'
            };
        }

        function collectionMatch(key, v) {
            const c = COLLECTIONS[key];
            return c.ids ? c.ids.includes(v.id) : c.match(v);
        }

        function filteredVenues() {
            const f = state.filters;
            const list = venues.filter((v) =>
                (!f.saved || favorites.includes(v.id)) &&
                (!f.category || v.type === f.category) &&
                (!f.collection || collectionMatch(f.collection, v)) &&
                (!f.quick || QUICK[f.quick].match(v)) &&
                (!f.where || f.where === 'near' || cityOf(v) === f.where) &&
                matchesQuery(v, f.q)
            );
            const useDistance = state.userPos && (state.sort === 'distance' || (state.sort === 'relevance' && (f.where === 'near' || f.quick === 'near')));
            const byRating = (a, b) => (statsOf(b)?.avg || 0) - (statsOf(a)?.avg || 0) || (statsOf(b)?.count || 0) - (statsOf(a)?.count || 0);
            const recRank = (v) => {
                if (f.collection && COLLECTIONS[f.collection].ids) return COLLECTIONS[f.collection].ids.indexOf(v.id);
                const i = RECOMMENDED.indexOf(v.id);
                return i === -1 ? 99 : i;
            };
            const sorters = {
                relevance: (a, b) => queryScore(b, f.q) - queryScore(a, f.q) || recRank(a) - recRank(b) || byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                rating: (a, b) => byRating(a, b) || a.name.localeCompare(b.name, 'pt'),
                price: (a, b) => priceValue(a) - priceValue(b) || a.name.localeCompare(b.name, 'pt'),
                name: (a, b) => a.name.localeCompare(b.name, 'pt'),
                distance: (a, b) => distanceKm(a) - distanceKm(b)
            };
            const key = state.sort === 'distance' || (state.sort === 'rating' && !reviewsEnabled()) ? 'relevance' : state.sort;
            return list.sort(useDistance ? sorters.distance : sorters[key]);
        }

        function syncSearchForm() {
            $('qInput').value = state.filters.q;
            $('whereSelect').value = state.filters.where;
        }

        function showResults(filters, { push = true, scroll = true } = {}) {
            state.filters = { ...DEFAULT_FILTERS, ...filters };
            state.view = 'results';
            state.sort = 'relevance';
            renderSortOptions();
            syncSearchForm();
            if (push) history.pushState(null, '', `${location.pathname}?${filtersToQuery(state.filters)}`);
            if (state.filters.where === 'near' || state.filters.quick === 'near') locate();
            render();
            if (scroll) $('resultsView').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showRecommend({ push = true } = {}) {
            state.view = 'recommend';
            prepareRecommendForm();
            if (push) history.pushState(null, '', `${location.pathname}?page=recommend`);
            render();
            window.scrollTo({ top: 0 });
            $('recTitle').focus?.();
        }

        function goHome({ push = true } = {}) {
            state.view = 'home';
            state.filters = { ...DEFAULT_FILTERS };
            syncSearchForm();
            if (push) history.pushState(null, '', location.pathname);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function applyURL() {
            const filters = filtersFromQuery(location.search);
            const params = new URLSearchParams(location.search);
            if (params.get('page') === 'recommend') {
                if (state.view !== 'recommend') showRecommend({ push: false });
            } else if (params.get('page') === 'events') showEvents({ push: false, filters: eventFiltersFromQuery(params) });
            else if (hasFilters(filters)) showResults(filters, { push: false, scroll: false });
            else if (state.view !== 'home') goHome({ push: false });
            const deepLink = location.hash.match(/^#local-(\d+)$/);
            if (deepLink) openVenue(Number(deepLink[1]));
            else if (state.openId) closeModal('venueModal', { updateURL: false });
            const eventLink = location.hash.match(/^#evento-([\w-]+)$/);
            if (eventLink && state.view === 'events') focusEvent(eventLink[1]);
        }

        /* ---------- Cards and rows ---------- */

        function cardHTML(v, options = {}) {
            const stats = statsOf(v);
            const dist = distanceText(v);
            const saved = favorites.includes(v.id);
            const highlight = options.reason
                ? `<p class="card-reason"><b>${t('why')}</b> ${escapeHTML(highlightOf(v))}</p>`
                : `<p class="card-highlight">${escapeHTML(highlightOf(v))}</p>`;
            return `
                <article class="card">
                    <button class="card-media" type="button" data-open="${v.id}" aria-label="${t('viewPlace')}: ${escapeHTML(v.name)}">
                        <span aria-hidden="true">${escapeHTML(initials(v.name))}</span>
                        ${thumbSrc(v) ? `<img src="${escapeHTML(thumbSrc(v))}" alt="" crossorigin="anonymous" loading="lazy" onerror="this.remove()">` : ''}
                        ${saved ? `<span class="saved-tag">${icon('heart')}${t('saved')}</span>` : ''}
                    </button>
                    <div class="card-body">
                        <span class="card-type">${icon(CATEGORY[v.type].icon)}${catLabel(v.type, false)} · ${escapeHTML(placeLine(v))}</span>
                        <h3 class="card-name"><button type="button" data-open="${v.id}">${escapeHTML(v.name)}</button></h3>
                        <div class="card-facts">
                            ${stats ? `<span><span class="rating">★ ${stats.avg.toFixed(1)}</span> ${reviewCountText(stats.count)}</span>` : ''}
                            <span><strong>${escapeHTML(priceText(v))}</strong></span>
                            ${options.fromLuanda ? `<span>${t('fromLuanda', { d: formatKm(kmBetween(LUANDA_CENTRE, v)) })}</span>` : dist ? `<span>${dist}</span>` : ''}
                            ${statusHTML(v)}
                        </div>
                        ${highlight}
                        <div class="card-actions">
                            <button class="action-btn" type="button" data-open="${v.id}">${t('viewPlace')}</button>
                            ${v.citywide ? '' : `<a class="action-btn solid" href="${mapsURL(v, 'directions')}" target="_blank" rel="noopener">${t('directions')}</a>`}
                        </div>
                    </div>
                </article>
            `;
        }

        function rowHTML(list, options) {
            return `
                <div class="row-wrap">
                    <button class="row-nav prev" type="button" data-scroll="-1" aria-label="${t('prevRow')}" disabled>${icon('back')}</button>
                    <div class="card-row">${list.map((v) => cardHTML(v, options)).join('')}</div>
                    <button class="row-nav next" type="button" data-scroll="1" aria-label="${t('nextRow')}">${icon('next')}</button>
                </div>`;
        }

        // Arrows and the fade only show while there is more to scroll.
        function updateRowControls(row) {
            const wrap = row.closest('.row-wrap');
            if (!wrap) return;
            const atStart = row.scrollLeft <= 4;
            const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
            wrap.querySelector('.prev').disabled = atStart;
            wrap.querySelector('.next').disabled = atEnd;
            row.classList.toggle('fade-end', !atEnd);
        }

        function sectionHTML(id, title, sub, body, more) {
            return `
                <section class="home-section" aria-labelledby="${id}">
                    <div class="section-head">
                        <h2 id="${id}">${title}</h2>
                        ${more ? `<button class="link-btn" type="button" data-more='${escapeHTML(JSON.stringify(more))}'>${t('seeAll')}</button>` : ''}
                    </div>
                    ${sub ? `<p class="section-sub">${sub}</p>` : ''}
                    ${body}
                </section>
            `;
        }

        function categoryTilesHTML() {
            return `<div class="tile-grid">${Object.entries(CATEGORY).map(([key, c]) => {
                const count = venues.filter((v) => v.type === key).length;
                return `<button class="tile" type="button" data-category="${key}">${icon(c.icon)}<span class="tile-label">${c[lang][0]}</span><span class="tile-count">${placesCount(count)}</span></button>`;
            }).join('')}</div>`;
        }

        const recommendedList = () => RECOMMENDED.map((id) => venues.find((v) => v.id === id)).filter(Boolean);

        /* ---------- Home ---------- */

        function renderHome() {
            const parts = [];
            const savedList = venues.filter((v) => favorites.includes(v.id));
            if (savedList.length) parts.push(sectionHTML('secSaved', t('savedTitle'), '', rowHTML(savedList), { saved: true }));

            parts.push(sectionHTML('secRecommended', t('recommendedTitle'), t('recommendedSub'), rowHTML(recommendedList(), { reason: true })));

            const nextEvents = upcomingEvents().slice(0, 3);
            if (nextEvents.length) {
                parts.push(`
                    <section class="home-section" aria-labelledby="secEvents">
                        <div class="section-head">
                            <h2 id="secEvents">${t('eventsHomeTitle')}</h2>
                            <button class="link-btn" type="button" data-action="events">${t('eventsSeeAll')}</button>
                        </div>
                        <p class="section-sub">${t('eventsHomeSub')}</p>
                        <div class="event-mini-grid">${nextEvents.map(eventMiniHTML).join('')}</div>
                    </section>`);
            }
            parts.push(sectionHTML('secCategories', t('categoriesTitle'), '', categoryTilesHTML()));

            const collections = Object.entries(COLLECTIONS).map(([key, c]) => {
                const count = venues.filter((v) => collectionMatch(key, v)).length;
                const cover = venues.find((v) => v.id === c.cover);
                return `
                    <button class="collection" type="button" data-collection="${key}">
                        ${cover?.photos ? `<img src="${escapeHTML(asset(cover.photos[0].thumb))}" alt="" crossorigin="anonymous" loading="lazy">` : ''}
                        <span class="collection-title">${t(c.title)}</span>
                        <span class="collection-desc">${t(c.desc)} · ${placesCount(count)}</span>
                    </button>`;
            }).join('');
            parts.push(sectionHTML('secCollections', t('collectionsTitle'), t('collectionsSub'), `<div class="collection-grid">${collections}</div>`));

            const dayTrips = venues
                .filter((v) => v.exact && kmBetween(LUANDA_CENTRE, v) >= 25 && kmBetween(LUANDA_CENTRE, v) <= 160)
                .sort((a, b) => kmBetween(LUANDA_CENTRE, a) - kmBetween(LUANDA_CENTRE, b));
            if (dayTrips.length) parts.push(sectionHTML('secDayTrips', t('dayTripsTitle'), t('dayTripsSub'), rowHTML(dayTrips, { fromLuanda: true })));

            if (canRecommend()) {
                parts.push(`
                    <section class="home-cta" aria-labelledby="recCtaTitle">
                        <div><h2 id="recCtaTitle">${t('recCtaTitle')}</h2><p>${t('recCtaText')}</p></div>
                        <button class="submit-btn" type="button" data-action="recommend">${t('recTitle')}</button>
                    </section>`);
            }

            $('homeView').innerHTML = parts.join('');
            document.querySelectorAll('#homeView .card-row').forEach(updateRowControls);
        }

        /* ---------- Results ---------- */

        function resultsTitle() {
            const f = state.filters;
            if (f.saved) return t('savedTitle');
            if (f.collection) return t(COLLECTIONS[f.collection].title);
            if (f.category) return catLabel(f.category, true);
            if (f.quick) return t(QUICK[f.quick].label);
            if (f.q) return t('resultsFor', { q: f.q });
            if (f.where === 'near') return t('nearYou');
            if (f.where) return t('inCity', { city: f.where });
            return t('allPlaces');
        }

        function resultsSub() {
            const f = state.filters;
            const parts = [];
            if (f.collection) parts.push(t(COLLECTIONS[f.collection].desc));
            if (f.quick && QUICK[f.quick].note) parts.push(t(QUICK[f.quick].note));
            if (f.q && (f.category || f.collection || f.quick)) parts.push(t('resultsFor', { q: f.q }));
            if (f.where && f.where !== 'near' && resultsTitle() !== t('inCity', { city: f.where })) parts.push(t('inCity', { city: f.where }));
            return parts.join(' · ');
        }

        function emptyHTML() {
            return `
                <div class="empty-block">
                    <p>${state.filters.saved ? t('emptySaved') : t('emptyFilter')}</p>
                    <button class="submit-btn" type="button" data-action="clear">${t('clearSearch')}</button>
                    <p class="hint">${t('emptyTry')}</p>
                    ${categoryTilesHTML()}
                </div>
                ${sectionHTML('secEmptyRecommended', t('recommendedTitle'), '', rowHTML(recommendedList(), { reason: true }))}`;

            $('resultsTitle').textContent = resultsTitle();
            $('resultsSub').textContent = resultsSub();

            if (list.length) {
                $('resultsList').className = 'card-grid';
                $('resultsList').innerHTML = list.map((v) => cardHTML(v)).join('');
            } else {
                $('resultsList').className = '';

                document.querySelectorAll('#resultsList .card-row').forEach(updateRowControls);

        function renderQuickFilters() {
            const agenda = `<button type="button" class="chip" data-action="events">${icon('calendar')}${t('agenda')}</button>`;
            $('quickFilters').innerHTML = agenda + Object.entries(QUICK)
                .filter(([, q]) => !q.show || q.show())
                .map(([key, q]) => {

                    return `<button type="button" class="chip${active ? ' active' : ''}" data-quick="${key}" aria-pressed="${active}">${icon(q.icon)}${t(q.label)}</button>`;

        function renderWhereOptions() {
            $('whereSelect').innerHTML = [
                `<option value="">${t('whereAll')}</option>`,
                `<option value="near">${t('nearMe')}</option>`,

            $('whereSelect').value = state.filters.where;
        }

        function renderSortOptions() {
            const options = ['relevance', 'distance', ...(reviewsEnabled() ? ['rating'] : []), 'price', 'name'];
            const labels = { relevance: 'sortRelevance', distance: 'sortDistance', rating: 'sortRating', price: 'sortPrice', name: 'sortName' };
            $('sortSelect').innerHTML = options.map((o) => `<option value="${o}">${t(labels[o])}</option>`).join('');

            $('savedCount').textContent = favorites.length;

            renderQuickFilters();

            $('resultsView').hidden = state.view !== 'results';
            $('recommendView').hidden = state.view !== 'recommend';
            $('eventsView').hidden = state.view !== 'events';

        /* ---------- Place details ---------- */

        function socialLinks(v) {
            const q = `${v.name} ${cityOf(v)} Angola`;
            const enc = encodeURIComponent(q);
            return [
                ['YouTube', `https://www.youtube.com/results?search_query=${enc}`],
                ['Instagram', `https://www.google.com/search?q=${encodeURIComponent(q + ' site:instagram.com')}`],
                ['TikTok', `https://www.tiktok.com/search?q=${enc}`]
            ].map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`).join('');

        function hoursHTML(v) {
            if (!v.hours) return v.hoursText ? escapeHTML(v.hoursText[lang] || v.hoursText.pt) : t('toConfirm');
            const today = luandaNow().day;
            const order = [1, 2, 3, 4, 5, 6, 0];
            return `${statusHTML(v)}<ul class="week">${order.map((d) => {
                const slots = v.hours[d];
                const text = slots ? slots.map(([o, c]) => `${o}–${c}`).join(', ') : t('closed');
                return `<li class="${d === today ? 'today' : ''}"><span>${weekdayName(d)}</span><span>${text}</span></li>`;
            }).join('')}</ul>`;
        }

        function verifiedRowHTML(v) {
            if (!v.verified) return `<div class="fact"><dt>${t('notVerifiedLabel')}</dt><dd>${t('notVerified')}</dd></div>`;
            const date = formatDate(v.verified.date);
            const sources = v.verified.sources.length
                ? `<br>${t('sourcesLabel')}: ${v.verified.sources.map((s) => `<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener">${escapeHTML(s.label)}</a>`).join(', ')}`

            const text = v.exact ? t('verifiedExact', { date }) : t('verifiedApprox', { date });

        function practicalHTML(v) {

                <section>
                    <h3 class="section-title">${t('practicalInfo')}</h3>

        async function loadReviews(venueId) {
            if (!reviewsEnabled()) return;
            try {
                const res = await sbRequest(`/rest/v1/reviews?select=id,author,rating,comment,created_at&venue_id=eq.${venueId}&status=eq.approved&order=created_at.desc&limit=50`, { headers: sbHeaders() });
